# J.A.R.V.I.S. Configuration Example
# Copy to ~/.jarvis/config.yaml and customize

daemon:
  port: 3142
  data_dir: "~/.jarvis"
  db_path: "~/.jarvis/jarvis.db"
  # Public origin written into sidecar enrollment JWTs (`brain` + `jwks`).
  # For remote sidecars, set this to the externally reachable URL/host they
  # can actually reach, not localhost or a private/container-only hostname.
  # Env override: JARVIS_BRAIN_DOMAIN="https://brain.example.com"
  # brain_domain: "https://brain.example.com"

# Authentication — protects dashboard, API, and WebSocket.
# If unset, the application is open (no auth).
# Can also be set via JARVIS_AUTH_TOKEN env var.
# auth:
#   token: "your-secret-token-here"

llm:
  # ── Legacy single-LLM config (still supported) ──
  # If you only set `primary`, the system runs in classic single-orchestrator
  # mode using that provider for everything. The `fallback` chain is
  # DEPRECATED - tier fall-up (see below) replaces it.
  primary: "anthropic"
  fallback:
    - "openai"
    - "ollama"

  # ── Tier routing (opt-in) ──
  # Map each tier to a (provider, optional model override). When `conversation`
  # is configured, the router-first architecture activates: a thin conversation
  # LLM delegates work to the task tiers (low/medium/high) and verbalizes the
  # results. When `conversation` is unset, the system stays in classic mode
  # using `medium` (with fall-up to `high`) for all work.
  #
  # Tier fall-up: low -> medium -> high. Configure at least `medium` or `high`.
  #
  # tiers:
  #   conversation: { provider: "openai",    model: "gpt-4o-mini" }
  #   high:         { provider: "anthropic", model: "claude-opus-4-7" }
  #   medium:       { provider: "anthropic", model: "claude-sonnet-4-6" }
  #   low:          { provider: "groq",      model: "llama-3.3-70b-versatile" }

  # Anthropic (Claude) configuration
  anthropic:
    api_key: "sk-ant-..."
    model: "claude-sonnet-4-5-20250929"

  # OpenAI (GPT) configuration
  openai:
    api_key: "sk-..."
    model: "gpt-4o"

  # Groq (OpenAI-compatible) configuration
  # groq:
  #   api_key: "gsk_..."
  #   model: "llama-3.3-70b-versatile"

  # OpenRouter (access hundreds of models via single API key)
  # openrouter:
  #   api_key: "sk-or-..."
  #   model: "anthropic/claude-sonnet-4"

  # NVIDIA NIM (standard, free NVIDIA NIM OpenAI-compatible API)
  # NVIDIA_API_KEY env variable replaces this if set
  # nvidia:
  #   api_key: "nvapi-..."
  #   model: "mistral-nemo-minitron-8b-base" # Alternatives: usdcode, gemma-2-2b-it

  # Ollama (local models) configuration
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3"

  # OpenAI-compatible (llama.cpp, vLLM, LM Studio, TGI, Together, Anyscale)
  # Any backend that speaks /v1/chat/completions. The /v1 suffix is required.
  # API key is optional -- most local servers skip auth.
  # openai_compatible:
  #   base_url: "http://localhost:8080/v1"
  #   model: "your-model-name"
  #   api_key: ""

personality:
  core_traits:
    - "loyal"
    - "efficient"
    - "proactive"
    - "respectful"
    - "adaptive"

authority:
  # Default authority level (0-5)
  # 0: No permission (ask for everything)
  # 1: Read-only operations
  # 2: Safe modifications
  # 3: Standard operations (default)
  # 4: System changes
  # 5: Full control
  default_level: 3

# System cron triggers. Each fires `cron.<name>` on the shared event bus.
# Phase 2 will hook the goal system + commitment executor onto these so the
# 15-minute heartbeat poll can be removed. Defaults shown below.
# cron:
#   morning: "0 7 * * *"   # 7am local
#   evening: "0 20 * * *"  # 8pm local
#   hourly:  "37 * * * *"  # every hour at :37

# Text-to-Speech (voice output)
tts:
  enabled: false
  provider: "edge"            # "edge" (free) or "elevenlabs" (API key required)
  voice: "en-US-AriaNeural"  # Microsoft Edge TTS voice
  rate: "+0%"                 # Speaking rate: "-20%" (slow) to "+30%" (fast)
  volume: "+0%"               # Volume adjustment
  # ElevenLabs (uncomment to use)
  # elevenlabs:
  #   api_key: "sk_..."
  #   voice_id: ""             # Leave empty for default voice, or set a specific voice ID
  #   model: "eleven_flash_v2_5"  # "eleven_flash_v2_5" (fast) or "eleven_multilingual_v2" (quality)
  #   stability: 0.5
  #   similarity_boost: 0.75

# Speech-to-Text (voice input)
# stt:
#   provider: "openai"         # openai, groq, or local
#   openai:
#     api_key: "sk-..."

# Active role (must match a filename in roles/ without extension)
active_role: "personal-assistant"
