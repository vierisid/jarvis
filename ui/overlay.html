<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Awareness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: rgba(15, 15, 25, 0.92);
    --surface: rgba(25, 25, 40, 0.95);
    --border: rgba(0, 212, 255, 0.15);
    --accent: #00d4ff;
    --accent-dim: rgba(0, 212, 255, 0.3);
    --text: #e0e0e0;
    --text-dim: #808090;
    --text-muted: #505060;
    --success: #4caf50;
    --warning: #f59e0b;
    --error: #ef4444;
  }

  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  .overlay {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 10px;
    gap: 8px;
    overflow-y: auto;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
  }

  .header .logo {
    color: var(--accent);
    font-weight: 700;
    font-size: 11px;
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
  }

  .status-dot {
    width: 5px; height: 5px; border-radius: 50%;
    display: inline-block; margin-right: 4px; vertical-align: middle;
  }
  .status-dot.active {
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
    animation: pulse 2s ease-in-out infinite;
  }
  .status-dot.inactive { background: var(--text-muted); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .context {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11px;
  }
  .context-app {
    font-weight: 600; color: var(--accent); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .context-window {
    color: var(--text-dim); font-size: 10px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .context-session { color: var(--text-muted); font-size: 9px; margin-top: 3px; }

  /* Tip panel */
  .tip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    flex: 1;
    overflow: hidden;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .tip.visible { opacity: 1; transform: translateY(0); }
  .overlay > * { flex-shrink: 0; }
  .tip form, #savedRoutines { -webkit-app-region: no-drag; font-size: 11px; color: var(--text); }
  .tip form { margin-top: 8px; user-select: text; }
  .tip form label { display: block; margin: 8px 0; }
  .tip form input, .tip form textarea, .tip form select {
    display: block; width: 100%; margin-top: 4px; padding: 6px;
    background: var(--bg); color: var(--text); border: 1px solid var(--text-dim); border-radius: 5px; font: inherit;
  }
  .tip form textarea { min-height: 60px; resize: vertical; }
  .tip form button { width: 100%; padding: 8px; }
  .tip-btn:disabled { opacity: .6; cursor: wait; }
  .tip-btn:focus-visible, .tip form :focus-visible, summary:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .tip[data-composition] .tip-body { display: block; overflow: visible; white-space: pre-line; }
  .tip details { margin-top: 8px; font-size: 11px; -webkit-app-region: no-drag; user-select: text; }
  .tip details p { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #routineRequests .tip-btn { display: block; width: 100%; margin-top: 6px; padding: 8px; text-align: left; color: var(--text); }
  .tip [role="status"] { margin-top: 8px; color: var(--text); font-size: 11px; }
  @media (prefers-reduced-motion: reduce) { .tip, .tip-btn { transition: none; } .status-dot { animation: none; } }

  .tip-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }

  .tip-type {
    display: inline-block; font-size: 8px; padding: 1px 5px;
    border-radius: 3px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .tip-type.error { background: rgba(239, 68, 68, 0.2); color: var(--error); }
  .tip-type.stuck { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
  .tip-type.general { background: rgba(0, 212, 255, 0.15); color: var(--accent); }

  .tip-title { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .tip-body {
    font-size: 10px; color: var(--text-dim); line-height: 1.4;
    overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    flex: 1;
  }

  /* Action buttons */
  .tip-actions {
    display: flex; gap: 6px; margin-top: 6px;
    -webkit-app-region: no-drag;
  }

  .tip-btn {
    flex: 1; padding: 5px 0; border-radius: 5px;
    border: none; cursor: pointer; font-size: 10px; font-weight: 600;
    transition: all 0.15s ease;
  }
  .tip-btn:active { transform: scale(0.96); }

  .tip-btn.primary {
    background: var(--accent); color: #0a0a15;
  }
  .tip-btn.primary:hover { background: #33dfff; }

  .tip-btn.secondary {
    background: rgba(255,255,255,0.06); color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .tip-btn.secondary:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  .tip-btn.sent {
    background: rgba(76, 175, 80, 0.15); color: var(--success);
    pointer-events: none;
  }

  .empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 10px; font-style: italic;
  }
</style>
</head>
<body>
<div class="overlay" id="app">
  <div class="header">
    <span class="logo">JARVIS</span>
    <span>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">connecting...</span>
    </span>
  </div>

  <div class="context" id="contextPanel">
    <div class="context-app" id="ctxApp">--</div>
    <div class="context-window" id="ctxWindow">--</div>
    <div class="context-session" id="ctxSession"></div>
  </div>

  <div id="tipContainer">
    <div class="empty" id="emptyState">Watching for tips...</div>
  </div>
  <details id="savedRoutines">
    <summary>Saved routine requests</summary>
    <div id="routineRequests">Loading...</div>
  </details>
</div>

<script>
  const WS_RECONNECT_MS = 3000;
  const CONTEXT_POLL_MS = 5000;
  const TIP_DISPLAY_MS = 60000;

  let ws = null;
  let contextTimer = null;
  let tipDismissTimer = null;
  let lastTipContext = null;
  let currentTip = null;
  let structuredTip = null;
  let routineOffset = 0;

  function connectWS() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}/ws`);

    ws.onopen = () => {
      setStatus(true);
      pollContext();
    };
    ws.onclose = () => {
      setStatus(false);
      setTimeout(connectWS, WS_RECONNECT_MS);
    };
    ws.onerror = () => setStatus(false);

    ws.onmessage = (event) => {
      if (event.data instanceof ArrayBuffer) return;
      try {
        const msg = JSON.parse(event.data);

        // Proactive chat messages (suggestions + error solutions)
        if (msg.type === 'chat' && msg.payload?.source === 'proactive') {
          const title = extractTitle(msg.payload.text);
          const body = extractBody(msg.payload.text);
          // The daemon also sends a chat copy of each structured suggestion.
          // Preserve its real ID and automation controls when that copy arrives.
          if (structuredTip && structuredTip.title === title && structuredTip.body === body) return;
          const isError = msg.priority === 'urgent' || title.toLowerCase().includes('error') || title.toLowerCase().includes('fix');
          showTip({
            id: msg.id,
            title,
            body,
            type: isError ? 'error' : 'general',
            context: msg.payload,
          });
        }

        // Awareness suggestion events (more structured)
        if (msg.type === 'notification' && msg.payload?.source === 'awareness_event') {
          const ev = msg.payload.event;
          if (ev?.type === 'suggestion_ready') {
            structuredTip = {
              id: ev.data.id,
              title: ev.data.title,
              body: ev.data.body,
              type: ev.data.type || 'general',
              context: ev.data,
            };
            showTip(structuredTip);
          }
        }
      } catch { /* ignore */ }
    };
  }

  // --- Send a chat message to JARVIS ---
  function sendChat(text) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const msg = {
      type: 'chat',
      payload: { text },
      id: crypto.randomUUID(),
      timestamp: Date.now(),
    };
    ws.send(JSON.stringify(msg));
  }

  // --- Dismiss suggestion via API ---
  function dismissSuggestion(id) {
    if (!id) return;
    fetch(`/api/awareness/suggestions/${id}/dismiss`, { method: 'PATCH' }).catch(() => {});
  }

  // --- Act on suggestion via API ---
  function actOnSuggestion(id) {
    if (!id) return;
    fetch(`/api/awareness/suggestions/${id}/act`, { method: 'PATCH' }).catch(() => {});
  }

  function pollContext() {
    clearInterval(contextTimer);
    fetchContext();
    contextTimer = setInterval(fetchContext, CONTEXT_POLL_MS);
  }

  async function fetchContext() {
    fetchRoutineRequests();
    try {
      const resp = await fetch('/api/awareness/status');
      if (!resp.ok) return;
      const data = await resp.json();
      const ctx = data.liveContext;
      if (ctx) {
        document.getElementById('ctxApp').textContent = ctx.currentApp || '--';
        document.getElementById('ctxWindow').textContent = ctx.currentWindow || '--';
        const session = ctx.sessionTopic || (ctx.sessionDuration ? `Session: ${Math.round(ctx.sessionDuration / 60000)}min` : '');
        document.getElementById('ctxSession').textContent = session;
      }
    } catch { /* ignore */ }
  }

  function setStatus(connected) {
    document.getElementById('statusDot').className = `status-dot ${connected ? 'active' : 'inactive'}`;
    document.getElementById('statusText').textContent = connected ? 'active' : 'offline';
  }

  // --- Tip display with action buttons ---
  function showTip(tip) {
    if (document.querySelector('.tip form') && !tip.learning?.composition) return;
    currentTip = tip;
    const container = document.getElementById('tipContainer');
    const empty = document.getElementById('emptyState');
    if (empty) empty.style.display = 'none';
    if (tipDismissTimer) clearTimeout(tipDismissTimer);

    lastTipContext = tip.context;

    // Remove existing tip
    const existing = container.querySelector('.tip');
    if (existing) existing.remove();

    // Pick action buttons based on tip type
    const actions = getActions(tip);

    const el = document.createElement('div');
    el.className = 'tip';
    if (tip.learning?.composition) el.dataset.composition = 'true';
    el.innerHTML = `
      <div class="tip-header">
        <span class="tip-type ${tip.type}">${escapeHtml(tip.type)}</span>
      </div>
      <div class="tip-title">${escapeHtml(tip.title)}</div>
      <div class="tip-body">${escapeHtml(tip.body)}</div>
      <div class="tip-actions" id="tipActions"></div>
    `;

    container.appendChild(el);

    if (tip.learning?.composition) {
      const request = tip.learning.composition.request;
      const details = document.createElement('details');
      const summary = document.createElement('summary'); summary.textContent = 'Accepted routine'; details.appendChild(summary);
      for (const text of [request.description, `Useful result: ${request.expectedOutcome}`,
        tip.learning.goalLink ? `Goal: ${tip.learning.goalLink.title}. ${tip.learning.goalLink.reason}` : 'No current goal link']) {
        const p = document.createElement('p'); p.textContent = text; details.appendChild(p);
      }
      el.appendChild(details);
    }

    // Add buttons
    const actionsDiv = el.querySelector('#tipActions');
    actions.forEach(action => {
      const btn = document.createElement('button');
      btn.className = `tip-btn ${action.style}`;
      btn.textContent = action.label;
      btn.onclick = (e) => {
        e.stopPropagation();
        Promise.resolve().then(() => action.handler(tip, btn)).catch(error => {
          btn.disabled = false;
          showTipError(el, error.message);
        });
      };
      actionsDiv.appendChild(btn);
    });

    // Animate in
    requestAnimationFrame(() => {
      requestAnimationFrame(() => el.classList.add('visible'));
    });

    // Auto-dismiss after timeout
    if (!tip.learning?.composition) tipDismissTimer = setTimeout(() => removeTip(el), TIP_DISPLAY_MS);
  }

  function showTipError(el, message) {
    let status = el.querySelector('[role="status"]');
    if (!status) { status = document.createElement('p'); status.setAttribute('role', 'status'); el.appendChild(status); }
    status.textContent = message;
  }

  async function suggestionRequest(id, action, method = 'GET', data) {
    const response = await fetch(`/api/awareness/suggestions/${encodeURIComponent(id)}/${action}`, {
      method, ...(data ? { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) } : {}),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Could not save. Please retry.');
    return result;
  }

  function showLearning(learning) {
    const job = learning.composition;
    const messages = {
      queued: 'Your request is saved and waiting to compose.',
      running: 'Creating your draft. You can close this tip and return to Saved routine requests.',
      failed: job?.error || 'Composition failed. Your request is saved and can be retried.',
      draft_ready: job?.draftAvailable === false ? 'The attached draft was deleted. Your original request and feedback are retained.'
        : `Draft ready: ${job?.request.name}. Review it in Workflows before publishing or running it.`,
    };
    showTip({ id: learning.opportunityId, type: 'automation', title: learning.title,
      body: job ? messages[job.state] : learning.body, learning });
  }

  async function fetchRoutineRequests() {
    const target = document.getElementById('routineRequests');
    try {
      const response = await fetch(`/api/awareness/compositions?offset=${routineOffset}`);
      if (!response.ok) throw new Error('Could not load saved requests. Reconnecting...');
      const data = await response.json();
      target.replaceChildren();
      if (!data.suggestions.length) target.textContent = 'No routine requests yet.';
      for (const learning of data.suggestions) {
        const button = document.createElement('button');
        button.className = 'tip-btn secondary';
        const labels = { queued: 'Waiting', running: 'Creating', failed: 'Needs attention', draft_ready: 'Draft ready' };
        button.textContent = `${learning.composition.request.name}: ${labels[learning.composition.state]}`;
        button.onclick = () => showLearning(learning);
        target.appendChild(button);
        if (currentTip?.id === learning.opportunityId && currentTip.learning?.composition
            && currentTip.learning.composition.updatedAt !== learning.composition.updatedAt) showLearning(learning);
      }
      for (const [label, offset] of [['Newer requests', routineOffset - 100], ['Older requests', data.nextOffset]]) {
        if (offset == null || offset < 0 || (label === 'Newer requests' && routineOffset === 0)) continue;
        const button = document.createElement('button'); button.className = 'tip-btn secondary'; button.textContent = label;
        button.onclick = () => { routineOffset = offset; fetchRoutineRequests(); }; target.appendChild(button);
      }
    } catch (error) { target.textContent = error.message; }
  }

  async function showAcceptanceForm(tip, button) {
    const learning = await suggestionRequest(tip.id, 'learning');
    if (learning.composition || learning.status === 'dismissed') { showLearning(learning); return; }
    const el = button.closest('.tip');
    if (!el || el.querySelector('form')) return;
    clearTimeout(tipDismissTimer);
    const form = document.createElement('form');
    form.innerHTML = `
      <label>Routine name<input name="name" required maxlength="200"></label>
      <label>What recurring job should it do?<textarea name="description" required maxlength="4000"></textarea></label>
      <label>What result would be useful?<textarea name="expectedOutcome" required maxlength="1000"></textarea></label>
      <label>Related goal (optional)<select name="goalId"><option value="">No goal link</option></select></label>
      <label>Why does it support that goal?<input name="goalReason" maxlength="1000" disabled></label>
      <button class="tip-btn primary" type="submit">Create draft</button>
      <p role="status">This creates a disabled draft for your review.</p>`;
    el.appendChild(form);
    form.elements.name.value = learning.title;
    form.elements.goalId.onchange = () => {
      form.elements.goalReason.disabled = !form.elements.goalId.value;
      form.elements.goalReason.required = !!form.elements.goalId.value;
    };
    fetch('/api/goals?status=active').then(r => r.ok ? r.json() : []).then(goals => {
      for (const goal of goals) {
        const option = document.createElement('option'); option.value = goal.id; option.textContent = goal.title;
        form.elements.goalId.appendChild(option);
      }
    }).catch(() => {});
    let request = null;
    form.onsubmit = async event => {
      event.preventDefault();
      const submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      const values = Object.fromEntries(new FormData(form));
      const data = { name: values.name, description: values.description, expectedOutcome: values.expectedOutcome,
        goalId: values.goalId || null, goalReason: values.goalId ? values.goalReason : null,
        reason: 'Confirmed the recurring job and requested a workflow draft' };
      // Keep the key for an uncertain response. A changed form is a different request.
      if (!request || JSON.stringify(request.data) !== JSON.stringify(data)) request = { id: crypto.randomUUID(), data };
      try {
        showLearning(await suggestionRequest(tip.id, 'accept', 'POST', { requestId: request.id, ...data }));
        fetchRoutineRequests();
      } catch (error) { showTipError(form, error.message); submit.disabled = false; }
    };
  }

  function removeTip(el) {
    const container = document.getElementById('tipContainer');
    const empty = document.getElementById('emptyState');
    el.classList.remove('visible');
    setTimeout(() => {
      el.remove();
      if (!container.querySelector('.tip') && empty) empty.style.display = '';
    }, 400);
  }

  function getActions(tip) {
    const type = tip.type;

    if (type === 'automation' && tip.id) {
      const learning = tip.learning;
      const job = learning?.composition;
      if (job?.state === 'draft_ready' && job.draftAvailable === false) return [];
      if (job?.state === 'draft_ready') return [{ label: 'Review draft', style: 'primary', handler: () => {
        window.open(`/?workflow=${encodeURIComponent(job.workflowId)}#/_room_workflows`, '_blank', 'noopener');
      } }];
      if (job?.state === 'failed') return [{ label: 'Retry composition', style: 'primary', handler: async (t, btn) => {
        btn.disabled = true;
        t.retryRequestId ||= crypto.randomUUID();
        showLearning(await suggestionRequest(t.id, 'retry', 'POST', {
          requestId: t.retryRequestId, reason: 'Reviewed the composition error and requested another attempt',
        }));
      } }];
      if (job || learning?.status === 'dismissed') return [];
      return [
        { label: 'Draft a routine', style: 'primary', handler: showAcceptanceForm },
        { label: 'Dismiss', style: 'secondary', handler: async (t, btn) => {
          const reason = window.prompt('Why is this suggestion not useful?', 'Not useful for my work');
          if (!reason?.trim()) return;
          btn.disabled = true;
          t.dismissRequestId ||= crypto.randomUUID();
          await suggestionRequest(t.id, 'dismiss', 'PATCH', { requestId: t.dismissRequestId, reason });
          removeTip(btn.closest('.tip'));
        } },
      ];
    }

    if (type === 'error') {
      return [
        {
          label: 'Fix it',
          style: 'primary',
          handler: (t, btn) => {
            const errorText = t.context?.errorText || t.context?.text || t.body;
            sendChat(`Yes, please help me fix this error: ${errorText.slice(0, 150)}`);
            actOnSuggestion(t.id);
            btn.textContent = 'On it!';
            btn.className = 'tip-btn sent';
          }
        },
        {
          label: 'Dismiss',
          style: 'secondary',
          handler: (t, btn) => {
            dismissSuggestion(t.id);
            removeTip(btn.closest('.tip'));
          }
        },
      ];
    }

    if (type === 'stuck') {
      return [
        {
          label: 'Help me',
          style: 'primary',
          handler: (t, btn) => {
            const appName = t.context?.appName || '';
            const windowTitle = t.context?.windowTitle || '';
            sendChat(`I'm stuck in ${appName} (${windowTitle}). Can you help me figure out what to do next?`);
            actOnSuggestion(t.id);
            btn.textContent = 'On it!';
            btn.className = 'tip-btn sent';
          }
        },
        {
          label: "I'm fine",
          style: 'secondary',
          handler: (t, btn) => {
            dismissSuggestion(t.id);
            removeTip(btn.closest('.tip'));
          }
        },
      ];
    }

    // General / break / cloud insight
    return [
      {
        label: 'Tell me more',
        style: 'primary',
        handler: (t, btn) => {
          sendChat(`Tell me more about: ${t.title}. ${t.body.slice(0, 100)}`);
          actOnSuggestion(t.id);
          btn.textContent = 'Sent!';
          btn.className = 'tip-btn sent';
        }
      },
      {
        label: 'Got it',
        style: 'secondary',
        handler: (t, btn) => {
          dismissSuggestion(t.id);
          removeTip(btn.closest('.tip'));
        }
      },
    ];
  }

  function extractTitle(text) {
    const match = text.match(/\*\*(.+?)\*\*/);
    return match ? match[1] : 'JARVIS Tip';
  }

  function extractBody(text) {
    return text.replace(/\*\*(.+?)\*\*\n?/, '').trim();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  fetchRoutineRequests();
  connectWS();
</script>
</body>
</html>
