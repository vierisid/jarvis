name: Docker Build

# Validates the Dockerfile builds cleanly when image-relevant files change,
# and then RUNS the image the way a user does.
#
# The run half exists because #613 and #614 both shipped in a published image
# and were found by an outside reporter: this workflow built the image but
# never started it, so nothing checked that the container reports itself
# healthy, that its health endpoint answers without credentials, or that every
# service actually bootstrapped. See .github/scripts/docker-smoke.sh.

# `push` is main-only, matching test.yml. With `branches: ["**"]` a push to a
# PR branch triggered this twice -- push + pull_request -- and the duplicate
# pair raced over one cache scope (the build no longer uses a cache, #1165,
# but two runs of the same commit are still waste).
on:
  # No `paths:` on the push trigger, unlike the PR one below. The smoke check
  # guards a runtime class -- a service that stops bootstrapping -- that no
  # build-time path filter can predict with certainty, so every merge to main
  # runs it once. The PR filter below is wide but still a filter:
  # a merge of something it does not list would otherwise never be checked.
  push:
    branches: [main]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/docker-build.yml"
      - ".github/scripts/docker-smoke.sh"
      - ".github/scripts/version-stamp-cache.sh"
      - ".github/scripts/version-stamp-cache.test.sh"
      # The image prebuilds the workflow runtime (#613), so a source change can
      # fail the image build without touching the Dockerfile -- and the build's
      # own assertion that every piece is on the content-hash fast path is
      # exactly the thing worth catching before a merge, not after. Deliberately
      # the whole tree rather than a hand list: the prebuild's cache key reaches
      # outside src/workflows (PATCHED_VENDOR_SOURCES escapes into
      # src/workflows/runtime, src/lib and src/util, and pieceHash() reads
      # src/actions/action-outcome.ts). The rest is every path the image copies
      # or compiles: src/, bin/, roles/ and tsconfig.json into the runtime
      # layer, scripts/ into the build stages, and ui/, which `bun build`
      # compiles during the build.
      #
      # This is the expensive half of the trade, and it is taken on purpose: a
      # PR touching src/ now pays an image build. The alternative -- a narrow
      # filter plus manual dispatch -- leaves a window where a PR breaks the
      # prebuild and only the post-merge push run says so.
      - "src/**"
      - "scripts/**"
      - "ui/**"
      - "bin/**"
      - "roles/**"
      - "tsconfig.json"
  # Manual dispatch, so the container check can be run against any ref without
  # waiting for a qualifying path change.
  workflow_dispatch:

# One in-flight image build per ref; never cancel main, whose run is the
# post-merge verdict on the Dockerfile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only, written down (#646). Without this every job inherits the
# repository's default token scope -- read-only today, but a setting outside
# this file, one toggle away from write. This workflow builds and STARTS a
# container from the PR's own tree; it pushes nothing and has no registry
# login, so it needs to read the repository and nothing else. Its checkout
# leaves no token in .git/config (#1001): nothing here runs git against a
# remote, and the build and the smoke run execute the PR's own tree.
permissions:
  contents: read

jobs:
  # Two legs, the same steps (owner decision 2026-11-11, option c), as in
  # test.yml's sidecar-build. The release builds and smokes the image on
  # ubuntu-24.04 (release-exec.yml build-image and smoke-image), so the leg
  # that gates is on that label; the ubuntu-latest leg only warns (a red
  # check when it fails, not a failed workflow; neither is required). The image
  # itself is built inside a BuildKit pinned by digest, but loading and
  # running it goes through the host's dockerd, and that is what moved under
  # it: ubuntu-26.04 ships Docker 29 on the containerd image store, which
  # changed what `docker load` reports as the image ID and failed
  # smoke-image in release dry run 42868738162 while this job, then on
  # ubuntu-latest, was green. workflow-hardening.test.sh rule 16 holds the
  # gating leg to the release label and the -latest leg to non-blocking.
  docker-build:
    name: docker-build (${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.early_warning }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            leg: ubuntu-24.04, release image
            early_warning: false
          - runner: ubuntu-latest
            leg: ubuntu-latest, early warning
            early_warning: true
    env:
      # Run-scoped rather than a bare `jarvis:ci`. On a GitHub-hosted runner
      # each job gets a fresh VM so it makes no difference, but `concurrency` is
      # per-ref: on a self-hosted runner two refs can build at once, and a
      # shared tag would mean one ref's smoke check running the other ref's
      # image, then one job deleting the tag out from under the other. The
      # leg index keeps the two legs of one run apart the same way.
      IMAGE_TAG: jarvis:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    # The build is the long pole; the smoke check adds ~2-3 minutes on the
    # happy path and fails at ~100s on the #614 shape. Nothing bounds the
    # docker build or `docker run` themselves, and the default is 6 hours.
    timeout-minutes: 30
    steps:
      # A -latest label moves over weeks, not at once, so the early-warning
      # leg can still land on the old image; this says which one it ran and
      # which image store its dockerd uses.
      - name: Name the runner image
        env:
          LEG: ${{ matrix.leg }}
        run: echo "::notice::${LEG} ran on ${ImageOS:-unknown} ${ImageVersion:-unknown}, docker storage $(docker info --format '{{.Driver}} {{json .DriverStatus}}' 2>/dev/null || echo unknown)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # BuildKit by digest, not the action's default tag
        # moby/buildkit:buildx-stable-1 (#1048): a PAT-opened catalog PR starts
        # this run with no approval, and the builder runs every Dockerfile step.
        # The same image release-exec.yml pins (BUILDKIT_IMAGE); buildx-stable-1
        # and v0.33.1 both resolved to this digest on 2026-10-20.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # PR check is single-arch for speed; release workflow validates linux/amd64 + linux/arm64.
      #
      # Cold, with no BuildKit cache (#1165). It used to restore and save the
      # gha cache, whose index is whatever run on main wrote last, not an
      # exact key (#1047), and it bought little: on five main runs of
      # 2026-11-06 this step took 61-98s with the cache, while the release
      # guard step below does a cold build and a rebuild on a fresh builder
      # in 35-57s. workflow-hardening.test.sh refuses type=gha here.
      #
      # `load: true` is what lets the smoke step below actually run this image.
      # setup-buildx-action creates a `docker-container`-driver builder, whose
      # output otherwise stays in the BuildKit cache and never reaches dockerd's
      # image store -- `docker run jarvis:ci` would fail with "image not found".
      # It costs a docker-exporter tar plus unpack (~1GB, roughly 30-60s) on
      # every run, including full cache hits. That is the accepted price of
      # reusing this build instead of rebuilding in a second job or shipping the
      # image between jobs as a multi-hundred-MB artifact. `load` forces the
      # docker exporter, which is single-platform -- already true here.
      #
      # VERSION is passed, and is now REQUIRED by the Dockerfile (#625). Before,
      # this workflow passed nothing, the Dockerfile's stamp step skipped itself,
      # and the image smoked here carried whatever version was committed to
      # package.json rather than a release's -- so CI proved a slightly
      # different artifact healthy, and the stamp instruction itself ran in no CI
      # job at all. 0.0.0-ci is deliberately recognisable as not-a-release, and
      # it is never pushed anywhere: push: false, and this workflow has no
      # registry login.
      - name: Build Docker image (validate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: VERSION=0.0.0-ci

      # Runs the image with a fresh volume, no config file and the default
      # command, then asserts: it reaches `healthy`; the endpoint its own
      # HEALTHCHECK probes answers 200 without credentials from the host; no
      # service logged a startup failure; /health answers on the published
      # port; and all of that again on a second run over the written volume and
      # on a second clean run. Dumps docker logs and the health log on failure.
      - name: Smoke-test the image (run it like a user does)
        env:
          # Unique per run AND per re-run, so a retry can never collide with a
          # leftover from the attempt before it.
          SMOKE_PREFIX: jarvis-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
        run: ./.github/scripts/docker-smoke.sh "$IMAGE_TAG"

      # #647: a version bump may re-run only the version-dependent steps. A release commit
      # changes only package.json's version (and passes a new VERSION), and
      # the Dockerfile keeps both away from the expensive steps: deps and the
      # workflow prebuild read a version-neutral package.json from the
      # `manifest` stage, and the stamp is the build stage's last instruction.
      # This checks the behaviour rather than the layout: it builds a copy of
      # the tracked tree, bumps the copy's version as a release commit does,
      # rebuilds, and fails naming any deps/build/workflows step that re-ran.
      #
      # Two full builds on a builder the script creates and removes, not this
      # job's. That isolation is the #688 fix: on the shared builder the warm
      # build was served from gha entries the image build above imported and
      # never materialised, so BuildKit could not match the bump build's
      # locally-computed layers and the guard red-flagged four correct PR
      # branches in a row. The cost is that the warm build is genuinely cold.
      # The image build above imports no cache any more (#1165), so today the
      # isolation guards against one coming back rather than a live problem.
      # Source assertions on the guard below, in the shape of
      # chromium-test-partition.test.sh (#648). Seconds, no Docker. It runs
      # FIRST so a disarmed guard is named here rather than passing vacuously
      # in the step after it.
      - name: Check the release cache guard has not been disarmed
        run: ./.github/scripts/version-stamp-cache.test.sh

      - name: Check a release re-runs only its version-dependent steps
        run: ./.github/scripts/version-stamp-cache.sh .

      # The script removes the containers and volumes it created, by name, in
      # its own EXIT trap. It deliberately does not touch the image, since a
      # caller may own it -- this workflow built the tag, so this workflow
      # removes it. By exact tag: no prune, which would hit a shared runner's
      # other work.
      - name: Remove the image tag this job built
        if: always()
        run: docker image rm "$IMAGE_TAG" || true
