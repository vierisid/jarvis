name: Docker Build

# Validates the Dockerfile builds cleanly when image-relevant files change,
# and then RUNS the image the way a user does.
#
# The run half exists because #613 and #614 both shipped in a published image
# and were found by an outside reporter: this workflow built the image but
# never started it, so nothing checked that the container reports itself
# healthy, that its health endpoint answers without credentials, or that every
# service actually bootstrapped. See .github/scripts/docker-smoke.sh.

# `push` is main-only, matching test.yml. With `branches: ["**"]` a push to a
# PR branch triggered this twice — push + pull_request — and since both runs
# write `cache-to: type=gha,mode=max` into the SAME cache scope, the duplicate
# pair raced over that scope on every push. The paths filter below includes
# bun.lock and package.json, so dependency changes hit this most often.
on:
  # No `paths:` on the push trigger, unlike the PR one below. The smoke check
  # guards a runtime class -- a service that stops bootstrapping -- that no
  # build-time path filter can predict: the Dockerfile COPYs src/, ui/, bin/,
  # roles/ and scripts/, so a change in any of them can break the container
  # while touching none of the filtered paths. One cache-warm run per merge to
  # main is the cheap place to catch that. The PR filter stays narrow so this
  # does not put a multi-minute image build on nearly every PR.
  push:
    branches: [main]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/docker-build.yml"
      - ".github/scripts/docker-smoke.sh"
  # The smoke check guards a runtime class (a service that stops bootstrapping)
  # that the paths filter above will never trigger, since those are all
  # build-time inputs. Manual dispatch makes it runnable against any ref
  # without widening the filter to `src/**`, which would put a multi-minute
  # image build on nearly every PR.
  workflow_dispatch:

# One in-flight image build per ref; never cancel main, whose run is the
# post-merge verdict on the Dockerfile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      # Run-scoped rather than a bare `jarvis:ci`. On a GitHub-hosted runner
      # each job gets a fresh VM so it makes no difference, but `concurrency` is
      # per-ref: on a self-hosted runner two refs can build at once, and a
      # shared tag would mean one ref's smoke check running the other ref's
      # image, then one job deleting the tag out from under the other.
      IMAGE_TAG: jarvis:ci-${{ github.run_id }}-${{ github.run_attempt }}
    # The build is the long pole; the smoke check adds ~2-3 minutes on the
    # happy path and fails at ~100s on the #614 shape. Nothing bounds the
    # docker build or `docker run` themselves, and the default is 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR check is single-arch for speed; release workflow validates linux/amd64 + linux/arm64.
      #
      # `load: true` is what lets the smoke step below actually run this image.
      # setup-buildx-action creates a `docker-container`-driver builder, whose
      # output otherwise stays in the BuildKit cache and never reaches dockerd's
      # image store -- `docker run jarvis:ci` would fail with "image not found".
      # It costs a docker-exporter tar plus unpack (~1GB, roughly 30-60s) on
      # every run, including full cache hits. That is the accepted price of
      # reusing this build instead of rebuilding in a second job or shipping the
      # image between jobs as a multi-hundred-MB artifact. `load` forces the
      # docker exporter, which is single-platform -- already true here.
      - name: Build Docker image (validate)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the image with a fresh volume, no config file and the default
      # command, then asserts: it reaches `healthy`; the endpoint its own
      # HEALTHCHECK probes answers 200 without credentials from the host; no
      # service logged a startup failure; /health answers on the published
      # port; and all of that again on a second run over the written volume and
      # on a second clean run. Dumps docker logs and the health log on failure.
      - name: Smoke-test the image (run it like a user does)
        env:
          # Unique per run AND per re-run, so a retry can never collide with a
          # leftover from the attempt before it.
          SMOKE_PREFIX: jarvis-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./.github/scripts/docker-smoke.sh "$IMAGE_TAG"

      # The script removes the containers and volumes it created, by name, in
      # its own EXIT trap. It deliberately does not touch the image, since a
      # caller may own it -- this workflow built the tag, so this workflow
      # removes it. By exact tag: no prune, which would hit a shared runner's
      # other work.
      - name: Remove the image tag this job built
        if: always()
        run: docker image rm "$IMAGE_TAG" || true
