name: Sidecar Release

# Builds and publishes the sidecar to npm, versioned independently of the brain
# from sidecar/VERSION. Distributed via npm only — no sidecar-v* git tag or
# GitHub release. Driven two ways:
#   * Called by the brain's Release Executor (release-exec.yml) so a brain
#     release also ships the current sidecar (its own version). It is called
#     TWICE there (#952): once with `publish: false`, which builds, signs and
#     verifies and reports the five digests as its `digests` output, and once
#     with `publish_only: true`, which builds nothing and publishes those
#     artifacts, checked against those digests. The second call waits for
#     the same two jobs as the brain publish, and runs no job of its own
#     before publish-sidecar (resolve is skipped, and everything else needs
#     it), so the two `release` approvals come due together and one click
#     releases both.
#   * Dispatched manually to ship a sidecar-only release without touching the
#     brain. Neither input above exists on a dispatch, and absent they mean
#     build and publish in one go, as before.
# Idempotent: if sidecar/VERSION is already on npm it stops as a no-op success
# instead of failing — so calling it on every brain release is safe even when
# the sidecar hasn't changed. Partial publishes self-heal when the failed jobs
# of the run that started them are re-run (not all jobs, which rebuilds): the per-package "already on npm" guards no-op once
# npm is found to serve exactly that run's files (#958), and the wrapper
# (published last) is the gate. A new run cannot finish another run's partial
# publish, since its build is not byte-identical; bump sidecar/VERSION.

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Build and validate without publishing"
        type: boolean
        default: false
      # The two halves (#952). Read by resolve (its if: and its script),
      # by publish-sidecar (its if: and its version and verify steps), and
      # nowhere else; each of those is pinned or run verbatim by
      # release-exec.test.sh, including for a dispatch, which declares none
      # of them, so they arrive null or empty and mean build and publish.
      publish:
        description: "Publish to npm. false builds, signs and verifies only, and reports the digests output"
        type: boolean
        default: true
      publish_only:
        description: "Build nothing; publish what an earlier call in this run built, by its digests output"
        type: boolean
        default: false
      digests:
        description: "With publish_only: the digests output of the call that built the artifacts"
        type: string
        default: ""
      version:
        description: "With publish_only: the version output of the call that built the artifacts"
        type: string
        default: ""
    # released and version come from publish-sidecar when it ran, and from
    # resolve otherwise (#952): a publish_only call runs no resolve, and a
    # publish: false call no publish-sidecar. github-release reads them from
    # the publish_only call, where publish-sidecar ran exactly when it
    # published.
    outputs:
      released:
        description: "true when this call published a new sidecar version (on a dry run, rehearsed publishing it), or, on a call that does not publish, built one"
        value: ${{ jobs.publish-sidecar.outputs.released || jobs.resolve.outputs.should_release }}
      version:
        description: "the sidecar version (from sidecar/VERSION, by way of the build call on a publish_only call)"
        value: ${{ jobs.publish-sidecar.outputs.version || jobs.resolve.outputs.version }}
      sums:
        description: "base64 sha256sum manifest of the sidecar-* artifacts publish-sidecar published"
        value: ${{ jobs.publish-sidecar.outputs.sums }}
      # Each digest is the job output of the one job that produced those
      # bytes (#781), labelled with its leg by this format string and nothing
      # else; publish-sidecar parses it back by label on a publish_only call.
      # Evaluated by GitHub from job outputs, so no step of any job in the
      # run can write it. Empty when this call built nothing (the version is
      # already on npm), which tells the publish_only call there is nothing
      # to publish without it asking npm a second time.
      digests:
        description: "the five sidecar-* artifact sha256 digests, by leg, for a later publish_only call; empty when nothing was built"
        value: ${{ jobs.resolve.outputs.build == 'true' && format('linux-x64={0} linux-arm64={1} darwin-arm64={2} darwin-x64={3} win32-x64={4}', jobs.build-sidecar-linux-x64.outputs.sha256, jobs.build-sidecar-linux-arm64.outputs.sha256, jobs.sign-sidecar-darwin.outputs.sha256_darwin_arm64, jobs.sign-sidecar-darwin.outputs.sha256_darwin_x64, jobs.sign-sidecar-windows.outputs.sha256) || '' }}
    # Every secret this workflow reads, declared so the caller can pass exactly
    # these instead of `secrets: inherit` (#682). Read only by sign-sidecar-
    # darwin, which builds nothing (#870). Optional to GitHub, so a fork or
    # a dry run without them still runs: absent, the macOS bundle is
    # unsigned, which sign-sidecar-darwin allows on a dry run or with
    # ALLOW_UNSIGNED_MACOS set to exactly true, and fails otherwise (#921).
    # A secret read here but not declared would be silently empty when
    # called, so .github/scripts/workflow-hardening.test.sh checks the two
    # lists match.
    secrets:
      APPLE_CERT_P12:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_API_KEY_P8:
        required: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing"
        type: boolean
        default: true

# Least privilege at the workflow level: the jobs that need OIDC declare it
# themselves -- publish-sidecar for npm Trusted Publishing, sign-sidecar-windows
# to federate into Google Cloud KMS for Windows signing.
permissions:
  contents: read

env:
  # No GO_VERSION: setup-go reads the exact version from sidecar/go.mod.
  # There is no BUN_VERSION: nothing in this workflow runs Bun. It used to be
  # `latest`, installed into publish-sidecar (id-token: write) and never used
  # (#681).
  # Exact npm for Trusted Publishing, never `latest`: keep it equal to
  # NPM_VERSION in release-exec.yml, which says where the value comes from.
  NPM_VERSION: "12.1.0"
  # The sha512 of that npm tarball (#1000); see release-exec.yml, and bump
  # the two together.
  NPM_INTEGRITY: "sha512-Fyhu62pNx70YCs/5+dEmJQTFVmSKwvo5CA0qvBkGDRpob42MJ6G2RQ2tdxeKM4nYnIZDqkYAxEgqtoejn9QGtQ=="
  SIDECAR_BIN: jarvis
  # Spelled exactly as in release-exec.yml, which passes the input (#685);
  # publish-sidecar's environment name repeats it because `env` is not
  # available there. release-exec.test.sh checks that the two agree.
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  # ─── Resolve version + idempotency gate ────────────────────────
  # The whole release is skipped (no-op success) when sidecar/VERSION is already
  # published, so the brain's release-exec can call this unconditionally.
  #
  # Skipped on a publish_only call (#952), and with it every job but
  # publish-sidecar, since they all need it: a skipped job takes no runner,
  # so the publish is the first job of that call to reach the `release` gate,
  # at the same moment as publish-brain. That call takes the version and the
  # decision from the build call instead. It still runs for publish: false
  # with publish_only: true, only to refuse that combination. On a dispatch
  # publish_only is null, which is not true, so it runs.
  resolve:
    if: inputs.publish_only != true || inputs.publish == false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
      # What this call does (#952): publish is false on a publish: false
      # call, and both are false when there is nothing to release. The build
      # legs gate on build and publish-sidecar on publish. resolve does not
      # run on a publish_only call at all.
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          VERSION="$(cat sidecar/VERSION)"
          # Checked before it becomes an output (#684): every job below takes
          # it through env:, but it still names npm packages and lands in a
          # sed expression, so it must be a plain semver with nothing a shell
          # or sed would read as syntax -- and a newline here would otherwise
          # write extra lines into $GITHUB_OUTPUT.
          # SemVer 2.0 pre-release identifiers: no empty one, no leading zero
          # on a numeric one (`npm version` refuses both).
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${id}(\.${id})*)?$ ]]; then
            printf '::error::sidecar/VERSION is not a plain semver: %q\n' "$VERSION"
            exit 1
          fi
          # Which half of the work this call does (#952). Compared with the
          # one value that changes the default and nothing else, so an input
          # a dispatch never declares (an empty string here) means build and
          # publish, as it did before the inputs existed.
          build=true
          publish=true
          if [ "${PUBLISH_ONLY:-}" = "true" ]; then build=false; fi
          if [ "${PUBLISH:-}" = "false" ]; then publish=false; fi
          if [ "$build" = false ] && [ "$publish" = false ]; then
            echo "::error::publish: false and publish_only: true together would neither build nor publish"
            exit 1
          fi
          # The job's if: skips it on every other publish_only call; a
          # publish_only call decides in publish-sidecar, from the build call.
          if [ "$build" = false ]; then
            echo "::error::resolve does not run on a publish_only call; publish-sidecar takes the version and the decision from the build call"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${DRY_RUN}" = "true" ]; then
            should_release=true
            echo "::notice::Dry run — building/validating sidecar v${VERSION} without publishing."
          else
            # Released only on a clean "not found" (#979). Any other failure
            # of the lookup -- a 5xx, a rate limit, an auth error, a network
            # error, an answer that does not parse -- used to read as "not
            # published" and send a version already out to publish-sidecar.
            # npm view --json puts the error, code included, on stdout; E404
            # is both "no such version" (the package answered without it)
            # and "no such package" (a first release). Measured on npm 10.8.2,
            # 11.6.2 and 12.1.0: a published version prints "1.2.3" on 10 and
            # 11 and ["1.2.3"] on 12. npm has retried a transient error twice
            # (fetch-retries) before it reports one here.
            view_rc=0
            view="$(npm view "@usejarvis/sidecar@${VERSION}" version --json 2>/dev/null)" || view_rc=$?
            # Exactly one JSON value is an answer; nothing, two, or text that
            # does not parse is not, and reads as null.
            answer="$(jq -sc 'if length == 1 then .[0] else null end' <<<"$view" 2>/dev/null)" || answer=null
            errfield() { jq -r --arg f "$1" 'if type == "object" and (.error | type) == "object" then .error[$f] | strings else empty end' <<<"$answer"; }
            if [ "$view_rc" -eq 0 ] && jq -e --arg v "$VERSION" '. == $v or . == [$v]' <<<"$answer" >/dev/null; then
              should_release=false
              echo "::notice::@usejarvis/sidecar@${VERSION} is already published -- skipping sidecar release (no-op)."
            elif [ "$view_rc" -ne 0 ] && [ "$(errfield code)" = "E404" ]; then
              should_release=true
              echo "Sidecar v${VERSION} is not yet on npm -- releasing."
            else
              # npm text, control characters dropped, so it stays one line
              # and cannot start a workflow command of its own.
              printf '::error::Could not establish whether @usejarvis/sidecar@%s is on npm (npm view exit %s, code %s: %s), so this run will not decide to publish it (#979). Re-run this job.\n' \
                "$VERSION" "$view_rc" "$(errfield code | tr -d '\000-\037')" "$(errfield summary | tr -d '\000-\037')"
              exit 1
            fi
          fi
          if [ "$should_release" != true ]; then build=false; publish=false; fi
          {
            echo "should_release=${should_release}"
            echo "build=${build}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"

  # ─── Cross-compile Go sidecars (cgo) ───────────────────────────
  # The sidecar is a cgo program (webview_go, GTK/Cocoa overlays), so it CANNOT
  # be cross-compiled with CGO_ENABLED=0 from a single runner. Each arch builds
  # with CGO_ENABLED=1 on a runner/toolchain that can see its native UI SDK.
  # Four jobs, not one four-leg matrix (#781). The legs of a matrix share
  # ONE outputs block, merged from whatever each leg writes, so any leg could
  # set another leg's digest name and finish last -- a compromised Linux leg
  # (apt maintainer scripts as root, the cgo toolchain, the module graph)
  # could then swap the macOS bundle AND vouch for the swap. A job's outputs
  # can be set only by that job, so each leg is its own job with its own
  # `sha256`, and publish-sidecar checks each artifact against the job that
  # built it. The steps are written once below and reused by YAML alias in
  # the other three, so the four cannot drift; each job keeps a one-entry
  # matrix only because those steps (and runs-on) read `matrix.*`.
  #
  # No id-token in any of them (#682). Only Windows signing federates into
  # Google Cloud, so the Windows leg is its own jobs (build-sidecar-windows,
  # then sign-sidecar-windows, the only one of the two with id-token), and
  # these four -- two of which run Swift and Apple tooling on macOS -- cannot
  # mint an OIDC token at all.
  #
  # The five jobs that build (these four and build-sidecar-windows), the
  # signers (sign-sidecar-darwin, sign-sidecar-windows) and the post-sign
  # check all gate on resolve's build output, and on a publish_only call skip
  # with the skipped resolve, taking no runner (#952). The two darwin legs
  # build an unsigned Jarvis.app and hold no Apple secret: sign-sidecar-darwin
  # signs it (#870).
  build-sidecar-linux-x64:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    # One leg. The matrix is only what the shared steps read.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            npm_pkg: linux-x64
            runner: ubuntu-latest
            setup: linux
    steps: &build-sidecar-leg-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Actions cache is writable by any run on main, and Go reuses
          # cached modules and build output without re-verifying them (#681).
          cache: false
          # Track sidecar/go.mod as the single source of the Go version.
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      # Linux native (amd64 + arm64): WebKitGTK 4.1 + GTK3. webview_go pins the
      # pkg-config name `webkit2gtk-4.0`, so alias the 4.1 .pc files. malgo needs
      # no audio dev headers (it dlopens the backend at runtime).
      - name: Install Linux UI libraries
        if: matrix.setup == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # libx11-dev/libx11-xcb-dev/libxcb1-dev are named explicitly for
          # `#cgo pkg-config: x11 x11-xcb xcb` in hotkeys_linux.go (#577). They
          # arrive transitively through the GTK stack today, so this is a no-op
          # on the current runner image -- which is the reason to name them:
          # a cgo build that fails because an indirect dependency was dropped
          # upstream is an awful thing to debug.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config build-essential \
            libx11-dev libx11-xcb-dev libxcb1-dev
          for d in /usr/lib/*/pkgconfig; do
            [ -f "$d/webkit2gtk-4.1.pc" ] && sudo ln -sf "$d/webkit2gtk-4.1.pc" "$d/webkit2gtk-4.0.pc" || true
            [ -f "$d/javascriptcoregtk-4.1.pc" ] && sudo ln -sf "$d/javascriptcoregtk-4.1.pc" "$d/javascriptcoregtk-4.0.pc" || true
          done

      # .github/scripts/build-sidecar.sh is shared with build-sidecar-windows,
      # so the two jobs cannot drift in how they build or pin.
      - name: Build sidecar (${{ matrix.goos }}/${{ matrix.goarch }})
        working-directory: sidecar
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SETUP: ${{ matrix.setup }}
          OUT: ${{ env.SIDECAR_BIN }}
          # The self-updater verifies the payloads it installs exactly as
          # Jarvis-Setup does (internal/update), so it carries the same pins:
          # the Developer ID team on macOS. Empty fails a real run unless
          # ALLOW_UNPINNED_MACOS is exactly true; a dry run warns (#922).
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNPINNED_MACOS: ${{ vars.ALLOW_UNPINNED_MACOS }}
        run: ../.github/scripts/build-sidecar.sh

      # --- macOS: assemble Jarvis.app (unsigned) ---------------------
      # Notifications (UNUserNotification) and stable TCC grants require a
      # bundle, so darwin ships Jarvis.app -- not a bare binary. The Vision OCR
      # helper is built here (universal) and sealed inside the bundle when
      # sign-sidecar-darwin signs it. Nothing here signs (#870): this job
      # runs go, cgo, swiftc and make, and holds no Apple secret.
      - name: Build universal ocr-helper
        if: matrix.setup == 'darwin'
        working-directory: sidecar
        run: |
          set -euo pipefail
          swiftc -O -target arm64-apple-macos11  -o /tmp/ocr-helper-arm64 helpers/ocr-helper.swift
          swiftc -O -target x86_64-apple-macos11 -o /tmp/ocr-helper-amd64 helpers/ocr-helper.swift
          mkdir -p helpers
          lipo -create -output helpers/ocr-helper /tmp/ocr-helper-arm64 /tmp/ocr-helper-amd64
          lipo -info helpers/ocr-helper

      - name: Assemble Jarvis.app
        if: matrix.setup == 'darwin'
        working-directory: sidecar
        run: |
          set -euo pipefail
          packaging/macos/make-icns.sh
          make app-macos BIN="./${SIDECAR_BIN}" APP_DIR=dist/Jarvis.app

      # tar the bundle before upload -- upload-artifact strips exec bits and
      # symlinks, which would corrupt the bundle and its later signature.
      - name: Package Jarvis.app
        if: matrix.setup == 'darwin'
        working-directory: sidecar
        # COPYFILE_DISABLE + --no-mac-metadata: keep bsdtar from archiving
        # xattrs as AppleDouble (._*) entries — GNU tar on the publish runner
        # would extract them as literal files inside the bundle and break the
        # codesign seal.
        run: COPYFILE_DISABLE=1 tar --no-mac-metadata -C dist -czf jarvis-app.tar.gz Jarvis.app

      # The digest of exactly the file the upload below takes, as the output of
      # this job alone; the artifact store is writable by every job in the run.
      # macOS has shasum but not always sha256sum; the hex is the same.
      - name: Digest
        id: digest
        working-directory: sidecar
        env:
          FILE: ${{ matrix.setup == 'darwin' && 'jarvis-app.tar.gz' || env.SIDECAR_BIN }}
          LEG: ${{ matrix.npm_pkg }}
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then sum="$(sha256sum "$FILE")"; else sum="$(shasum -a 256 "$FILE")"; fi
          sum="${sum%% *}"
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not hash $FILE"; exit 1; }
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "${LEG}: ${FILE} sha256 ${sum}"

      # Not under the sidecar-* name: that is the signed bundle, which only
      # sign-sidecar-darwin uploads (#870).
      - name: Upload unsigned bundle (darwin)
        if: matrix.setup == 'darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.npm_pkg }}
          path: sidecar/jarvis-app.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload binary
        if: matrix.setup != 'darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecar-${{ matrix.npm_pkg }}
          path: sidecar/${{ env.SIDECAR_BIN }}
          if-no-files-found: error

  build-sidecar-linux-arm64:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    # One leg. The matrix is only what the shared steps read.
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
            npm_pkg: linux-arm64
            runner: ubuntu-24.04-arm
            setup: linux
    steps: *build-sidecar-leg-steps

  build-sidecar-darwin-arm64:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    # One leg. The matrix is only what the shared steps read.
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            npm_pkg: darwin-arm64
            runner: macos-latest
            setup: darwin
    steps: *build-sidecar-leg-steps

  build-sidecar-darwin-x64:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    # One leg. The matrix is only what the shared steps read.
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            npm_pkg: darwin-x64
            runner: macos-latest
            setup: darwin
    steps: *build-sidecar-leg-steps

  # --- macOS: Developer ID sign, notarize, staple (#870) ---
  # Split from the build, as #682 and #779 split Windows. The darwin legs run
  # go, cgo, swiftc, lipo and make, and used to import APPLE_CERT_P12 and
  # write the App Store Connect key in that same job, after them: a
  # compromised toolchain, Go module or Makefile could read both, and unlike
  # a federated token they do not expire with the job. This job builds
  # nothing, installs nothing and runs no repository script
  # (workflow-hardening.test.sh, rule narrow, holds every job that reads a
  # secret to that): it takes each unsigned bundle by the digest its build
  # job reported, signs it inside-out with the hardened runtime, notarizes
  # and staples it, and uploads it as sidecar-darwin-<leg> with the digest
  # of what it uploads as its own job output. It signs what the build made:
  # the split keeps the secrets from the toolchain, not the toolchain from
  # the bundle. One job for both legs: signing needs no Mac of the leg
  # architecture, and each digest is still the output of the one job that
  # produced those bytes (#781).
  #
  # A real run that cannot sign FAILS here (#921), as #869 made Windows: see
  # the readiness step. verify-sidecar-darwin then checks, in a job holding
  # no secret, that what ships is signed by our team, and publish-sidecar
  # waits for it.
  sign-sidecar-darwin:
    needs: [resolve, build-sidecar-darwin-arm64, build-sidecar-darwin-x64]
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      sha256_darwin_arm64: ${{ steps.digest.outputs.sha256_darwin_arm64 }}
      sha256_darwin_x64: ${{ steps.digest.outputs.sha256_darwin_x64 }}
      # Whether the signing step ran, so verify-sidecar-darwin knows whether
      # there is a signature to check (false only on a dry run or under
      # ALLOW_UNSIGNED_MACOS, #921).
      signed: ${{ steps.applesign.outputs.ready }}
    steps:
      # For packaging/macos/entitlements.plist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Into directories of their own, never the checkout (#817 review): an
      # artifact is a zip any job in this run can write.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-darwin-arm64
          path: ${{ runner.temp }}/unsigned/darwin-arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-darwin-x64
          path: ${{ runner.temp }}/unsigned/darwin-x64

      # The digests travel as job outputs, which only the build jobs can set;
      # the artifact store is writable by every job in this run. Exactly the
      # two files, those digests, and only then anything reads them. shasum:
      # macOS has it, and not always sha256sum; the hex is the same.
      - name: Verify the bundles
        env:
          SHA_DARWIN_ARM64: ${{ needs.build-sidecar-darwin-arm64.outputs.sha256 }}
          SHA_DARWIN_X64: ${{ needs.build-sidecar-darwin-x64.outputs.sha256 }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$SHA_DARWIN_ARM64" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no digest was reported for DARWIN_ARM64"; exit 1; }
          [[ "$SHA_DARWIN_X64" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no digest was reported for DARWIN_X64"; exit 1; }
          in="${RUNNER_TEMP}/unsigned"
          want="$(printf '%s\n' "${in}/darwin-arm64" "${in}/darwin-arm64/jarvis-app.tar.gz" "${in}/darwin-x64" "${in}/darwin-x64/jarvis-app.tar.gz")"
          if [ "$(find "$in" -mindepth 1 -print | sort)" != "$want" ] || [ -n "$(find "$in" -mindepth 1 -not -type d -not -type f -print)" ]; then
            echo "::error::the unsigned-darwin-arm64 and unsigned-darwin-x64 artifacts are not exactly one file each, jarvis-app.tar.gz"
            exit 1
          fi
          printf '%s  %s\n' "$SHA_DARWIN_ARM64" "${in}/darwin-arm64/jarvis-app.tar.gz" "$SHA_DARWIN_X64" "${in}/darwin-x64/jarvis-app.tar.gz" | shasum -a 256 -c -

      # Each archive holds Jarvis.app and nothing else: no member outside it,
      # no absolute path, no .., nothing but files and directories (no
      # symlink or hard link, whose target the name check cannot see), and
      # once unpacked no link, device, fifo or file with a second name, so
      # nothing the build job put in it lands outside the work directory or
      # points codesign at a file it did not make. /usr/bin/tar by path: on
      # macOS that is bsdtar, whatever else is on PATH.
      - name: Unpack the bundles
        run: |
          set -euo pipefail
          export LC_ALL=C
          for leg in darwin-arm64 darwin-x64; do
            tgz="${RUNNER_TEMP}/unsigned/${leg}/jarvis-app.tar.gz"
            dest="${RUNNER_TEMP}/work/${leg}"
            names="$(/usr/bin/tar -tzf "$tgz")"
            while IFS= read -r m; do
              if ! [[ "$m" =~ ^Jarvis\.app(/|$) ]] || [[ "$m" =~ (^|/)\.\.(/|$) ]]; then
                printf '::error::the %s bundle archive holds %q, outside Jarvis.app\n' "$leg" "$m"
                exit 1
              fi
            done <<<"$names"
            while IFS= read -r m; do
              if [[ "$m" != [-d]* ]] || [[ "$m" == *" link to "* ]] || [[ "$m" == *" -> "* ]]; then
                printf '::error::the %s bundle archive holds a member that is not a plain file or directory: %q\n' "$leg" "$m"
                exit 1
              fi
            done < <(/usr/bin/tar -tvzf "$tgz")
            mkdir -p "$dest"
            /usr/bin/tar -xzf "$tgz" -C "$dest"
            if [ "$(find "$dest" -mindepth 1 -maxdepth 1 -print)" != "${dest}/Jarvis.app" ] || [ -n "$(find "$dest" -mindepth 1 -not -type d -not -type f -print)" ] || [ -n "$(find "$dest" -type f -links +1 -print)" ]; then
              echo "::error::the ${leg} bundle is not Jarvis.app alone, of plain files and directories"
              exit 1
            fi
          done

      # Signing needs all five Apple secrets. A real run missing them FAILS
      # here (#921). It used to warn and carry on, and since signing follows
      # this decision, a release then shipped an UNSIGNED Jarvis.app, which
      # Gatekeeper refuses to open on recent macOS, in a green run. Shipping
      # unsigned is now a recorded choice: set the repository variable
      # ALLOW_UNSIGNED_MACOS to exactly `true`. A dry run still only warns,
      # so a rehearsal needs no signing configuration. APPLE_CERT_P12 set
      # with another secret missing is a broken configuration, and fails
      # every run, dry or not, as it did before. The secrets reach this step
      # only as whether each is set, never their values. release-exec.test.sh
      # runs this script verbatim against every case.
      - name: macOS signing readiness
        id: applesign
        env:
          HAVE_APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 != '' }}
          HAVE_APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD != '' }}
          HAVE_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAVE_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAVE_ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 != '' }}
          ALLOW_UNSIGNED_MACOS: ${{ vars.ALLOW_UNSIGNED_MACOS }}
        run: |
          set -euo pipefail
          absent=""
          [ "${HAVE_APPLE_CERT_P12}" = "true" ] || absent="${absent:+${absent}, }APPLE_CERT_P12"
          [ "${HAVE_APPLE_CERT_PASSWORD}" = "true" ] || absent="${absent:+${absent}, }APPLE_CERT_PASSWORD"
          [ "${HAVE_ASC_KEY_ID}" = "true" ] || absent="${absent:+${absent}, }ASC_KEY_ID"
          [ "${HAVE_ASC_ISSUER_ID}" = "true" ] || absent="${absent:+${absent}, }ASC_ISSUER_ID"
          [ "${HAVE_ASC_API_KEY_P8}" = "true" ] || absent="${absent:+${absent}, }ASC_API_KEY_P8"
          if [ -z "$absent" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ "${ALLOW_UNSIGNED_MACOS}" = "true" ]; then
              echo "::warning::ALLOW_UNSIGNED_MACOS is set but signing is configured, so it changed nothing this run. Delete the variable, or the next missing signing secret ships an UNSIGNED Jarvis.app instead of failing."
            fi
          elif [ "${HAVE_APPLE_CERT_P12}" = "true" ]; then
            echo "::error::APPLE_CERT_P12 is set but ${absent} is not, so signing cannot complete. Set the missing secret."
            exit 1
          elif [ "${DRY_RUN}" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing is not configured (${absent} unset). This dry run continues and builds an UNSIGNED Jarvis.app; a real release would stop here unless ALLOW_UNSIGNED_MACOS is true."
          elif [ "${ALLOW_UNSIGNED_MACOS}" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing is not configured (${absent} unset). Shipping an UNSIGNED Jarvis.app because ALLOW_UNSIGNED_MACOS is true (Gatekeeper will refuse to open it on other machines, and the self-updater of every installed macOS sidecar will refuse to install it)."
          else
            echo "::error::macOS signing is not configured (${absent} unset), so this release would ship an UNSIGNED Jarvis.app, which Gatekeeper refuses to open. Set the Apple signing secrets, or set the repository variable ALLOW_UNSIGNED_MACOS to true to ship unsigned on purpose."
            exit 1
          fi

      # Signing is inside-out (nested Mach-Os first, never --deep) with the
      # hardened runtime, then notarized and stapled so Gatekeeper approves
      # offline. Gated on the readiness step, and nothing else holds the
      # secrets.
      - name: Sign and notarize (Developer ID)
        if: steps.applesign.outputs.ready == 'true'
        working-directory: sidecar
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # trap, not a trailing rm: `set -e` means any failure between here
          # and the end would leave the certificate or the private key on the
          # runner, or the identity usable by every later step of this job
          # (#870 review). So the keychain, under RUNNER_TEMP, is deleted and
          # the search list put back on the way out, whatever happened.
          cert="${RUNNER_TEMP}/cert.p12"
          key="${RUNNER_TEMP}/asc_key.p8"
          kc="${RUNNER_TEMP}/sign.keychain-db"
          trap 'rm -f "$cert" "$key"; security list-keychains -d user -s login.keychain || true; security delete-keychain "$kc" || true' EXIT

          # Ephemeral keychain holding the Developer ID certificate
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          (umask 077; printf '%s' "$APPLE_CERT_P12" | base64 -d > "$cert")
          security import "$cert" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$cert"
          (umask 077; printf '%s' "$ASC_API_KEY_P8" > "$key")
          # Nothing after this line needs the values, so no program it starts
          # inherits them (the ones above did, and are Apple and system tools).
          unset APPLE_CERT_P12 APPLE_CERT_PASSWORD ASC_API_KEY_P8
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain
          IDENTITY="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY" || { echo "::error::no 'Developer ID Application' identity in APPLE_CERT_P12"; exit 1; }
          echo "Signing as: $IDENTITY"

          for leg in darwin-arm64 darwin-x64; do
            app="${RUNNER_TEMP}/work/${leg}/Jarvis.app"
            if [ -f "${app}/Contents/MacOS/ocr-helper" ]; then
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "${app}/Contents/MacOS/ocr-helper"
            fi
            codesign --force --options runtime --timestamp \
              --entitlements packaging/macos/entitlements.plist \
              --sign "$IDENTITY" "$app"
            codesign --verify --strict --verbose=2 "$app"

            zip="${RUNNER_TEMP}/Jarvis-${leg}.zip"
            ditto -c -k --keepParent "$app" "$zip"
            # notarytool's exit code is not reliable on an Invalid verdict --
            # check the JSON status and dump the notarization log on failure
            # (the submission id is unrecoverable once this runner is gone).
            SUBMIT_JSON="$(xcrun notarytool submit "$zip" \
              --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
              --wait --timeout 30m --output-format json)" || true
            echo "$SUBMIT_JSON"
            SUBMISSION_ID="$(echo "$SUBMIT_JSON" | jq -r '.id // empty')"
            NOTARY_STATUS="$(echo "$SUBMIT_JSON" | jq -r '.status // empty')"
            if [ "$NOTARY_STATUS" != "Accepted" ]; then
              echo "::error::notarization of the ${leg} bundle failed (status: ${NOTARY_STATUS:-unknown})"
              if [ -n "$SUBMISSION_ID" ]; then
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
              fi
              exit 1
            fi
            xcrun stapler staple "$app"
            spctl --assess --type execute -vv "$app"
          done

      # tar, as the build legs do: upload-artifact strips exec bits and
      # symlinks, which would break the seal. COPYFILE_DISABLE +
      # --no-mac-metadata keep bsdtar from archiving xattrs as AppleDouble
      # (._*) entries, which GNU tar on the publish runner would extract as
      # literal files inside the bundle.
      - name: Package Jarvis.app
        run: |
          set -euo pipefail
          export COPYFILE_DISABLE=1
          for leg in darwin-arm64 darwin-x64; do
            mkdir -p "${RUNNER_TEMP}/out/${leg}"
            /usr/bin/tar --no-mac-metadata -C "${RUNNER_TEMP}/work/${leg}" -czf "${RUNNER_TEMP}/out/${leg}/jarvis-app.tar.gz" Jarvis.app
          done

      # The digests of exactly the files the uploads below take, as outputs
      # of this job alone (#781).
      - name: Digest
        id: digest
        run: |
          set -euo pipefail
          for leg in darwin-arm64 darwin-x64; do
            sum="$(shasum -a 256 "${RUNNER_TEMP}/out/${leg}/jarvis-app.tar.gz")"
            sum="${sum%% *}"
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not hash the ${leg} bundle"; exit 1; }
            echo "sha256_${leg//-/_}=${sum}" >> "$GITHUB_OUTPUT"
            echo "${leg}: jarvis-app.tar.gz sha256 ${sum}"
          done

      - name: Upload bundle (darwin-arm64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecar-darwin-arm64
          path: ${{ runner.temp }}/out/darwin-arm64/jarvis-app.tar.gz
          if-no-files-found: error

      - name: Upload bundle (darwin-x64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecar-darwin-x64
          path: ${{ runner.temp }}/out/darwin-x64/jarvis-app.tar.gz
          if-no-files-found: error

  # --- macOS: post-sign verification (no secret, no OIDC) (#921) ---
  # The signer runs codesign --verify, which says the seal holds but accepts
  # a signature by ANY identity: a signer that imported the wrong
  # certificate would pass it. This job holds none of the signing
  # credentials, takes the bundles by the digests sign-sidecar-darwin
  # reported (what publish-sidecar checks too, so what is checked here is
  # what ships), refuses an unsigned answer on a real run without
  # ALLOW_UNSIGNED_MACOS (a second gate, as #869 has for Windows), and checks
  # each bundle as the self-updater will: our Developer ID team (the
  # requirement internal/update pins), a stapled ticket and Gatekeeper.
  # publish-sidecar waits for it. Only tools macOS ships are used.
  verify-sidecar-darwin:
    needs: [resolve, sign-sidecar-darwin]
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # For require-signing-pin.sh and verify-macos-signature.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outside the checkout: extracted over it, an artifact could replace
      # the scripts that do the checking.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-darwin-arm64
          path: ${{ runner.temp }}/signed/darwin-arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-darwin-x64
          path: ${{ runner.temp }}/signed/darwin-x64

      - name: Verify the signed bundle digests
        env:
          SHA_DARWIN_ARM64: ${{ needs.sign-sidecar-darwin.outputs.sha256_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ needs.sign-sidecar-darwin.outputs.sha256_darwin_x64 }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          for v in SHA_DARWIN_ARM64 SHA_DARWIN_X64; do
            [[ "${!v}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sign-sidecar-darwin reported no digest for ${v#SHA_}"; exit 1; }
          done
          in="${RUNNER_TEMP}/signed"
          want="$(printf '%s\n' "${in}/darwin-arm64" "${in}/darwin-arm64/jarvis-app.tar.gz" "${in}/darwin-x64" "${in}/darwin-x64/jarvis-app.tar.gz")"
          if [ "$(find "$in" -mindepth 1 -print | sort)" != "$want" ] || [ -n "$(find "$in" -mindepth 1 -not -type d -not -type f -print)" ]; then
            echo "::error::the sidecar-darwin-arm64 and sidecar-darwin-x64 artifacts are not exactly one file each, jarvis-app.tar.gz"
            exit 1
          fi
          printf '%s  %s\n' "$SHA_DARWIN_ARM64" "${in}/darwin-arm64/jarvis-app.tar.gz" "$SHA_DARWIN_X64" "${in}/darwin-x64/jarvis-app.tar.gz" | shasum -a 256 -c -

      # #921, checked again in a job that holds no secret: the signer decides
      # whether to sign, and this refuses its answer when a real run without
      # ALLOW_UNSIGNED_MACOS says it did not, so a mistake in that decision
      # cannot reach the publish on its own. An empty answer (the signer did
      # not say) is a refusal too.
      - name: Refuse an unsigned bundle on a real run
        env:
          SIGNED: ${{ needs.sign-sidecar-darwin.outputs.signed }}
          ALLOW_UNSIGNED_MACOS: ${{ vars.ALLOW_UNSIGNED_MACOS }}
        run: |
          set -euo pipefail
          if [ "${SIGNED}" != "true" ] && [ "${DRY_RUN}" != "true" ] && [ "${ALLOW_UNSIGNED_MACOS}" != "true" ]; then
            echo "::error::sign-sidecar-darwin did not sign Jarvis.app, and this is a real run without ALLOW_UNSIGNED_MACOS set to true, so it would ship unsigned. See its macOS signing readiness step."
            exit 1
          fi

      # The bundle must carry OUR team, the one the self-updater pins at
      # runtime. Empty fails a real run unless ALLOW_UNPINNED_MACOS is true
      # (#922). Each bundle is unpacked under runner.temp, by /usr/bin/tar
      # (bsdtar on macOS), and must be Jarvis.app alone, of plain files and
      # directories, as the signer required of what it was given: this
      # check does not lean on the signer for that (#921 review).
      - name: Verify the Developer ID signature and team
        if: needs.sign-sidecar-darwin.outputs.signed == 'true'
        working-directory: sidecar
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNPINNED_MACOS: ${{ vars.ALLOW_UNPINNED_MACOS }}
        run: |
          set -euo pipefail
          ../.github/scripts/require-signing-pin.sh APPLE_TEAM_ID ALLOW_UNPINNED_MACOS "Jarvis.app"
          for leg in darwin-arm64 darwin-x64; do
            tgz="${RUNNER_TEMP}/signed/${leg}/jarvis-app.tar.gz"
            dest="${RUNNER_TEMP}/check/${leg}"
            while IFS= read -r m; do
              if [[ "$m" != [-d]* ]] || [[ "$m" == *" link to "* ]] || [[ "$m" == *" -> "* ]]; then
                printf '::error::the signed %s bundle archive holds a member that is not a plain file or directory: %q\n' "$leg" "$m"
                exit 1
              fi
            done < <(/usr/bin/tar -tvzf "$tgz")
            mkdir -p "$dest"
            /usr/bin/tar -xzf "$tgz" -C "$dest"
            if [ "$(find "$dest" -mindepth 1 -maxdepth 1 -print)" != "${dest}/Jarvis.app" ] || [ -n "$(find "$dest" -mindepth 1 -not -type d -not -type f -print)" ] || [ -n "$(find "$dest" -type f -links +1 -print)" ]; then
              echo "::error::the signed ${leg} bundle is not Jarvis.app alone, of plain files and directories"
              exit 1
            fi
            ../.github/scripts/verify-macos-signature.sh app "${dest}/Jarvis.app"
          done

  # --- Windows: cross-compile (no OIDC) ---
  # Split out of the matrix so the matrix holds no id-token, and split from
  # signing so the compiler, mingw and the Go module graph never run in a job
  # that can mint one (#682): a compromised toolchain here could otherwise ask
  # Workload Identity Federation for a token and have KMS sign anything. The
  # binary crosses to sign-sidecar-windows with its digest as a job output.
  build-sidecar-windows:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Actions cache is writable by any run on main, and Go reuses
          # cached modules and build output without re-verifying them (#681).
          cache: false
          # Track sidecar/go.mod as the single source of the Go version.
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      # Windows cross-compile from Linux via mingw-w64 + the bundled EventToken.h
      # shim (the one WebView2 SDK header mingw lacks). Same recipe as
      # verify-windows.sh -- no Windows runner needed.
      - name: Install mingw-w64 (Windows cross)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build sidecar (windows/amd64)
        working-directory: sidecar
        env:
          GOOS: windows
          GOARCH: amd64
          SETUP: windows-cross
          OUT: ${{ env.SIDECAR_BIN }}.exe
          # The self-updater verifies the payloads it installs exactly as
          # Jarvis-Setup does (internal/update), so it carries the same pin:
          # the Authenticode publisher. Empty fails a real run unless
          # ALLOW_UNPINNED_WINDOWS is exactly true; a dry run warns (#922).
          SIGNING_PUBLISHER_CN: ${{ vars.SIGNING_PUBLISHER_CN }}
          ALLOW_UNPINNED_WINDOWS: ${{ vars.ALLOW_UNPINNED_WINDOWS }}
        run: ../.github/scripts/build-sidecar.sh

      - name: Digest
        id: digest
        working-directory: sidecar
        run: echo "sha256=$(sha256sum "${SIDECAR_BIN}.exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Not under the sidecar-* name: that is the signed binary, which only
      # sign-sidecar-windows uploads.
      - name: Upload unsigned binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-win32-x64
          path: sidecar/${{ env.SIDECAR_BIN }}.exe
          if-no-files-found: error
          retention-days: 1

  # --- Windows: Authenticode-sign via Cloud KMS ---
  # The only job here besides publish-sidecar that holds id-token. It builds
  # nothing and installs nothing: it verifies the binary build-sidecar-windows
  # reported, signs it with scripts/sign-windows.sh (whose jsign download is
  # checksum-pinned), and uploads the result as sidecar-win32-x64 -- signed,
  # or, when signing is not configured, unsigned on a dry run or with
  # ALLOW_UNSIGNED_WINDOWS set, and otherwise not at all (#869: see the
  # readiness step). The post-sign check runs in verify-sidecar-windows
  # (#817).
  #
  # Who can sign (#819). The token this job mints is exchanged for the KMS
  # signing identity only if the Workload Identity provider behind
  # vars.GCP_WORKLOAD_IDENTITY_PROVIDER accepts it, and that provider, not
  # this file, decides who signs. Its attribute condition lives in GCP, where
  # no review or test here can see it; as set on 2026-10-09 it is:
  #   assertion.repository=='vierisid/jarvis' && (
  #     assertion.job_workflow_ref.startsWith('vierisid/jarvis/.github/workflows/sidecar-release.yml@refs/tags/v')
  #     || assertion.job_workflow_ref.startsWith('vierisid/jarvis/.github/workflows/sidecar-release.yml@refs/heads/main')
  #     || assertion.job_workflow_ref.startsWith('vierisid/jarvis/.github/workflows/installer-release.yml@refs/tags/installer-v')
  #     || assertion.job_workflow_ref.startsWith('vierisid/jarvis/.github/workflows/installer-release.yml@refs/heads/main'))
  # It admits this file when run from main or a v* tag (and the other signing
  # workflow likewise; see there). By its text it refuses a dispatch from a
  # branch such as throwaway, and another repository calling the public
  # reusable sidecar-release.yml (assertion.repository is the caller). It does
  # NOT close every branch path, so do not rely on it for that:
  #   * the main clauses are startsWith prefix matches, so a branch whose
  #     name starts with main (main-x, maint) passes them;
  #   * a workflow on any branch of this repository can call
  #     vierisid/jarvis/.github/workflows/sidecar-release.yml@main; the ref
  #     then reads @refs/heads/main, while every checkout here (no ref:)
  #     takes the caller commit, so the branch code is built and signed.
  #     release-exec.yml calls this file by local path, so for it the ref
  #     is the ref of its own run.
  # Both need write access, like the tag path below. Exact equality for main
  # in the condition would close the first; an environment gate keyed on
  # github.ref, on BOTH signing jobs, would close both. Only the allow side
  # has been exercised (every dry run); the deny side has not, and a test of
  # it should try a main-prefixed branch and a remote-ref call as well as a
  # plain branch. Renaming this file, moving this job or changing the tag
  # prefix needs the condition changed with it, or signing fails (403).
  #
  # Deliberately NOT gated (owner decision on #819): this job has no
  # environment:, and a dry run signs for real, because the dry run is the
  # only proof before a release that signing works, and main is reviewed.
  # Accepted while the only write collaborators are the two owners: the two
  # branch paths above, and that a write collaborator can create a v* tag on
  # any commit (tag creation is left open for release.yml, #679) and sign from
  # it. When a third collaborator gets write, put both signing jobs behind the
  # release environment, keyed on github.ref and not on dry_run: a dry
  # dispatch on a fresh tag would otherwise land in release-dry-run, which has
  # no rules, and sign.
  sign-sidecar-windows:
    needs: [resolve, build-sidecar-windows]
    # build, not should_release (#952): on a publish_only call this job,
    # which holds the KMS-federating token, must not run even if someone
    # later adds a status function that would carry it past its skipped need.
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    # OIDC, for google-github-actions/auth: Windows signing federates into
    # Google Cloud KMS with no stored credential at all. Declared here rather
    # than at the workflow level so no other job can mint a token. Windows
    # signing is keyless: there is no secret to sentinel on, so the gate is
    # the keyring variable -- nothing can be signed without it.
    permissions:
      contents: read
      id-token: write
    # The SIGNED binary's digest (#781). Signing changes the bytes, so the
    # digest build-sidecar-windows reported no longer describes what this job
    # uploads, and without this the signed artifact reached publish-sidecar
    # with nothing to check it against.
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      # Whether the signing step ran, so verify-sidecar-windows knows whether
      # there is a signature to check (false only on a dry run or under
      # ALLOW_UNSIGNED_WINDOWS, #869).
      signed: ${{ steps.winsign.outputs.ready }}
    steps:
      # For scripts/sign-windows.sh and the committed certificate chain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Into a directory of its own, never the checkout (#817 review): an
      # artifact is a zip any job in this run can write -- a Linux or macOS
      # leg included -- and extracted over sidecar/ it could replace
      # scripts/sign-windows.sh before that runs with the KMS token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-win32-x64
          path: ${{ runner.temp }}/unsigned

      # The digest travels as a job output, which only build-sidecar-windows
      # can set; the artifact store is writable by every job in this run.
      # Exactly one regular file, that digest, and only then a copy into place.
      - name: Verify the binary
        working-directory: sidecar
        env:
          SHA256: ${{ needs.build-sidecar-windows.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build-sidecar-windows reported no digest"; exit 1; }
          in="${RUNNER_TEMP}/unsigned"
          if [ "$(find "$in" -mindepth 1 -print)" != "${in}/${SIDECAR_BIN}.exe" ] || [ -L "${in}/${SIDECAR_BIN}.exe" ] || [ ! -f "${in}/${SIDECAR_BIN}.exe" ]; then
            echo "::error::the unsigned-win32-x64 artifact is not exactly one file, ${SIDECAR_BIN}.exe"
            exit 1
          fi
          echo "${SHA256}  ${in}/${SIDECAR_BIN}.exe" | sha256sum -c -
          install -m 0644 "${in}/${SIDECAR_BIN}.exe" "${SIDECAR_BIN}.exe"

      # Windows signing needs BOTH the KMS keyring variable AND the issued
      # certificate chain in the repo. They arrive at DIFFERENT times: the
      # Sectigo CSR is generated FROM the KMS key, so the keyring necessarily
      # exists days before the certificate does -- so this checks the chain
      # file too, and says which of the two is missing.
      #
      # A real run missing either one FAILS here (#869). It used to warn and
      # carry on, and since every signing and verification step follows this
      # decision, a release then shipped an UNSIGNED jarvis.exe with nothing
      # but a warning in a green run. Shipping unsigned is now a recorded
      # choice: set the repository variable ALLOW_UNSIGNED_WINDOWS to exactly
      # `true` and the run warns and continues as it used to. A dry run
      # still only warns, so a rehearsal needs no signing configuration.
      # release-exec.test.sh runs this script verbatim against every case.
      - name: Windows signing readiness
        id: winsign
        env:
          GCP_KMS_KEYRING: ${{ vars.GCP_KMS_KEYRING }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "${GCP_KMS_KEYRING}" ]; then
            missing="Windows signing is not configured (GCP_KMS_KEYRING unset)"
            fix="Set the GCP_KMS_KEYRING repository variable"
          elif [ ! -f sidecar/packaging/windows/codesign-chain.pem ]; then
            missing="GCP_KMS_KEYRING is set but sidecar/packaging/windows/codesign-chain.pem is missing -- the certificate has not been issued/committed yet"
            fix="Issue the certificate and commit sidecar/packaging/windows/codesign-chain.pem"
          fi
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ "${ALLOW_UNSIGNED_WINDOWS}" = "true" ]; then
              echo "::warning::ALLOW_UNSIGNED_WINDOWS is set but signing is configured, so it changed nothing this run. Delete the variable, or the next missing signing config ships an UNSIGNED jarvis.exe instead of failing."
            fi
          elif [ "${DRY_RUN}" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${missing}. This dry run continues and builds an UNSIGNED jarvis.exe; a real release would stop here unless ALLOW_UNSIGNED_WINDOWS is true."
          elif [ "${ALLOW_UNSIGNED_WINDOWS}" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${missing}. Shipping an UNSIGNED jarvis.exe because ALLOW_UNSIGNED_WINDOWS is true (SmartScreen will warn users)."
          else
            echo "::error::${missing}, so this release would ship an UNSIGNED jarvis.exe. ${fix}, or set the repository variable ALLOW_UNSIGNED_WINDOWS to true to ship unsigned on purpose."
            exit 1
          fi

      # ─── Windows: Authenticode signature (Cloud KMS + Sectigo) ────────
      # Keyless: OIDC → Workload Identity Federation → a short-lived access
      # token for the Cloud HSM key. Nothing is stored in this repository, so
      # there is no signing secret to leak or rotate.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        if: steps.winsign.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SIGNING_SERVICE_ACCOUNT }}
          token_format: "access_token"
          # Only access_token is used. The default (true) writes a
          # gha-creds-*.json into the workspace that carries what is needed
          # to mint further OIDC tokens; nothing here reads it (#682).
          create_credentials_file: false

      # scripts/sign-windows.sh is the single signing code path, shared with
      # installer-release.yml and runnable locally (see its header), so a local
      # test exercises exactly what CI runs. Gated on the readiness step: with
      # the keyring or the chain absent, a real run has already failed there
      # unless ALLOW_UNSIGNED_WINDOWS is true (#869).
      # --defer-verify (#817): the check needs osslsigncode, an apt package,
      # and apt maintainer scripts run as root beside this job's OIDC token.
      # verify-sidecar-windows runs it instead, and publish-sidecar waits for
      # it.
      - name: Sign Windows binary (Cloud KMS)
        if: steps.winsign.outputs.ready == 'true'
        working-directory: sidecar
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GCP_KMS_KEYRING: ${{ vars.GCP_KMS_KEYRING }}
          GCP_KMS_KEY_ALIAS: ${{ vars.GCP_KMS_KEY_ALIAS }}
        run: scripts/sign-windows.sh --defer-verify "${SIDECAR_BIN}.exe"

      - name: Digest
        id: digest
        working-directory: sidecar
        run: echo "sha256=$(sha256sum "${SIDECAR_BIN}.exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidecar-win32-x64
          path: sidecar/${{ env.SIDECAR_BIN }}.exe
          if-no-files-found: error

  # --- Windows: post-sign verification (no OIDC) ---
  # #817. The check needs osslsigncode, which comes from apt, and apt runs
  # package maintainer scripts as root: in sign-sidecar-windows they ran
  # beside the Workload Identity token, so a mirror or archive compromise
  # reached the KMS signing identity. Here nothing can mint a token. The
  # binary is taken by the digest sign-sidecar-windows reported, which is
  # also what publish-sidecar checks, so what is verified here is what ships;
  # and publish-sidecar waits for this job. sign-windows.sh --verify-only
  # fails when osslsigncode is missing, so dropping the install cannot turn
  # into a skipped check.
  verify-sidecar-windows:
    needs: [resolve, sign-sidecar-windows]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # For scripts/sign-windows.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outside the checkout, as in sign-sidecar-windows: extracted over
      # sidecar/, an artifact could replace the script that does the checking.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-win32-x64
          path: ${{ runner.temp }}/signed

      - name: Verify the signed binary digest
        env:
          SHA256: ${{ needs.sign-sidecar-windows.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sign-sidecar-windows reported no digest"; exit 1; }
          in="${RUNNER_TEMP}/signed"
          if [ "$(find "$in" -mindepth 1 -print)" != "${in}/${SIDECAR_BIN}.exe" ] || [ -L "${in}/${SIDECAR_BIN}.exe" ] || [ ! -f "${in}/${SIDECAR_BIN}.exe" ]; then
            echo "::error::the sidecar-win32-x64 artifact is not exactly one file, ${SIDECAR_BIN}.exe"
            exit 1
          fi
          echo "${SHA256}  ${in}/${SIDECAR_BIN}.exe" | sha256sum -c -

      # #869, checked again in a job that holds no token: the signer decides
      # whether to sign, and this refuses its answer when a real run without
      # ALLOW_UNSIGNED_WINDOWS says it did not, so a mistake in that decision
      # cannot reach the publish on its own. An empty answer (the signer did
      # not say) is a refusal too.
      - name: Refuse an unsigned binary on a real run
        env:
          SIGNED: ${{ needs.sign-sidecar-windows.outputs.signed }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        run: |
          set -euo pipefail
          if [ "${SIGNED}" != "true" ] && [ "${DRY_RUN}" != "true" ] && [ "${ALLOW_UNSIGNED_WINDOWS}" != "true" ]; then
            echo "::error::sign-sidecar-windows did not sign jarvis.exe, and this is a real run without ALLOW_UNSIGNED_WINDOWS set to true, so it would ship unsigned. See its Windows signing readiness step."
            exit 1
          fi

      - name: Install osslsigncode
        if: needs.sign-sidecar-windows.outputs.signed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osslsigncode

      - name: Verify the Authenticode signature
        if: needs.sign-sidecar-windows.outputs.signed == 'true'
        working-directory: sidecar
        env:
          # The binary must carry OUR publisher, the same identity the
          # installer pins at runtime. Empty fails a real run unless
          # ALLOW_UNPINNED_WINDOWS is true (#922); the signer leaf is pinned
          # either way, from the committed chain (#871).
          SIGNING_PUBLISHER_CN: ${{ vars.SIGNING_PUBLISHER_CN }}
          ALLOW_UNPINNED_WINDOWS: ${{ vars.ALLOW_UNPINNED_WINDOWS }}
          # Sectigo's roots are publicly trusted, so demand the FULL
          # verification (osslsigncode exit 0), and a check that runs at all.
          # This is the script's default too; stated here so the release
          # posture is visible at the workflow.
          SIGN_REQUIRE_TRUSTED_CHAIN: "1"
        run: |
          set -euo pipefail
          ../.github/scripts/require-signing-pin.sh SIGNING_PUBLISHER_CN ALLOW_UNPINNED_WINDOWS "${SIDECAR_BIN}.exe"
          scripts/sign-windows.sh --verify-only "${RUNNER_TEMP}/signed/${SIDECAR_BIN}.exe"

  # ─── Publish sidecar packages to npm ───────────────────────────
  publish-sidecar:
    # Same requirement as publish-brain in release-exec.yml (#679): npm Trusted
    # Publishing is bound to this environment, so the OIDC claim must carry it.
    # It must be declared HERE rather than on the calling job, because GitHub
    # does not allow `environment:` on a job that uses a reusable workflow.
    # See the matching block in release-exec.yml: a dry run records its
    # deployment against a separate environment so a rehearsal cannot appear as
    # the live state of `release`. `env` is not an allowed context in an
    # environment name, so this reads the input directly.
    environment:
      name: ${{ inputs.dry_run == true && 'release-dry-run' || 'release' }}
    needs: [resolve, verify-sidecar-windows, verify-sidecar-darwin, build-sidecar-linux-x64, build-sidecar-linux-arm64, sign-sidecar-darwin, sign-sidecar-windows]
    # Two ways to run, and only two (#952):
    #   * resolve said publish and every job above succeeded in THIS call --
    #     the build and publish of a dispatch, the condition this job had
    #     before.
    #   * a publish_only call, where every job above is skipped by design
    #     (resolve included), so neither success() nor resolve can decide.
    #     It publishes exactly when the build call built, which that call
    #     says by a non-empty digests output, and never asks npm a second
    #     time: a second `npm view` could disagree with the first (one that
    #     fails transiently reads as "not published") and send this call to
    #     publish artifacts nobody built. It runs only if nothing above failed
    #     or was cancelled; what vouches for the build is the caller, which
    #     starts this call only after the publish: false call succeeded as a
    #     whole (verify-sidecar-windows and verify-sidecar-darwin included),
    #     and the digests it hands
    #     over, checked below as strictly as job outputs.
    # The `inputs.publish_only == true` term is what keeps the status
    # functions away from every other call: release-exec.test.sh pins this
    # line byte for byte.
    if: (needs.resolve.outputs.publish == 'true' && success()) || (inputs.publish_only == true && inputs.publish == true && inputs.digests != '' && !cancelled() && !failure())
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
      # The call outputs github-release reads (#952). released is literal:
      # it is set only if this job ran, and the call fails unless it
      # finished, so true here means this job published, or found the
      # version already on npm and took that as success (the fallback in the
      # publish steps). That fallback holds on a real run only when npm
      # serves exactly the platform files this job verified (#958), so a
      # concurrent standalone dispatch of the same version can no longer
      # leave github-release attaching binaries npm does not serve.
      released: "true"
      version: ${{ steps.version.outputs.version }}
    steps:
      # The one place this job learns its version (#952). A publish_only call
      # ran no resolve, so it takes the build call's, passed through the
      # caller as the version input; every other call takes resolve's.
      # Exactly one source per call, and the value is checked again as resolve
      # checks it (#684), because it still names npm packages and lands in a
      # sed expression. First, so nothing runs before it is known.
      - name: Resolve the version this call publishes
        id: version
        env:
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          BUILT_VERSION: ${{ needs.resolve.outputs.version }}
          GIVEN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [ "${PUBLISH_ONLY:-}" = "true" ]; then
            if [ -n "${BUILT_VERSION:-}" ]; then
              echo "::error::a publish_only call takes its version from the version input, yet resolve ran in this call"
              exit 1
            fi
            VERSION="${GIVEN_VERSION:-}"
          else
            if [ -n "${GIVEN_VERSION:-}" ]; then
              echo "::error::the version input is for a publish_only call; this call resolved its own"
              exit 1
            fi
            VERSION="${BUILT_VERSION:-}"
          fi
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${id}(\.${id})*)?$ ]]; then
            printf '::error::the sidecar version to publish is not a plain semver: %q\n' "$VERSION"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm runs in this checkout with the OIDC publish token in reach
      # (#1046), so what the checkout says to npm is held here, before the
      # first npm command. Every npm version and directory npm publish below
      # passes --ignore-scripts, which skips the preversion, version,
      # postversion, prepublishOnly, prepack, prepare, postpack, publish and
      # postpublish scripts (measured on npm 12.1.0: without it all nine
      # ran), and npm version passes --workspaces=false, without which a
      # workspaces field in a package.json above it made it install that
      # workspace root (measured). The flags do nothing about config:
      #   * a .npmrc in the directory npm runs from is read as project config
      #     (measured: one there set the registry npm used), so none may exist
      #     anywhere in the checkout;
      #   * sidecar/npm is exactly the files committed there, with no link: a
      #     link (bin -> .) let an artifact Prepare unpacks below land a
      #     .npmrc or a package.json beside npm after this check (security
      #     review), so Prepare checks each package directory again too;
      #   * each package.json carries only its listed fields, its own name,
      #     and files: ["bin"]; publishConfig (measured) redirects the
      #     publish, scripts run, and the name picks what gets published.
      - name: Refuse npm config and package fields that change what npm runs
        run: |
          set -euo pipefail
          if [ -n "$(find . -name .npmrc -print -quit)" ]; then
            echo "::error::the checkout holds a .npmrc, which npm would read as config in a job holding id-token (#1046)"
            exit 1
          fi
          tree="$(find sidecar/npm -mindepth 1 -printf '%y %P\n' | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$tree" != "d darwin-arm64 d darwin-x64 d jarvis-sidecar d jarvis-sidecar/bin d linux-arm64 d linux-x64 d win32-x64 f darwin-arm64/package.json f darwin-x64/package.json f jarvis-sidecar/bin/jarvis f jarvis-sidecar/package.json f linux-arm64/package.json f linux-x64/package.json f win32-x64/package.json " ]; then
            echo "::error::sidecar/npm is not exactly the six packages and the wrapper launcher, as plain files and directories, so npm could act on something this check never read (#1046)"
            exit 1
          fi
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            if ! jq -e --arg name "@usejarvis/sidecar-${platform}" 'type == "object" and (keys - ["cpu", "description", "files", "name", "os", "repository", "version"] == []) and .name == $name and .files == ["bin"]' "sidecar/npm/${platform}/package.json" >/dev/null; then
              echo "::error::sidecar/npm/${platform}/package.json is not named @usejarvis/sidecar-${platform}, does not ship bin alone, or has a field beyond name, version, description, repository, os, cpu and files, such as scripts or publishConfig, which npm would act on in a job holding id-token (#1046)"
              exit 1
            fi
          done
          if ! jq -e 'type == "object" and (keys - ["bin", "description", "files", "name", "optionalDependencies", "repository", "version"] == []) and .name == "@usejarvis/sidecar" and .files == ["bin"] and .bin == {"jarvis": "bin/jarvis"} and (.optionalDependencies | type == "object" and keys == ["@usejarvis/sidecar-darwin-arm64", "@usejarvis/sidecar-darwin-x64", "@usejarvis/sidecar-linux-arm64", "@usejarvis/sidecar-linux-x64", "@usejarvis/sidecar-win32-x64"] and all(.[]; type == "string" and test("\\A[0-9]+\\.[0-9]+\\.[0-9]+\\z")))' sidecar/npm/jarvis-sidecar/package.json >/dev/null; then
            echo "::error::sidecar/npm/jarvis-sidecar/package.json is not the @usejarvis/sidecar wrapper of the five platform packages at plain versions, or has a field beyond name, version, description, repository, files, bin and optionalDependencies, which npm would act on in a job holding id-token (#1046)"
            exit 1
          fi

      # package-manager-cache: false (#1046 review): setup-node turns on its
      # npm cache by itself when package.json names npm as packageManager,
      # and the Actions cache is writable by any run on main.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: |
          set -euo pipefail
          # Checked where it is used (#960): whatever set it, an alias, a
          # path or a URL here would install some other package globally.
          # The digits are listed, not a range: a range follows the locale.
          [[ "$NPM_VERSION" =~ ^[0123456789]+\.[0123456789]+\.[0123456789]+$ ]] || { echo "::error::NPM_VERSION is not an exact x.y.z, so it could name another package (#960)"; exit 1; }
          # From a tarball with the pinned sha512, never by version (#1000):
          # fetched by its fixed registry URL into a fresh directory, so
          # nothing earlier put a file or a link at that path, checked, and
          # only then installed, offline and with no lifecycle scripts. npm
          # bundles every dependency it has, so it fetches nothing else. The
          # directory is named in full, never from TMPDIR: a relative one
          # made the path a git spec that npm fetched instead (review).
          npm_tgz="$(mktemp -d /tmp/npm.XXXXXXXXXX)/npm-${NPM_VERSION}.tgz"
          curl -fsS --proto '=https' --retry 3 --max-time 300 --max-filesize 67108864 -o "$npm_tgz" "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" || { echo "::error::could not download npm-${NPM_VERSION}.tgz from the registry (#1000)"; exit 1; }
          got="sha512-$(openssl dgst -sha512 -binary "$npm_tgz" | base64 -w0)"
          [ "$got" = "$NPM_INTEGRITY" ] || { echo "::error::npm-${NPM_VERSION}.tgz from the registry is ${got}, not the pinned NPM_INTEGRITY (#1000)"; exit 1; }
          npm install -g --offline --ignore-scripts "$npm_tgz"
          got="$(npm --version)"
          [ "$got" = "$NPM_VERSION" ] || { echo "::error::npm on PATH is $got, expected $NPM_VERSION"; exit 1; }

      # By exact name, each into its own directory (#952 follow-up), never
      # `pattern: sidecar-*`: a glob takes in any artifact so named, and any
      # job in this run can upload one -- pack-brain runs dependency code
      # beside sidecar-build -- so a planted sidecar-* artifact used to fail
      # this publish closed after the shared approval had released brain, and
      # stayed in the run, so a re-run failed the same way. By name it is
      # never downloaded. Same layout as the glob gave (artifacts/<name>/),
      # so the check below is unchanged.
      - name: Download sidecar-linux-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-linux-x64
          path: artifacts/sidecar-linux-x64

      - name: Download sidecar-linux-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-linux-arm64
          path: artifacts/sidecar-linux-arm64

      - name: Download sidecar-darwin-arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-darwin-arm64
          path: artifacts/sidecar-darwin-arm64

      - name: Download sidecar-darwin-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-darwin-x64
          path: artifacts/sidecar-darwin-x64

      - name: Download sidecar-win32-x64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidecar-win32-x64
          path: artifacts/sidecar-win32-x64

      # Before anything reads them (#781): each artifact must be the file its
      # build job hashed, by a digest that arrives as that job output (which
      # only that job can set), not through the artifact store (which every
      # job in this run can write). The download must also hold exactly the
      # five expected files: an artifact is a zip any job can replace with
      # one holding more files, and Prepare copies a whole directory into
      # each package. release-exec.test.sh runs this script against tampered,
      # extra, missing and undigested fixtures.
      #
      # On a publish_only call (#952) the build jobs ran in the caller's
      # publish: false call, so their job outputs arrive as the digests
      # input: the caller passes that call's digests output, which GitHub
      # composes from the same job outputs, and no step anywhere can write
      # either. Exactly one source per call: a publish_only call refuses a
      # digest from a build job of its own, any other call refuses the
      # input, and the input must name all five legs, each a sha256.
      - name: Verify sidecar artifacts
        env:
          SHA_LINUX_X64: ${{ needs.build-sidecar-linux-x64.outputs.sha256 }}
          SHA_LINUX_ARM64: ${{ needs.build-sidecar-linux-arm64.outputs.sha256 }}
          SHA_DARWIN_ARM64: ${{ needs.sign-sidecar-darwin.outputs.sha256_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ needs.sign-sidecar-darwin.outputs.sha256_darwin_x64 }}
          SHA_WIN32_X64: ${{ needs.sign-sidecar-windows.outputs.sha256 }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          DIGESTS: ${{ inputs.digests }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [ "${PUBLISH_ONLY:-}" = "true" ]; then
            if [ -n "${SHA_LINUX_X64}${SHA_LINUX_ARM64}${SHA_DARWIN_ARM64}${SHA_DARWIN_X64}${SHA_WIN32_X64}" ]; then
              echo "::error::a publish_only call takes its digests from the digests input, yet a build job of this call reported one"
              exit 1
            fi
            h='([0-9a-f]{64})'
            re="^linux-x64=${h} linux-arm64=${h} darwin-arm64=${h} darwin-x64=${h} win32-x64=${h}\$"
            if ! [[ "${DIGESTS:-}" =~ $re ]]; then
              printf '::error::the digests input is not one sha256 for each of the five legs: %q\n' "${DIGESTS:-}"
              exit 1
            fi
            SHA_LINUX_X64="${BASH_REMATCH[1]}"
            SHA_LINUX_ARM64="${BASH_REMATCH[2]}"
            SHA_DARWIN_ARM64="${BASH_REMATCH[3]}"
            SHA_DARWIN_X64="${BASH_REMATCH[4]}"
            SHA_WIN32_X64="${BASH_REMATCH[5]}"
          elif [ -n "${DIGESTS:-}" ]; then
            echo "::error::the digests input is for a publish_only call; this call built its own artifacts"
            exit 1
          fi
          manifest=""
          expect() {
            [[ "$1" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no digest was reported for $2"; exit 1; }
            manifest+="$1  $2"$'\n'
          }
          expect "$SHA_LINUX_X64" "sidecar-linux-x64/${SIDECAR_BIN}"
          expect "$SHA_LINUX_ARM64" "sidecar-linux-arm64/${SIDECAR_BIN}"
          expect "$SHA_DARWIN_ARM64" "sidecar-darwin-arm64/jarvis-app.tar.gz"
          expect "$SHA_DARWIN_X64" "sidecar-darwin-x64/jarvis-app.tar.gz"
          expect "$SHA_WIN32_X64" "sidecar-win32-x64/${SIDECAR_BIN}.exe"
          cd artifacts
          # Regular files only: a link would be hashed through to its target.
          if [ -n "$(find . -mindepth 1 -not -type d -not -type f -print -quit)" ]; then
            echo "::error::the downloaded sidecar artifacts contain something other than files and directories"
            exit 1
          fi
          want="$(printf '%s' "$manifest" | cut -d' ' -f3- | sort)"
          got="$(find . -mindepth 1 -not -type d | sed 's|^\./||' | sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::the downloaded sidecar artifacts are not exactly the five that were built"
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") || true
            exit 1
          fi
          printf '%s' "$manifest" | sha256sum --strict -c -

      # The digests of exactly what this job publishes, handed to the brain's
      # github-release job as a job output (#682). Artifacts are writable by
      # every job in the run -- release-exec.yml's pack-brain runs dependency
      # code while they sit in the store, and github-release downloads them
      # again later to attach them; job outputs only this job can set.
      - name: Record artifact digests
        id: sums
        run: |
          set -euo pipefail
          sums="$(cd artifacts && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | base64 -w0)"
          echo "sums=${sums}" >> "$GITHUB_OUTPUT"

      # VERSION reaches every script below through env:, never as ${{ }} in
      # the script text (#684), and was checked as a plain semver by the
      # first step of this job.
      - name: Prepare platform packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            pkg_dir="sidecar/npm/${platform}"
            mkdir -p "${pkg_dir}/bin"

            case "${platform}" in
              darwin-*)
                # The darwin artifact is a tarred Jarvis.app, signed and
                # notarized by sign-sidecar-darwin (a real run without the
                # Apple secrets fails unless ALLOW_UNSIGNED_MACOS is true,
                # #921), with ocr-helper sealed inside; the launcher prefers
                # bin/Jarvis.app/Contents/MacOS/jarvis.
                # tar preserves exec bits and the stapled notarization ticket.
                tar -xzf "artifacts/sidecar-${platform}/jarvis-app.tar.gz" -C "${pkg_dir}/bin/"
                ;;
              *)
                cp "artifacts/sidecar-${platform}/"* "${pkg_dir}/bin/"
                chmod +x "${pkg_dir}/bin/"*
                ;;
            esac

            # The artifact went in under bin/ alone (#1046): checked here,
            # where npm is about to run, not only at checkout.
            if [ "$(find "${pkg_dir}" -mindepth 1 -maxdepth 1 -printf '%y %f\n' | LC_ALL=C sort | tr '\n' ' ')" != "d bin f package.json " ]; then
              echo "::error::${pkg_dir} holds more than bin/ and package.json once its artifact is in, so npm could read config from it (#1046)"
              exit 1
            fi
            # ...and its package.json is still the one the checkout check
            # passed, field for field, where npm reads it.
            if ! jq -e --arg name "@usejarvis/sidecar-${platform}" 'type == "object" and (keys - ["cpu", "description", "files", "name", "os", "repository", "version"] == []) and .name == $name and .files == ["bin"]' "${pkg_dir}/package.json" >/dev/null; then
              echo "::error::${pkg_dir}/package.json is not the one the checkout check passed by the time npm runs there (#1046)"
              exit 1
            fi

            # Update version
            cd "${pkg_dir}"
            npm version "${VERSION}" --no-git-tag-version --allow-same-version --ignore-scripts --workspaces=false
            cd "$GITHUB_WORKSPACE"
          done

          # Update wrapper package version and dependency versions
          cd sidecar/npm/jarvis-sidecar
          npm version "${VERSION}" --no-git-tag-version --allow-same-version --ignore-scripts --workspaces=false

          # Update optionalDependencies versions
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            sed -i "s|\"@usejarvis/sidecar-${platform}\": \".*\"|\"@usejarvis/sidecar-${platform}\": \"${VERSION}\"|" package.json
          done
          # sed edits lines and assumes npm version left one key per line
          # (npm 12.1.0 does: it rewrote a value on a line of its own back
          # onto its key, measured), so the result is read back rather than
          # trusting that (security review of #1046).
          if ! jq -e --arg v "$VERSION" '[.optionalDependencies[]] | length == 5 and all(. == $v)' package.json >/dev/null; then
            echo "::error::the wrapper does not depend on all five platform packages at ${VERSION} after the rewrite (#1046)"
            exit 1
          fi

      # A version npm already has refuses the publish, dry or real. On a dry
      # run that refusal, and only that one, is a notice (#966): `resolve`
      # sends every dry run here, so without it every rehearsal after a
      # release failed until sidecar/VERSION moved, and a dry run is the only
      # rehearsal this workflow has. The text is what NPM_VERSION prints;
      # any other failure of a rehearsed publish still fails the run. npm's
      # output goes through tee so the log stays live and the refusal can
      # be read back; the publish's own status is PIPESTATUS[0].
      #
      # On a real run a package already on npm counts as published only if
      # npm serves exactly the files this job verified (#958): this job then
      # reports released and these artifacts' sums, and github-release
      # attaches them as the release. Another run of the same version (a
      # standalone dispatch beside a release, or a fresh run finishing a
      # partial publish) built other bytes: the sidecar is not reproducible
      # across runs (the Go binaries embed the commit, the macOS bundle and
      # the Windows binary carry signing timestamps), so the comparison is
      # with what npm serves, never with a rebuild. Re-running the failed
      # jobs of the run that published the version reuses its artifacts and
      # matches; re-running all jobs rebuilds, and does not. The tarball
      # is fetched from the registry, checked against dist.integrity, and
      # compared entry by entry (type, path, sha256) with ours. On a
      # dry run the comparison is only reported: a fresh build never matches,
      # and #966 says the rehearsal does not fail for a version npm has.
      #
      # The wrapper carries no artifact bytes and is published last, so the
      # race is caught here, before it.
      - name: Publish platform packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          if [[ "$VERSION" == *-* ]]; then flags+=(--tag next); fi
          err="$(mktemp)"

          # manifest <dir>: every entry of the package in <dir> but
          # directories, by type and path, then every file by sha256. Fails
          # without package.json and a file in bin/ (nothing compared is not
          # a match), or on a name with a character that is not printable
          # (it would reach the log raw).
          manifest() (
            set -o pipefail
            cd -P "$1" && [ -f package.json ] || exit 1
            [ -n "$(find bin -type f -print -quit 2>/dev/null)" ] || exit 1
            [ -z "$(LC_ALL=C find . -name '*[![:print:]]*' -print -quit)" ] || exit 1
            find . -mindepth 1 -not -type d -printf '%y %P\n' | LC_ALL=C sort || exit 1
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum || exit 1
          )
          # same_as_npm <pkg>, from its package directory: 0 when npm serves
          # exactly this package (package.json and bin/, which is all npm
          # packs of it and which it does not rewrite) for pkg@VERSION, 1
          # when it serves another, 2 when that could not be established.
          # npm installs a tarball by stripping its first path component and
          # dropping links, so it must hold one real directory, package, or
          # what GNU tar shows here is not what npm installs.
          same_as_npm() {
            local url integrity tmp got names types ours theirs
            url="$(npm view "${1}@${VERSION}" dist.tarball)" || return 2
            integrity="$(npm view "${1}@${VERSION}" dist.integrity)" || return 2
            [[ "$url" =~ ^https://registry\.npmjs\.org/[^[:space:]]+\.tgz$ ]] || return 2
            [[ "$integrity" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]] || return 2
            tmp="$(mktemp -d)" || return 2
            curl -fsSL --proto '=https' --retry 3 --max-time 300 --max-filesize 268435456 -o "${tmp}/npm.tgz" "$url" || return 2
            got="$(openssl dgst -sha512 -binary "${tmp}/npm.tgz" | base64 -w0)" || return 2
            [ "sha512-${got}" = "$integrity" ] || return 2
            # The listing first, as npm reads it: every member under
            # package/ (no ./, no other root), and only files and
            # directories, since npm drops links and GNU tar would follow a
            # hard link to a member sent again later.
            names="$(tar --quoting-style=escape -tzf "${tmp}/npm.tgz")" || return 2
            types="$(tar --quoting-style=escape -tvzf "${tmp}/npm.tgz" | cut -c1)" || return 2
            if grep -qv '^package/' <<<"$names"; then return 1; fi
            if grep -qv '^[-d]$' <<<"$types"; then return 1; fi
            mkdir "${tmp}/x" && tar -xzf "${tmp}/npm.tgz" -C "${tmp}/x" --no-same-owner --no-same-permissions || return 2
            [ "$(find "${tmp}/x" -mindepth 1 -maxdepth 1 -printf '%P %y\n')" = "package d" ] || return 1
            ours="$(manifest .)" || return 2
            theirs="$(manifest "${tmp}/x/package")" || return 1
            if [ "$ours" != "$theirs" ]; then
              diff <(printf '%s\n' "$ours") <(printf '%s\n' "$theirs") || true
              return 1
            fi
          }

          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            pkg="@usejarvis/sidecar-${platform}"
            echo "Publishing ${pkg}@${VERSION}... ${flags[*]}"
            cd "sidecar/npm/${platform}"
            npm publish --access public --ignore-scripts "${flags[@]}" 2>&1 | tee "$err"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              if ! npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
                exit 1
              elif [ "$DRY_RUN" != "true" ]; then
                same=0
                same_as_npm "$pkg" || same=$?
                if [ "$same" -eq 0 ]; then
                  echo "${pkg}@${VERSION} is already on npm with exactly the files this run verified; treating as success."
                elif [ "$same" -eq 1 ]; then
                  echo "::error::${pkg}@${VERSION} is already on npm with files other than the ones this run built and verified, so this run cannot report them as released (#958). Another run, or an earlier attempt of this one, published this version: to finish a partial publish, re-run the failed jobs (not all jobs) of the run that started it; otherwise bump sidecar/VERSION."
                  exit 1
                else
                  echo "::error::${pkg}@${VERSION} is already on npm, and whether it holds the files this run verified could not be established (#958); re-run this job."
                  exit 1
                fi
              elif grep -qF "You cannot publish over the previously published versions" "$err"; then
                echo "::notice::${pkg}@${VERSION} is already on npm, so this dry run cannot rehearse publishing it; packing it was rehearsed."
                same=0
                same_as_npm "$pkg" || same=$?
                if [ "$same" -eq 0 ]; then
                  echo "::notice::${pkg}@${VERSION} on npm is byte for byte this build, so a real run would take it as published."
                elif [ "$same" -eq 1 ]; then
                  echo "::notice::${pkg}@${VERSION} on npm is not byte for byte this build, so a real run finding it there would stop (#958). Expected when another run built it: the sidecar is not reproducible across runs."
                else
                  echo "::warning::could not establish whether ${pkg}@${VERSION} on npm is this build; a real run would stop here (#958)."
                fi
              else
                exit 1
              fi
            fi
            cd "$GITHUB_WORKSPACE"
          done

      - name: Publish wrapper package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          if [[ "$VERSION" == *-* ]]; then flags+=(--tag next); fi
          pkg="@usejarvis/sidecar"

          err="$(mktemp)"

          # As for the platform packages (#966).
          cd sidecar/npm/jarvis-sidecar
          npm publish --access public --ignore-scripts "${flags[@]}" 2>&1 | tee "$err"
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            if ! npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              exit 1
            elif [ "$DRY_RUN" != "true" ]; then
              echo "${pkg}@${VERSION} is already on npm; treating as success."
            elif grep -qF "You cannot publish over the previously published versions" "$err"; then
              echo "::notice::${pkg}@${VERSION} is already on npm, so this dry run cannot rehearse publishing it; packing it was rehearsed."
            else
              exit 1
            fi
          fi
