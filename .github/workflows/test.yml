name: Tests
on:
  # `push` is main-only on purpose. With `branches: ["**"]` every push to a PR
  # branch triggered this workflow TWICE — once for the push, once for the
  # pull_request — running the whole matrix (incl. the 10x-billed macOS jobs)
  # for the same commit and doubling exposure to any install-time flake.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref: a follow-up push cancels the superseded run
# instead of queueing behind it. Never cancel main — a cancelled post-merge
# run leaves the branch with no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.25"

jobs:
  # ─── Which areas did this push/PR touch? ───────────────────────
  # The Go jobs below are expensive (GTK + mingw apt install; a macOS runner
  # billed at 10x) and only guard sidecar code, so they run only when the
  # sidecar tree actually changed. Gating is per JOB, not via a workflow-level
  # `paths:` filter — a path-filtered workflow never reports its checks, which
  # leaves required status checks pending forever on unrelated PRs.
  #
  # The filter is `sidecar/**`, not `sidecar/installer/**`: the installer
  # imports sidecar/internal/* (brand, webviewui, autostart, webview2), so a
  # change anywhere in the sidecar tree can break its build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      sidecar: ${{ steps.filter.outputs.sidecar }}
      daemon-cli: ${{ steps.filter.outputs.daemon-cli }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sidecar:
              - 'sidecar/**'
              - '.github/workflows/test.yml'
              # The release workflows call sidecar/scripts/sign-windows.sh —
              # a change to how they invoke it must re-run its tests.
              - '.github/workflows/sidecar-release.yml'
              - '.github/workflows/installer-release.yml'
            # The daemon lifecycle (lock acquire/release, autostart service
            # definitions) is the one TypeScript area with behaviour that only
            # exists on macOS: the launchd agent is installed with KeepAlive, so
            # stopping the daemon gets it relaunched. That path is unreachable
            # from the ubuntu job — see daemon-control.launchd.test.ts.
            daemon-cli:
              - 'src/cli/**'
              - 'src/daemon/pid.ts'
              - 'bin/**'
              - '.github/workflows/test.yml'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: with --frozen-lockfile below, a Bun release
          # that migrates the lockfile format would fail every PR ("lockfile had
          # changes, but lockfile is frozen") with no repo change to blame.
          # Bump deliberately, alongside a regenerated bun.lock.
          bun-version: "1.3.14"
      # setup-bun does not cache the install cache, only the toolchain. Without
      # this every run re-downloads the whole tree from npm.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      # --frozen-lockfile: a package.json edit that never made it into bun.lock
      # fails here instead of silently resolving something the lockfile has
      # never seen.
      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-no-ee-imports.ts
      - run: bun run scripts/check-migrations.ts
      - run: bun test
      - run: bunx tsc --noEmit

  # ─── Daemon lifecycle on macOS (launchd) ───────────────────────
  # The ubuntu `test` job runs the same files, but every launchd assertion in
  # them skips there. The macOS-only behaviour is real and has already produced
  # one bug: the plist installs with KeepAlive=true, so `jarvis uninstall`
  # stopping the daemon BEFORE unloading the agent deadlocked — launchd kept
  # relaunching it and the unload never ran.
  #
  # Scoped to the daemon/CLI tests rather than the whole suite: macOS minutes
  # bill at 10x and the rest is already covered on ubuntu.
  daemon-cli-darwin:
    needs: changes
    if: needs.changes.outputs.daemon-cli == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Scoped to the lifecycle + service-definition files, not all of src/cli.
      # This job exists for the macOS-only behaviour (launchd KeepAlive
      # relaunch, plist generation); the rest of src/cli is already covered on
      # ubuntu and would only add 10x-billed minutes.
      #
      # (A wider `bun test src/cli/` run used to fail backup.test.ts here with
      # SQLITE_CANTOPEN. That turned out to be the test, not `jarvis restore` —
      # it opened a WAL database readonly with no -shm, which macOS refuses;
      # fixed in that file. The scope stays narrow for the billing reason above,
      # not because anything is known-broken.)
      - name: Daemon lifecycle tests (launchd paths active)
        run: |
          bun test \
            src/cli/daemon-control.test.ts \
            src/cli/daemon-control.launchd.test.ts \
            src/cli/daemon-control.systemd.test.ts \
            src/cli/autostart.test.ts \
            src/daemon/pid.test.ts

  # ─── Sidecar compile + test gate (cgo) ─────────────────────────
  # The sidecar is a cgo program (webview_go + GTK overlays). The local
  # pre-commit hook does NOT run Go, so this is the only automated guard that
  # the sidecar still builds. Linux native + Windows mingw cross-build cover the
  # two toolchains verifiable on a Linux runner; darwin compiles in its own
  # macos job below (previously it first compiled inside the RELEASE workflow,
  # so an ObjC error failed a release instead of the PR).
  sidecar-build:
    needs: changes
    if: needs.changes.outputs.sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Single source of truth for the toolchain — tracks sidecar/go.mod so
          # the build gate can't drift from the declared Go version (GO_VERSION
          # env is now unused; left in place to avoid touching unrelated jobs).
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - name: Install Linux UI libraries + mingw
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config build-essential \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          for d in /usr/lib/*/pkgconfig; do
            [ -f "$d/webkit2gtk-4.1.pc" ] && sudo ln -sf "$d/webkit2gtk-4.1.pc" "$d/webkit2gtk-4.0.pc" || true
            [ -f "$d/javascriptcoregtk-4.1.pc" ] && sudo ln -sf "$d/javascriptcoregtk-4.1.pc" "$d/javascriptcoregtk-4.0.pc" || true
          done

      # The Windows signing path is shell, and shell is where signing bugs
      # live (credential resolution, temp-file cleanup, fail-fast). A stub
      # `java` exercises all of it with no GCP project and no certificate.
      - name: Test the Windows signing script
        working-directory: sidecar
        run: scripts/sign-windows.test.sh

      - name: Build + vet + test (linux/amd64, cgo)
        working-directory: sidecar
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go vet ./...
          go build ./...
          go test ./...

      - name: Cross-build (windows/amd64, mingw)
        working-directory: sidecar
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$(pwd)/include" CGO_CXXFLAGS="-I$(pwd)/include"
          go build -o /tmp/jarvis-sidecar.exe .
          # The installer's wizard is webview-backed (cgo, same toolchain as
          # the sidecar) — cross-build it too so it can't rot unchecked.
          go build -o /tmp/jarvis-setup.exe ./installer/

  # The windows-tagged tests (pebble draw-bounds crop invariant) are pure Go
  # but can only RUN on a Windows runner — the mingw cross-build above only
  # proves the package compiles. `go test` also compiles every _test.go under
  # GOOS=windows, which the cross-build (build-only) never checks. Scoped to
  # the draw-bounds test to keep runtime bounded; the full logic suite is
  # covered on linux.
  sidecar-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Run windows-tagged pebble tests (amd64, cgo)
        working-directory: sidecar
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$(pwd)/include" CGO_CXXFLAGS="-I$(pwd)/include"
          go test -run '^TestMainPebbleDrawStaysInsideCrop$' -v .

  # Compile gate for the darwin cgo files (deeplink_darwin.go, the *_darwin
  # bridges): build tags hide them from the linux job, so without this their
  # first compile happens on a release runner. Build + vet only — the UI
  # can't run on a headless runner and the logic tests are covered on linux.
  sidecar-build-darwin:
    needs: changes
    # macOS minutes bill at 10x — skip on docs/TypeScript-only changes.
    if: needs.changes.outputs.sidecar == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Build + vet (darwin, cgo)
        working-directory: sidecar
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # vet first, on the host arch: unlike `go build` it also type-checks
          # the darwin _test.go files and runs the analyzers.
          go vet ./...
          # Both architectures, at the SAME deployment target the release uses.
          # That target is what makes APIs newer SDKs mark obsoleted fail here
          # rather than during a release (e.g. CGWindowListCreateImage, gone in
          # the macOS 15 SDK) — a host-arch build at the default target misses
          # both that and any amd64-only compile error.
          for arch in arm64 amd64; do
            case "$arch" in
              arm64) target=arm64-apple-macos11 ;;
              amd64) target=x86_64-apple-macos11 ;;
            esac
            echo "== darwin/$arch =="
            CC="clang -target $target" CXX="clang++ -target $target" \
              GOOS=darwin GOARCH="$arch" go build ./...
          done

  # The desktop-automation fallback scripts can't be exercised from the linux
  # job: bun test's pwsh check covers desktop.ps1, but AppleScript terminology
  # bugs (dictionary terms shadowing variables) only surface on a real macOS
  # interpreter at runtime — osacompile alone won't catch them, hence the
  # event-free `probe` command.
  applescript-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile + probe desktop.applescript
        run: |
          set -euo pipefail
          SCRIPT=src/actions/app-control/scripts/desktop.applescript
          osacompile -o /tmp/desktop-syntax-check.scpt "$SCRIPT"
          OUT=$(osascript "$SCRIPT" probe)
          echo "probe: $OUT"
          test "$OUT" = "mods=2;code=36"
          # Unknown commands must fail loudly (stderr + non-zero exit)
          if osascript "$SCRIPT" no-such-command 2>/dev/null; then
            echo "expected non-zero exit for unknown command" >&2
            exit 1
          fi

  # NOTE: the sidecar VERSION-bump PR gate is intentionally OFF during the
  # current development phase — the sidecar is frozen at sidecar/VERSION = 0.1.0
  # and ships as a single version, so per-change bumps aren't wanted. Reinstate a
  # "shipping sidecar change must bump sidecar/VERSION" job here when independent
  # per-change versioning resumes (design in docs/PEBBLE_REVIEW... §7.4.C).

  # Validates that the Vision OCR helper compiles, and publishes the universal
  # Mach-O as an artifact so operators can grab it without cutting a release
  # tag. (The sidecar's darwin cgo is covered by sidecar-build-darwin above.)
  # Can also be built on demand via the Actions "Run workflow" button.
  ocr-helper:
    needs: changes
    # macOS minutes bill at 10x — never spend them on a docs or TypeScript
    # change. workflow_dispatch always runs it (that's the "build me one"
    # button this job also exists for).
    if: needs.changes.outputs.sidecar == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build universal ocr-helper
        working-directory: sidecar
        run: |
          set -euo pipefail
          swiftc -O -target arm64-apple-macos11  -o /tmp/ocr-helper-arm64 helpers/ocr-helper.swift
          swiftc -O -target x86_64-apple-macos11 -o /tmp/ocr-helper-amd64 helpers/ocr-helper.swift
          mkdir -p helpers
          lipo -create -output helpers/ocr-helper /tmp/ocr-helper-arm64 /tmp/ocr-helper-amd64
          file helpers/ocr-helper
          lipo -info helpers/ocr-helper

      - name: Upload helper binary
        uses: actions/upload-artifact@v5
        with:
          name: ocr-helper-darwin
          path: sidecar/helpers/ocr-helper
