name: Release Executor

# Builds and publishes a release for an existing version tag: npm packages,
# Docker image, GitHub Release, Discord notification. Normally dispatched by
# the Release workflow (release.yml), which bumps package.json and creates the
# tag first. Pushing a v* tag by hand also triggers it, as an escape hatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and validate everything without publishing"
        type: boolean
        default: true
      tag:
        description: "Version tag to simulate (e.g. v0.1.0-test.1)"
        required: true
        default: "v0.0.0-dry-run"

# Nothing by default (#646). The workflow-level block used to be
# contents: write + packages: write, which every job without its own block
# inherited -- including `test`, which runs `bun install` (dependency
# lifecycle scripts) and the whole suite with a token that could push to the
# repository and the registry. Every job now asks for exactly what it uses,
# and a job added later starts with no token instead of a write one.
permissions: {}

# One release at a time (#645). Two tag pushes, or a push racing a dispatch,
# used to run side by side: both reached publish-docker, both pushed
# `:latest` for a non-prerelease, and whichever finished second owned it --
# not necessarily the higher version. Both also wrote `cache-to: type=gha`
# into the same scope (nothing here uses that cache since #680).
#
# Global, not per ref: `:latest` is one pointer for the whole repository, so
# a group keyed on the tag would let exactly the two runs that matter race.
# release.yml uses its own group (`release`), so its dispatch of this workflow
# cannot deadlock against itself.
#
# cancel-in-progress: false, because cancelling a half-finished publish (npm
# out, Docker not) is worse than waiting.
#
# queue: max, because the default queue (`single`) holds ONE pending run and
# cancels it when another is queued: a third release arriving while one runs
# and one waits would silently drop the waiting one. (release.yml now waits
# for the run it dispatches (#683) and would go red, but a hand-pushed tag
# has no such watcher.) `max` keeps up to 100 pending runs and starts
# them in order (GitHub docs, workflow-level `concurrency.queue`; changelog
# 2026-05-07). It is rejected only together with cancel-in-progress: true.
#
# Dry runs share the group. They publish nothing, but they do build and smoke
# the image (and push it to a registry on their own runner), so a rehearsal
# can delay a real release by one gate's length -- never cancel it, which
# under `single` it could have.
#
# actionlint 1.7.x predates the `queue` key and reports it as unexpected; that
# is the linter, not this file.
concurrency:
  group: release-exec
  cancel-in-progress: false
  queue: max

env:
  # Pinned to match test.yml: the jobs below install with --frozen-lockfile,
  # and a floating Bun that migrates the lockfile format would fail a RELEASE.
  BUN_VERSION: "1.4.2"
  # Everything below is code a SHA-pinned action or a `run:` step downloads
  # and executes AFTER the pin has done its job, so it is pinned too (#681).
  # None of it is something Dependabot can see: bump by hand, and keep the
  # same values in sidecar-release.yml (NPM_VERSION) and in both jobs here
  # (they read these, so they cannot drift apart).
  #
  # npm Trusted Publishing needs npm >= 11.5.1 and Node 22 bundles npm 10, so
  # the publish jobs install npm -- formerly `npm@latest`, i.e. whatever the
  # registry's dist-tag pointed at, into a job holding id-token: write.
  # 12.1.0 is what the last two releases ran (v0.14.0 on 2026-09-22 and
  # v0.15.0 on 2026-09-30 both installed `latest` after 12.1.0 was published
  # and before 12.2.0 was); npm versions are immutable once published.
  NPM_VERSION: "12.1.0"
  # The QEMU binfmt image runs --privileged on the runner and its emulators
  # execute every arm64 build step. Was the action's default
  # `docker.io/tonistiigi/binfmt:latest`. qemu-v10.2.3 is the image `latest`
  # pointed at for v0.15.0 (same digest in that run's log).
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  # The BuildKit daemon that produces the published layers. Was the action's
  # default `moby/buildkit:buildx-stable-1`, which v0.33.1 is as of 2026-10-06.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  # The SBOM generator BuildKit runs during build-image (#680), with the
  # image filesystem mounted (beside a packages: write token until #868). Its default
  # is the tag docker/buildkit-syft-scanner:stable-1; stable-1 and 1.12.0
  # were the same index digest on 2026-10-08 (docker buildx imagetools
  # inspect), so pinning changes nothing that runs today.
  SBOM_GENERATOR: docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
  # The throwaway registry smoke-image rehearses the push against (#868), on
  # loopback only. registry:3.1.2, which `3`, `3.1` and `latest` all
  # resolved to on 2026-10-09 (docker buildx imagetools inspect).
  REHEARSAL_REGISTRY_IMAGE: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
  SIDECAR_BIN: jarvis
  # The one dry-run decision (#685), spelled the same everywhere it has to be
  # made: here, the sidecar call input, discord-notify's `if:` and
  # publish-brain's environment name. Those three cannot read this env (a
  # job-level `if:`, a reusable-workflow `with:` and `environment.name` do not
  # get the `env` context), so they repeat `inputs.dry_run == true` instead.
  # On a tag push there are no inputs and it is false. Every step reads
  # DRY_RUN, only ever compared with 'true'. release-exec.test.sh evaluates
  # all four under a push, a real dispatch and a dry dispatch and fails unless
  # they agree: a half-dry release could announce a version it never
  # published, or publish one it never announced.
  DRY_RUN: ${{ inputs.dry_run == true }}
  # There is deliberately no RELEASE_TAG here (#644). The raw tag --
  # `inputs.tag || github.ref_name` -- is read through an expression in exactly
  # one place, the validate-tag job below, and every other job takes the
  # checked value from its outputs. A workflow-level env would hand the
  # unchecked string to every job and invite the next `${{ env.RELEASE_TAG }}`
  # inside a `run:`. (The runner still puts $GITHUB_REF_NAME in every job's
  # environment; no step outside validate-tag may read it, and the test below
  # enforces that too.)

jobs:
  # ─── Gate: the tag must be v<semver> before anything reads it ──
  # #644. The release tag is attacker-shaped input on both manual paths: a
  # hand-pushed tag (git accepts `v1.0.0";id;"` and `v1.0.0$(id)` as ref
  # names) and the free-form workflow_dispatch input, which can also carry a
  # newline. It used to reach `run:` scripts through `${{ }}`, which GitHub
  # substitutes into the script text BEFORE bash parses it -- in publish-brain,
  # a job holding `id-token: write` for npm Trusted Publishing. A newline could
  # also write extra KEY=value lines into $GITHUB_OUTPUT.
  #
  # The control is here, once, at the source:
  #   - the only job that reads the raw tag through an expression, with no
  #     token scopes at all (`permissions: {}`) and no checkout, so the step
  #     below is the whole of what runs with the raw value in reach;
  #   - the raw value arrives through `env:` and is only ever a quoted "$RAW_TAG"
  #     operand, never script text;
  #   - an anchored match on the whole string. bash's =~ is POSIX ERE without
  #     REG_NEWLINE, so `$` is end-of-string and a newline-bearing value cannot
  #     match line-by-line. LC_ALL=C first: under a UTF-8 locale such as
  #     en_US.UTF-8, glibc's [A-Za-z] and [0-9] also match letters and digits
  #     outside ASCII (measured: `v1.2.3-é` and an Arabic-Indic major version
  #     both matched), and the alphabet claim below would not hold;
  #   - nothing is written to $GITHUB_OUTPUT until the value has matched, and
  #     what matched cannot contain a newline, quote, `$`, backtick, `;` or
  #     space -- the alphabet is ASCII [0-9A-Za-z.-] after the leading `v`.
  #
  # Every other job takes `needs.validate-tag.outputs.*`, and a `run:` that
  # needs one consumes it through `env:` as a quoted "$VAR", never `${{ }}`.
  # .github/scripts/release-exec.test.sh executes this step's script verbatim
  # against hostile tags and checks that structure, so neither can drift.
  #
  # The Dockerfile's semver check (#625) also rejects metacharacters, and used
  # to be the only thing standing in the way. It is not the control: it sits in
  # a different job three files from the sink and holds only while the image
  # build gates the publish jobs. It may not even hold today. A newline in the
  # dispatch input could make the extracted VERSION multi-line via
  # $GITHUB_OUTPUT's `NAME<<DELIM` syntax; build-push-action splits
  # `build-args:` on newlines, so a clean first line would reach the Dockerfile
  # as VERSION and the rest as a second, ignored build-arg (buildx accepts one
  # named `";id;"` and builds green -- checked locally), while publish-brain
  # substituted the whole value into its script. That chain is reasoned from
  # the documented behaviour of both, not run on GitHub.
  #
  # What counts as valid, and why it is stricter than "looks like semver":
  #   - The leading `v` is required. Every path that reaches this workflow
  #     names a v-tag (release.yml dispatches `v${NEW}`, the push trigger is
  #     `v*`), and the tag is used verbatim as github-release's `tag_name`: a
  #     bare `1.2.3` would name a tag that does not exist, which
  #     action-gh-release creates rather than rejects.
  #   - Pre-release identifiers follow SemVer 2.0 one by one: no empty
  #     identifier, no leading zero on a numeric one. A looser pattern let
  #     `v1.2.3-01` and `v1.2.3-rc..1` through, which `npm version` then refused
  #     -- after the sidecar had already published.
  #   - No build metadata. npm drops it: `1.2.3+x` IS `1.2.3` to node-semver
  #     (checked), so `npm publish` of `v1.2.3+x` would collide with 1.2.3,
  #     publish-brain's "already on npm; treating as success" branch would take
  #     it, and publish-docker would move `:latest` to a build no npm release
  #     matches. release.yml never produces build metadata.
  #   - On a real (non-dry) run the tag must be the ref being built: a tag push,
  #     or a dispatch made `--ref <the same tag>` (release.yml does exactly
  #     that). Otherwise `tag` is free text, and a dispatch from any branch with
  #     tag=v9.9.9 would publish that branch as 9.9.9 and have
  #     action-gh-release create the tag on the default branch. A dry run may
  #     rehearse any ref, since it publishes nothing.
  #   - Sizes every publisher accepts: each of major.minor.patch at most 16
  #     digits (node-semver's MAX_SAFE_COMPONENT_LENGTH) and the version at
  #     most 128 characters -- Docker's tag limit, which publish-docker hits
  #     with the bare `{{version}}` tag AFTER npm has published, and the
  #     tighter of it and npm's 256. An oversized tag fails here instead of
  #     half-publishing. (node-semver also refuses a 16-digit component above
  #     2^53-1; that sliver still fails late.)
  #
  # What this gate is and is not. It stops malformed and hostile tag TEXT, and
  # a release of one ref under another ref's version. It is not a control
  # against anyone who can create tags or run workflows: nothing in this
  # repository restricts who creates a `v*` tag or what it points at (no tag
  # ruleset), and a writer can dispatch a modified copy of this file from
  # their own branch. What stands between that and an npm publish is the
  # `release` environment's required reviewers on publish-brain and
  # publish-sidecar (#679, #756), not this gate. Nothing equivalent gates
  # GHCR directly: publish-docker, the only job that can write to it at all
  # since #868, waits for publish-brain by the `needs:` order in this file.
  validate-tag:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Validate the release tag
        id: validate
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          num='(0|[1-9][0-9]{0,15})'
          re="^v(${num}[.]${num}[.]${num}(-${id}([.]${id})*)?)\$"
          if [ "${#RAW_TAG}" -gt 129 ] || ! [[ "$RAW_TAG" =~ $re ]]; then
            # %q, so a newline in the value cannot start a workflow command of
            # its own in the log.
            printf '::error::Release tag is not v<semver> without build metadata (e.g. v1.2.3, v1.2.3-rc.1): %q\n' "$RAW_TAG"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          # Group 5 is the whole `-pre.release` part, if any.
          if [ -n "${BASH_REMATCH[5]}" ]; then prerelease=true; else prerelease=false; fi
          if [ "$DRY_RUN" != "true" ] && { [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "$RAW_TAG" ]; }; then
            printf '::error::A real release must build the tag it publishes: tag input %q, but this run is on %s %q. Dispatch with --ref %q, or set dry_run.\n' \
              "$RAW_TAG" "$REF_TYPE" "$REF_NAME" "$RAW_TAG"
            exit 1
          fi
          {
            echo "tag=v${version}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag v${version} (pre-release: ${prerelease})"

  # ─── Gate: run tests before anything else ───────────────────────
  test:
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The Actions cache is writable by any run on main; see #681.
          no-cache: true
          bun-version: ${{ env.BUN_VERSION }}
      # --frozen-lockfile: the release must build from exactly the versions the
      # lockfile records — the PR gate enforces this, and the shipping path is
      # where it matters most.
      - run: bun install --frozen-lockfile
      # `--retry=2`, matching test.yml (which has had it since #501's Chromium
      # flake class was identified). This gate has run bare `bun test` since
      # #230, which made it STRICTER than the PR gate on exactly the tests
      # known to flake -- so a release could fail on something no PR would.
      #
      # The 2026-10-07 dry run (#774's validation) failed here on three of
      # them: `launchChrome on this host (real headless Chromium)` twice and
      # the webapp-template browser integration test, 7994 pass / 3 fail. And
      # because this gate is first, every publish job downstream skipped -- so
      # a flake here does not just delay a release, it hides whether the rest
      # of the path works.
      #
      # --retry is per TEST, not a step-level retry: a flaky test gets three
      # attempts while a deterministic failure still fails all three, and
      # retried tests print as "(attempt N)" so a flake stays visible rather
      # than silent.
      - run: bun test --retry=2
      - run: bunx tsc --noEmit

  # --- Build the release image ONCE, into an OCI archive (#680, #868) ---
  # The image that ships is built here and nowhere else. Before #680 a
  # release built it three times: build-docker built multi-arch to validate,
  # built amd64 again to smoke-test, and publish-docker built a third time
  # and pushed THAT. Nothing tied the bytes docker-smoke.sh started to the
  # bytes users pull, and once #782 made publish-docker build cold while the
  # gate built from the cache, they were always two independent builds
  # (#822). Now: this job builds one multi-arch index into an OCI archive;
  # smoke-image runs that archive's amd64 image and rehearses the push of the
  # archive against a throwaway registry; publish-docker, after the approval
  # chain, pushes that same archive to GHCR by digest and points the release
  # tags at it. One build, one set of bytes, from here to the registry.
  #
  # Authority (#868). This job holds contents: read and NO registry scope,
  # and it does not log in to anything. It runs BuildKit (privileged under
  # this driver, so root on the runner), QEMU, the dependency lifecycle
  # scripts, the Dockerfile's apt packages (NOT pinned) and the SBOM
  # scanner, all before any approval -- and from #680 until #868 it did so
  # beside a packages: write token, so a sandbox escape here could have moved
  # :latest unapproved, and every real run left a publicly pullable,
  # version-labelled untagged index on the public package whether or not it
  # was ever approved. Now nothing that runs before the `release`
  # environment approval on publish-brain can write to a registry:
  # publish-docker is the only job holding packages: write
  # (release-exec.test.sh checks that, and the needs order behind it).
  #
  # What crosses: the archive, as an artifact, which every job in this run
  # can write; its sha256, as a job output, which only this job can set; and
  # the index digest BuildKit reported, also an output. Both consumers check
  # the archive against the sha256 before reading it, and the registry and
  # skopeo then refuse anything at that digest that does not hash to it.
  #
  # The rehearsal is this same job, step for step (#868): a dry run builds the
  # archive a release builds, by the same path, which retires the dry-run
  # twin build #680 needed and the drift guard that held the two together.
  #
  # Built cold, with no cache-from or cache-to (#782): this is the build
  # that ships, and the GHA cache is writable by any run on main and by
  # every job in this run. Measured cost before #680, for the same cold
  # two-platform build in publish-docker: 1m55s against 52s warm (runs
  # 37613557506 and 37610958257).
  #
  # Cost of the archive (#868), measured on the 2026-10-08 dry run
  # 37788481655: 434,377,884 bytes, uploaded in 6s and downloaded in 5s. It
  # is stored once and downloaded twice on a real run (smoke-image and
  # publish-docker), where #680 pushed it straight to GHCR from here.
  build-image:
    needs: [validate-tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One cold two-platform build (arm64 under QEMU) plus an SBOM scan per
    # platform; about 2 minutes measured for the build alone. Generous on
    # purpose: a too-tight bound turns a slow release into a failed one.
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      # persist-credentials: false: nothing after the checkout runs git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned images: see BINFMT_IMAGE and BUILDKIT_IMAGE at the top.
      # cache-image: false, because with it on the action `docker load`s the
      # privileged binfmt image from the Actions cache -- which any workflow
      # run on main can write -- before every pull, and runs that copy if the
      # pull fails. A loaded tar can also bring tags of its own into dockerd.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # The labels go into the image config, so they are set here, at the
      # one build. The tags are computed here too and handed on, and every
      # job that applies them checks them against validate-tag first;
      # nothing in this job applies a tag.
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate-tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate-tag.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.validate-tag.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Jarvis
            org.opencontainers.image.description=J.A.R.V.I.S. — Always-on autonomous AI daemon
            org.opencontainers.image.vendor=vierisid
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}

      # Into an OCI archive on this runner, on every run. The step output
      # `digest` is the index digest, the blob of that name in the archive.
      # Provenance (mode=max) and the SBOM are attestation manifests inside
      # that index, so the tags publish-docker creates carry them with no
      # extra step.
      - name: Build the image into an OCI archive
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.validate-tag.outputs.version }}
          provenance: mode=max
          sbom: generator=${{ env.SBOM_GENERATOR }}
          outputs: type=oci,dest=${{ runner.temp }}/release-image.oci.tar

      # The archive crosses to smoke-image and publish-docker as an artifact,
      # which every job in this run can write; its digest crosses as a job
      # output, which only this job can set.
      - name: Digest the archive
        id: archive
        run: |
          set -euo pipefail
          sum="$(sha256sum "${RUNNER_TEMP}/release-image.oci.tar" | cut -d' ' -f1)"
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"
          echo "release-image.oci.tar sha256 ${sum}"

      # Kept on a real run for as long as publish-docker can still need it:
      # it reads the archive after the approvals, which a person gives (a
      # deployment review times out after 30 days), and a failed
      # publish-docker can be re-run up to 30 days after the run started, so
      # 35 days covers both with margin. upload-artifact lowers this, with a
      # warning, if the repository retention setting is lower. A dry run
      # reads it only in smoke-image.
      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-oci
          path: ${{ runner.temp }}/release-image.oci.tar
          if-no-files-found: error
          retention-days: ${{ env.DRY_RUN == 'true' && 1 || 35 }}
          # Image layers are gzip already; zipping them again costs time.
          compression-level: 0

  # --- Gate: RUN the image that will ship, and rehearse its push ---
  # The run half is #621: a successful build was all the release gate used to
  # prove, which is why #613 and #614 both shipped -- both built cleanly and
  # failed only at runtime, and both were found by an outside reporter. See
  # .github/scripts/docker-smoke.sh for what it asserts. Since #680 it runs
  # the image build-image built, and since #868 on every run from the
  # archive publish-docker pushes, so what passes here is what ships.
  #
  # And the push half (#868): the archive is pushed by digest to a
  # throwaway registry on this runner and tagged there, by the very script
  # publish-docker runs against GHCR (a YAML alias of it, so the two cannot
  # drift). On every run, dry or real, so a push path that cannot work fails
  # here, before the approvals and before npm publishes, and not in
  # publish-docker after them.
  #
  # No registry scope at all: this job EXECUTES the image, so a container
  # escape here must not land in a job whose runner holds a publish-capable
  # token. It logs in to nothing.
  smoke-image:
    needs: [validate-tag, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # An archive load, three smoke phases and a local push. docker-build.yml
    # allows 30 for a build plus the same smoke check.
    timeout-minutes: 45
    env:
      # Run-scoped, matching docker-build.yml, and removed by name at the end.
      GATE_IMAGE_TAG: jarvis:release-gate-${{ github.run_id }}-${{ github.run_attempt }}
      REHEARSAL_CONTAINER: jarvis-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # For docker-smoke.sh. Nothing after the checkout runs git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image-oci
          path: ${{ runner.temp }}/release-image

      # The amd64 image of the index build-image reported, checked by content
      # from the archive digest down to the config, then loaded. This job
      # runs on the runner's own architecture, so this is the amd64 image
      # ONLY. arm64 is built by build-image and never started. Starting it IS
      # possible -- QEMU would run it -- and is declined: it is very slow, and
      # a QEMU-emulated boot is not what an arm64 user executes, so a pass
      # there would prove less than it appears to. An arm64-only runtime
      # defect is a gap this gate does not close, deliberately.
      #
      # `docker load` on the runner (Docker 28, classic image store) cannot
      # read a multi-platform OCI archive -- it fails with "blobs/json: no
      # such file or directory", measured on 28.0.4, the runner version -- so
      # this writes the docker-archive manifest.json for the one amd64 image
      # over the same blobs.
      - name: Load the image from its archive
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}
          ARCHIVE_SHA256: ${{ needs.build-image.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build-image reported no image digest"; exit 1; }
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build-image reported no archive digest"; exit 1; }
          dir="${RUNNER_TEMP}/release-image"
          echo "${ARCHIVE_SHA256}  ${dir}/release-image.oci.tar" | sha256sum -c -
          # The entry allowlist the push script also applies, here before
          # this job unpacks the archive itself (#868 review). Files, not
          # pipes, for the reason given there.
          tar -tvf "${dir}/release-image.oci.tar" | cut -c1 >"${dir}/types"
          tar -tf "${dir}/release-image.oci.tar" >"${dir}/names"
          if grep -qv '^[-d]$' "${dir}/types" ||
            grep -qvE '^(oci-layout|index\.json|blobs/|blobs/sha256/|blobs/sha256/[0-9a-f]{64})$' "${dir}/names"; then
            echo "::error::the archive holds entries an OCI layout does not have; refusing to unpack it"
            exit 1
          fi
          mkdir "${dir}/layout"
          tar -xf "${dir}/release-image.oci.tar" -C "${dir}/layout"
          blob() { printf '%s/layout/blobs/sha256/%s' "$dir" "${1#sha256:}"; }
          # By content, from the index build-image reported down: whatever
          # index.json says is not trusted.
          echo "${DIGEST#sha256:}  $(blob "$DIGEST")" | sha256sum -c -
          manifest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("not exactly one linux/amd64 image") end' "$(blob "$DIGEST")")"
          [[ "$manifest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the amd64 entry has no digest"; exit 1; }
          echo "${manifest#sha256:}  $(blob "$manifest")" | sha256sum -c -
          config="$(jq -er '.config.digest' "$(blob "$manifest")")"
          # These become tar paths below, so each must be a plain digest.
          jq -e '[.config.digest, .layers[].digest] | all(test("^sha256:[0-9a-f]{64}$"))' "$(blob "$manifest")" >/dev/null ||
            { echo "::error::the amd64 manifest names a config or layer that is not a sha256 digest"; exit 1; }
          jq -c --arg tag "$GATE_IMAGE_TAG" \
            '[{Config: ("blobs/sha256/" + (.config.digest | ltrimstr("sha256:"))), RepoTags: [$tag], Layers: [.layers[].digest | "blobs/sha256/" + ltrimstr("sha256:")]}]' \
            "$(blob "$manifest")" > "${dir}/layout/manifest.json"
          # Only the amd64 config and layers, not every blob: the archive also
          # holds arm64 and the attestations (434 MB measured for the
          # two-platform archive on 2026-10-08). The archive itself stays:
          # the push rehearsal below reads it.
          jq -r '.[0].Config, .[0].Layers[]' "${dir}/layout/manifest.json" >"${dir}/amd64.files"
          tar -cf "${dir}/amd64.tar" -C "${dir}/layout" manifest.json -T "${dir}/amd64.files"
          docker load -i "${dir}/amd64.tar"
          rm -rf "${dir}/layout" "${dir}/amd64.tar"
          # The image ID is the config digest; docker load checks each layer
          # against the config, so this closes the chain down to the layers.
          # (That equality holds for the classic image store the runner uses.
          # On the containerd store the ID is a manifest digest, so this check
          # fails closed after such a runner change rather than passing.)
          got="$(docker image inspect --format '{{.Id}}' "$GATE_IMAGE_TAG")"
          [ "$got" = "$config" ] || { echo "::error::the loaded image is ${got}, not ${config}, the amd64 image of ${DIGEST}"; exit 1; }

      # Runs with no DRY_RUN condition on purpose: a dry run exists to rehearse
      # the release, and skipping the only check that starts the image would
      # make the rehearsal quieter than the real thing.
      #
      # SMOKE_CONTAINER_PORT is deliberately unset: the image EXPOSEs 3142 and
      # defaults to it, which is the script's own default.
      #
      # What this proves, stated narrowly so nobody reads more into a green
      # gate: the amd64 image of the index publish-docker will push boots
      # healthy, answers /health unauthenticated, logs no startup failure,
      # and does it again over a written volume.
      - name: Smoke-test the image (run it like a user does)
        env:
          # Unique per run AND per re-run, so a retry cannot collide with a
          # leftover container or volume from the attempt before it.
          SMOKE_PREFIX: jarvis-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./.github/scripts/docker-smoke.sh "$GATE_IMAGE_TAG"

      # A registry on loopback only, for the rehearsal below; nothing outside
      # this runner can reach it, and it holds nothing but this run's
      # archive. The image is pinned by digest (REHEARSAL_REGISTRY_IMAGE).
      #
      # skopeo talks HTTPS unless told otherwise, and the runner's skopeo
      # (1.13.3, Ubuntu 24.04's package) ignores CONTAINERS_REGISTRIES_CONF
      # -- measured: with it set, skopeo --debug still loads only
      # /etc/containers/registries.conf and its .d directory. So this marks
      # exactly this registry plain-HTTP in a drop-in there, on this
      # ephemeral runner, and the push script stays byte for byte the one
      # publish-docker runs. (buildx imagetools already speaks plain HTTP to
      # a loopback registry, measured on buildx 0.37.1.)
      - name: Start a throwaway registry for the push rehearsal
        run: |
          set -euo pipefail
          docker run -d --name "$REHEARSAL_CONTAINER" -p 127.0.0.1:5000:5000 "$REHEARSAL_REGISTRY_IMAGE"
          sudo mkdir -p /etc/containers/registries.conf.d
          printf '[[registry]]\nlocation = "127.0.0.1:5000"\ninsecure = true\n' |
            sudo tee /etc/containers/registries.conf.d/50-jarvis-release-rehearsal.conf >/dev/null
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/v2/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::the throwaway registry did not answer on 127.0.0.1:5000"
          exit 1

      # The push publish-docker makes after the approvals, made here first
      # against the throwaway registry: the same script (this is its anchor,
      # and publish-docker runs it through the alias), the same archive, the
      # same digest and tags; only REGISTRY differs. So it proves the archive
      # check, the tag check, that skopeo pushes this archive by its index
      # digest unchanged, and that imagetools tags exactly that index.
      # What it cannot prove: GHCR itself, and the GHCR credential.
      - name: Rehearse the push by digest and the tagging
        env:
          REGISTRY: 127.0.0.1:5000
          DIGEST: ${{ needs.build-image.outputs.digest }}
          ARCHIVE_SHA256: ${{ needs.build-image.outputs.archive_sha256 }}
          TAGS: ${{ needs.build-image.outputs.tags }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: &push-release-image |
          set -euo pipefail
          export LC_ALL=C
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build-image reported no image digest"; exit 1; }
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build-image reported no archive digest"; exit 1; }
          archive="${RUNNER_TEMP}/release-image/release-image.oci.tar"
          echo "${ARCHIVE_SHA256}  ${archive}" | sha256sum -c -
          # skopeo unpacks the archive before it reads it. The digest above
          # already binds it to build-image; this also refuses any entry an
          # OCI layout from BuildKit does not have (measured: oci-layout,
          # index.json, blobs/, blobs/sha256/ and regular blob files), so no
          # link, absolute path or .. reaches the unpacking. Files, not pipes:
          # under pipefail a grep -q that stops early kills the writer with
          # SIGPIPE, and the if would read that 141 as nothing found.
          lists="${RUNNER_TEMP}/release-image"
          tar -tvf "$archive" | cut -c1 >"${lists}/types"
          tar -tf "$archive" >"${lists}/names"
          if grep -qv '^[-d]$' "${lists}/types" ||
            grep -qvE '^(oci-layout|index\.json|blobs/|blobs/sha256/|blobs/sha256/[0-9a-f]{64})$' "${lists}/names"; then
            echo "::error::the archive holds entries an OCI layout does not have; refusing to unpack it"
            exit 1
          fi
          # The tags arrive from build-image's metadata step and are taken only
          # if they are exactly the ones this release owns, worked out again
          # here from validate-tag: the version, and for a non-prerelease also
          # major.minor and latest (metadata-action gives a prerelease its
          # version tag only). So `latest` cannot move on a prerelease, and no
          # tag outside this repository image can be named.
          owned="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          want=("${VERSION}")
          if [ "$PRERELEASE" = "false" ]; then
            want+=("${VERSION%.*}" "latest")
          fi
          expected=()
          for t in "${want[@]}"; do expected+=("${owned}:${t}"); done
          got=()
          while IFS= read -r t; do
            [ -n "$t" ] && got+=("$t")
          done <<<"$TAGS"
          # As sets: metadata-action lists `latest` twice for a release (once
          # from the semver flavor, once from the raw rule; the v0.15.0 log,
          # run 36728949586, shows both), and each tag is created once anyway.
          if [ "$(printf '%s\n' "${got[@]}" | sort -u)" != "$(printf '%s\n' "${expected[@]}" | sort -u)" ]; then
            echo "::error::build-image computed tags other than the ones this release owns"
            printf 'computed: %q\n' "${got[@]}"
            printf 'expected: %q\n' "${expected[@]}"
            exit 1
          fi
          # The index and everything under it, by digest. skopeo refuses a
          # destination digest the archive index does not hash to ("Digest of
          # source image's manifest would not match destination reference",
          # measured on 1.13.3) before it writes a manifest, and
          # --preserve-digests refuses any conversion that would change a
          # digest. --all takes both platforms and both attestation manifests.
          skopeo --version
          skopeo copy --all --preserve-digests --retry-times 3 "oci-archive:${archive}" "docker://${image}@${DIGEST}"
          args=()
          for t in "${want[@]}"; do args+=(-t "${image}:${t}"); done
          # Before any tag moves: what create would write must BE that index,
          # byte for byte. --dry-run prints it (the index JSON, measured on
          # buildx 0.37 to hash to the source digest once its trailing newline
          # is dropped, which $( ) does), so this also reads back what the
          # push wrote, and a buildx that re-serialised the index would stop
          # here instead of after :latest had moved.
          planned="$(docker buildx imagetools create --dry-run "${args[@]}" "${image}@${DIGEST}")"
          [ "sha256:$(printf '%s' "$planned" | sha256sum | cut -d' ' -f1)" = "$DIGEST" ] ||
            { echo "::error::the index at ${image}@${DIGEST} is not the one in the archive; no tag was moved"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${image}@${DIGEST}"
          # Every tag must now name exactly the index smoke-image ran. If this
          # fails on GHCR, the tags HAVE moved and npm has published, while
          # github-release and discord-notify are skipped. Recovery: find what
          # the tags point at, then re-run the failed jobs of this run
          # (publish-docker, then github-release) once the cause is known; the
          # archive is kept for 35 days. NOT if a later release has shipped
          # since: a re-run would point latest and major.minor back at this
          # older build. Then create only the version tag by hand.
          for t in "${want[@]}"; do
            d="$(docker buildx imagetools inspect "${image}:${t}" --format '{{json .Manifest.Digest}}')"
            [ "$d" = "\"${DIGEST}\"" ] || { echo "::error::${image}:${t} points at ${d}, not ${DIGEST}"; exit 1; }
          done
          for t in "${want[@]}"; do echo "tagged ${image}:${t}"; done

      # The script removes the containers and volumes it created, by name, in
      # its own EXIT trap, and deliberately leaves the image to its caller.
      # By exact name: no prune.
      #
      # `|| true` so a cleanup problem cannot redden an otherwise green gate,
      # which does mean a leak goes unreported: if the script is SIGKILLed its
      # trap never runs, the leftover container holds the image, and this rm
      # fails silently. Acceptable because every runner here is a GitHub-hosted
      # ephemeral VM that is destroyed with the job. On a self-hosted runner
      # this would need to report what it could not remove.
      - name: Remove the image tag and the registry this job started
        if: always()
        run: |
          docker rm -f -v "$REHEARSAL_CONTAINER" || true
          docker image rm "$GATE_IMAGE_TAG" || true

  # ─── Sidecar release (reusable, versioned from sidecar/VERSION) ─
  # Builds + publishes the sidecar at its own version, gated behind the image
  # smoke test like the brain publish. Idempotent: a no-op when that version is
  # already on npm, so a brain release ships the sidecar only when it actually
  # changed. See sidecar-release.yml.
  sidecar:
    needs: [test, smoke-image]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/sidecar-release.yml
    # Exactly the Apple signing credentials, not `secrets: inherit` (#682):
    # inherit made every repository secret -- DISCORD_WEBHOOK_URL, NPM_TOKEN,
    # and any added later -- referenceable from the called workflow, whose
    # publish-sidecar job holds id-token. These five must reach it or its
    # macOS signing steps silently skip; sidecar-release.yml declares the
    # same five under workflow_call, and workflow-hardening.test.sh checks
    # that the two lists match.
    # Windows signing needs no secret at all: it federates into Google Cloud
    # with the id-token granted above (repository *variables* are visible to
    # called workflows without passing anything).
    secrets:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    with:
      dry_run: ${{ inputs.dry_run == true }}

  # --- Build the brain tarball (no OIDC) ---
  # Split from publish-brain (#682). Everything that runs repository and
  # dependency code -- `bun install` lifecycle scripts, prepublishOnly's UI and
  # workflow builds, the tarball check -- runs here, in a job that cannot mint
  # an OIDC token, and its one product is the tarball plus its digest.
  # publish-brain then publishes that file and runs nothing else: npm runs no
  # lifecycle scripts when publishing a tarball, only a directory.
  #
  # It runs dependency code, and every job in this run can write this run's
  # artifacts, so it starts only once the sidecar workflow has published and
  # smoke-image is done: a lifecycle script left running here must not be
  # able to swap the sidecar binaries between their upload and
  # publish-sidecar's download. publish-brain waits for both anyway, so this
  # costs no time. The timeout bounds how long anything it starts can linger.
  pack-brain:
    needs: [validate-tag, test, smoke-image, sidecar]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The Actions cache is writable by any run on main; see #681.
          no-cache: true
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The same npm that publishes packs, so the tarball is the one npm
      # itself would have built from the directory.
      - name: Install the pinned npm
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          got="$(npm --version)"
          [ "$got" = "$NPM_VERSION" ] || { echo "::error::npm on PATH is $got, expected $NPM_VERSION"; exit 1; }

      # Frozen here too: this job runs prepublishOnly and builds the tarball,
      # so it must not resolve a version bun.lock never recorded.
      - run: bun install --frozen-lockfile

      - name: Set package version
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build UI
        run: bun run prepublishOnly

      # Assert the tarball ABOUT TO BE PUBLISHED still contains every file an
      # out-of-repo consumer resolves by path. The PR gate runs this too, but
      # only this job holds the real artifact: a `files` edit merged after CI,
      # or an npm/bun disagreement about `files`, is caught here or not at all.
      # npm is on PATH in this job, so the check runs npm's own packer.
      # npm versions are immutable -- one minute here beats a fix-forward.
      - name: Check published tarball contents
        run: bun run scripts/check-package-files.ts

      # `npm pack` runs prepack/prepare/postpack but not prepublishOnly, which
      # is why the step above runs it explicitly: the result is what a
      # directory `npm publish` would have uploaded.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/brain-pack"
          mkdir -p "$dir"
          name="$(npm pack --pack-destination "$dir" | tail -n1)"
          [ -f "$dir/$name" ] || { echo "::error::npm pack did not produce $dir/$name"; exit 1; }
          sum="$(sha256sum "$dir/$name" | cut -d' ' -f1)"
          echo "tarball=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "Packed $name (sha256 $sum)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brain-tarball
          path: ${{ runner.temp }}/brain-pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # ─── Publish main brain package to npm ─────────────────────────
  # After the sidecar: a published brain advertises the sidecar it ships with
  # (SIDECAR_LATEST_VERSION) to every connecting sidecar, which offers to
  # install it, so that sidecar has to be on npm first. The sidecar job is a
  # no-op success when its version is already published.
  #
  # The only job here that can mint an OIDC token for npm, so it checks out
  # nothing, installs no dependencies and runs no repository code (#682): it
  # verifies pack-brain's tarball against the digest pack-brain reported and
  # publishes it.
  publish-brain:
    needs: [validate-tag, pack-brain, smoke-image, sidecar]
    runs-on: ubuntu-latest
    # npm Trusted Publishing for @usejarvis/brain requires this environment, so
    # the OIDC token this job mints must carry the claim or npm refuses the
    # publish (#679). It is also the gate: the environment's required reviewers
    # mean a stolen token or a compromised action cannot publish unattended --
    # automation cannot click Approve. Changing the real-run name here does not
    # loosen a check, it breaks publishing outright.
    #
    # A dry run uses a DIFFERENT environment, because naming one records a
    # GitHub deployment against it. Two jobs carry this, so each dry run wrote
    # two deployments claiming `release` for a version it never published, and
    # the Deployments page then showed a rehearsal as the live state. Only
    # `github`, `inputs`, `vars`, `needs`, `strategy` and `matrix` are allowed
    # in an environment name -- NOT `env`, so this reads `inputs.dry_run`
    # rather than the DRY_RUN env every other step uses.
    environment:
      name: ${{ inputs.dry_run == true && 'release-dry-run' || 'release' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Exact version: see NPM_VERSION at the top. The check is there so a
      # pin that silently did not take (a PATH shadowing the global install)
      # fails here instead of publishing with the bundled npm 10.
      - name: Ensure npm supports Trusted Publishing
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          got="$(npm --version)"
          [ "$got" = "$NPM_VERSION" ] || { echo "::error::npm on PATH is $got, expected $NPM_VERSION"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brain-tarball
          path: ${{ runner.temp }}/brain-pack

      # The digest travels as a job output, which only pack-brain can set; the
      # artifact store is writable by every job in this run. A mismatch means
      # the file is not the one pack-brain built.
      - name: Verify the tarball
        env:
          TARBALL: ${{ needs.pack-brain.outputs.tarball }}
          SHA256: ${{ needs.pack-brain.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" =~ ^usejarvis-brain-[0-9A-Za-z.-]+\.tgz$ ]] || { echo "::error::unexpected tarball name"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::pack-brain reported no digest"; exit 1; }
          echo "${SHA256}  ${RUNNER_TEMP}/brain-pack/${TARBALL}" | sha256sum -c -

      - name: Publish to npm
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
          TARBALL: ${{ needs.pack-brain.outputs.tarball }}
        run: |
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          if [ "$PRERELEASE" = "true" ]; then flags+=(--tag next); fi
          pkg="@usejarvis/brain"

          if ! npm publish "${RUNNER_TEMP}/brain-pack/${TARBALL}" --access public "${flags[@]}"; then
            if [ "$DRY_RUN" != "true" ] && npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "${pkg}@${VERSION} is already on npm; treating as success."
            else
              exit 1
            fi
          fi

  # ─── Create the brain GitHub Release ───────────────────────────
  # Gated by publish-docker (itself gated by the npm publishes), so a failed
  # publish means no release and no Discord ping. Carries the brain notes the
  # Discord step summarizes and, when the sidecar was (re)built this run,
  # attaches the sidecar binaries — so the downloads live on the brain's v*
  # release with no separate sidecar tag. The sidecar itself ships via npm
  # (sidecar-release.yml).
  github-release:
    needs: [validate-tag, publish-docker, sidecar]
    runs-on: ubuntu-latest
    # Creating the release (and its generated notes) is a contents write. The
    # sidecar artifacts come from this same run, which needs no token scope.
    permissions:
      contents: write
    steps:
      # persist-credentials: false (#682). Nothing in this job runs git:
      # action-gh-release creates the release through the API with its own
      # token input. Left on, the contents: write token sat in .git/config
      # for every later step to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The sidecar binaries are uploaded as artifacts by the reusable
      # sidecar-release workflow (same run); pull them in only when it actually
      # built this run.
      - name: Download sidecar binaries
        if: needs.sidecar.outputs.released == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: sidecar-*

      # Exactly the bytes publish-sidecar published (#682): its digests come
      # as a job output; the artifacts themselves could have been replaced by
      # any job in this run since -- pack-brain runs dependency code in
      # between.
      - name: Verify sidecar binaries
        if: needs.sidecar.outputs.released == 'true'
        env:
          SUMS: ${{ needs.sidecar.outputs.sums }}
        run: |
          set -euo pipefail
          [ -n "$SUMS" ] || { echo "::error::the sidecar workflow reported no digests"; exit 1; }
          cd artifacts
          printf '%s' "$SUMS" | base64 -d | sha256sum --strict -c -

      - name: Package sidecar assets
        if: needs.sidecar.outputs.released == 'true'
        env:
          SIDECAR_VERSION: ${{ needs.sidecar.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release

          # Tarballs are named for the sidecar's own version.
          # darwin: the artifact is already a tar.gz of Jarvis.app (signed +
          # notarized when CI has the Apple credentials, ocr-helper inside) —
          # attach it under the release name.
          for platform in darwin-arm64 darwin-x64; do
            cp "artifacts/sidecar-${platform}/jarvis-app.tar.gz" \
              "release/${SIDECAR_BIN}-v${SIDECAR_VERSION}-${platform}.tar.gz"
          done

          for platform in linux-x64 linux-arm64; do
            chmod +x "artifacts/sidecar-${platform}/${SIDECAR_BIN}"
            tar -czf "release/${SIDECAR_BIN}-v${SIDECAR_VERSION}-${platform}.tar.gz" \
              -C "artifacts/sidecar-${platform}" "${SIDECAR_BIN}"
          done

          # Windows gets a zip. The .exe is Authenticode-signed by
          # sidecar-release.yml; a real run that cannot sign fails there
          # unless ALLOW_UNSIGNED_WINDOWS is set (#869).
          cd "artifacts/sidecar-win32-x64"
          zip "../../release/${SIDECAR_BIN}-v${SIDECAR_VERSION}-win32-x64.zip" \
            "${SIDECAR_BIN}.exe"
          cd "$GITHUB_WORKSPACE"

          # Checksums for every attached asset
          (cd release && sha256sum * > SHA256SUMS)

      - name: Create GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          # The commit this run built. Without it, a tag deleted mid-run would
          # be re-created by action-gh-release at the default branch's tip.
          target_commitish: ${{ github.sha }}
          name: Jarvis ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.prerelease == 'true' }}
          # Empty when the sidecar didn't change this run — attach what's there.
          fail_on_unmatched_files: false
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS

      # `generate_release_notes: true` above means GitHub composes the notes, so
      # skipping that step on a dry run skipped the notes with it -- the one
      # human-facing output of a release went unrehearsed. This renders them
      # through the generate-notes endpoint, which returns a body and creates
      # NOTHING, and puts them in the job summary to be read.
      - name: Render the release notes this would publish
        if: env.DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body)
          {
            echo "## Release notes this run would publish"
            echo
            echo "Rendered for \`${TAG}\` at \`${SHA}\`. No release was created."
            echo
            echo "$notes"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$notes"

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          echo "::notice::DRY RUN — skipped GitHub Release creation"
          echo "Would have created release v${VERSION}"
          ls -lh release/ 2>/dev/null || true

  # --- Push the smoked archive to GHCR by digest, and tag it ---
  # Gated by the npm publishes -- if any npm publish fails, nothing reaches
  # GHCR. Keeps the release atomic from the user-visible side: a Docker image
  # tagged vX.Y.Z always has matching @usejarvis/* npm versions. And, through
  # publish-brain, gated by the `release` environment approval: this is the
  # only job that can write to the registry at all (#868).
  #
  # Builds nothing (#680). It pushes the archive build-image built and
  # smoke-image ran, by its index digest, and points the release tags at that
  # digest, so the tagged image is byte for byte the one the smoke test
  # started. The script is smoke-image's rehearsal script, through a YAML
  # alias: the same lines already pushed and tagged this archive against a
  # throwaway registry before any approval, so what is new here is only GHCR
  # and its credential.
  #
  # On a dry run nothing is downloaded, pushed or tagged: the rehearsal in
  # smoke-image is the dry run of this job.
  publish-docker:
    needs: [validate-tag, build-image, smoke-image, sidecar, publish-brain]
    runs-on: ubuntu-latest
    # No checkout and no build: the registry write is the whole job.
    permissions:
      packages: write
    # Unchanged by #868, measured against: the archive downloads in 5s
    # (434,377,884 bytes, dry run 37788481655), and v0.15.0 built AND
    # pushed the image in one 82s step (run 36728949586), so the push alone
    # takes less than that. A timeout here comes after npm has published,
    # hence the margin.
    timeout-minutes: 15
    steps:
      # Outside the workspace, though nothing here is checked out. Before the
      # login (#868 review): the artifact store is writable by every job in
      # this run, so the zip is unpacked and checked while no registry
      # credential is on disk yet.
      - name: Download the archive
        if: env.DRY_RUN != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-image-oci
          path: ${{ runner.temp }}/release-image

      # #781: the digest comes as a job output, which only build-image can
      # set. The push script checks it again; this is the check that runs
      # before the credential exists.
      - name: Verify the archive
        if: env.DRY_RUN != 'true'
        env:
          ARCHIVE_SHA256: ${{ needs.build-image.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build-image reported no archive digest"; exit 1; }
          in="${RUNNER_TEMP}/release-image"
          if [ "$(find "$in" -mindepth 1 -print)" != "${in}/release-image.oci.tar" ] || [ -L "${in}/release-image.oci.tar" ] || [ ! -f "${in}/release-image.oci.tar" ]; then
            echo "::error::the release-image-oci artifact is not exactly one file, release-image.oci.tar"
            exit 1
          fi
          echo "${ARCHIVE_SHA256}  ${in}/release-image.oci.tar" | sha256sum -c -

      # Only when something will be pushed (#682). skopeo reads the
      # credential this writes to ~/.docker/config.json, as imagetools does.
      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the smoked archive by digest and tag it
        if: env.DRY_RUN != 'true'
        env:
          REGISTRY: ghcr.io
          DIGEST: ${{ needs.build-image.outputs.digest }}
          ARCHIVE_SHA256: ${{ needs.build-image.outputs.archive_sha256 }}
          TAGS: ${{ needs.build-image.outputs.tags }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: *push-release-image

      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        env:
          DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          echo "::notice::DRY RUN -- nothing pushed to GHCR. smoke-image pushed ${DIGEST} to a throwaway registry and tagged it there, with the script this job runs."

  # ─── Notify Discord about the new release ──────────────────────
  discord-notify:
    needs: [validate-tag, github-release]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get release notes
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")
          BODY=$(echo "$RELEASE_JSON" | jq -r '.body')
          HTML_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url')
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')

          # Store in files to avoid delimiter issues
          echo "$BODY" > /tmp/whats_changed.txt
          echo "$HTML_URL" > /tmp/html_url.txt
          echo "$TAG" > /tmp/tag.txt

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          export LC_ALL=en_US.UTF-8

          TAG=$(cat /tmp/tag.txt)
          HTML_URL=$(cat /tmp/html_url.txt)

          # Strip GitHub HTML comments and the redundant "## What's Changed" header
          # (the message prefix already announces the release).
          CLEAN=$(sed -e '/^<!--/d' -e '/^## What.s Changed$/d' /tmp/whats_changed.txt)
          CLEAN=$(printf '%s\n' "$CLEAN" | awk 'NF{p=1} p')

          PREFIX=$'@everyone\n\n**Jarvis '"${TAG}"$' has been released!** 🎉\n\n'
          SUFFIX=$'\n\n🔗 **Full release:** <'"${HTML_URL}"'>'

          TOTAL_PRS=$(printf '%s\n' "$CLEAN" | grep -c '^\* ' || true)

          # Per-section bullet counts in the full changelog (preserves order).
          SECTIONS_FULL=$(printf '%s\n' "$CLEAN" | awk '
            /^### / { current=$0; if (!(current in seen)) { order[++n]=current; seen[current]=1 } next }
            /^\* / && current { count[current]++ }
            END { for (i=1;i<=n;i++) printf "%d\t%s\n", count[order[i]]+0, order[i] }
          ')

          # Reserve worst-case marker length (assume every section appears in the dropped list).
          ALL_HEADERS=$(printf '%s\n' "$SECTIONS_FULL" | cut -f2- | sed 's/^### //' | paste -sd ', ' -)
          MARKER_WORST=$(printf '\n\n*...and %d more changes across %s.*' "$TOTAL_PRS" "$ALL_HEADERS")

          BUDGET=$(( 2000 - ${#PREFIX} - ${#SUFFIX} - ${#MARKER_WORST} ))

          USED=0
          KEPT=""
          TRUNCATED=0
          while IFS= read -r LINE; do
            COST=$(( ${#LINE} + 1 ))
            if (( USED + COST <= BUDGET )); then
              KEPT+="${LINE}"$'\n'
              USED=$(( USED + COST ))
            else
              TRUNCATED=1
              break
            fi
          done < <(printf '%s\n' "$CLEAN")

          if (( TRUNCATED )); then
            # Drop trailing dangling section headers (no bullets kept under them).
            KEPT=$(printf '%s' "$KEPT" | awk '
              { lines[NR]=$0 }
              END {
                n=NR
                while (n>0 && lines[n] ~ /^### /) n--
                for (i=1;i<=n;i++) print lines[i]
              }')

            KEPT_PRS=$(printf '%s\n' "$KEPT" | grep -c '^\* ' || true)
            DROPPED=$(( TOTAL_PRS - KEPT_PRS ))

            SECTIONS_KEPT=$(printf '%s\n' "$KEPT" | awk '
              /^### / { current=$0; if (!(current in seen)) { order[++n]=current; seen[current]=1 } next }
              /^\* / && current { count[current]++ }
              END { for (i=1;i<=n;i++) printf "%d\t%s\n", count[order[i]]+0, order[i] }
            ')

            DROPPED_SECTIONS=$(awk -F'\t' '
              NR==FNR { kept[$2]=$1; next }
              {
                full=$1; header=$2
                k = (header in kept) ? kept[header] : 0
                if (k < full) print header
              }
            ' <(printf '%s\n' "$SECTIONS_KEPT") <(printf '%s\n' "$SECTIONS_FULL") | sed 's/^### //')

            N=$(printf '%s\n' "$DROPPED_SECTIONS" | sed '/^$/d' | wc -l)
            if (( N == 0 )); then
              LIST=""
            elif (( N == 1 )); then
              LIST=$(printf '%s' "$DROPPED_SECTIONS")
            elif (( N == 2 )); then
              LIST=$(printf '%s\n' "$DROPPED_SECTIONS" | paste -sd '|' - | sed 's/|/ and /')
            else
              LIST=$(printf '%s\n' "$DROPPED_SECTIONS" | awk '
                { a[NR]=$0 }
                END {
                  for (i=1;i<NR;i++) printf "%s, ", a[i]
                  printf "and %s", a[NR]
                }
              ')
            fi

            if [[ -n "$LIST" ]]; then
              MARKER=$(printf '\n\n*...and %d more changes across %s.*' "$DROPPED" "$LIST")
            else
              MARKER=$(printf '\n\n*...and %d more changes.*' "$DROPPED")
            fi

            KEPT="${KEPT%$'\n'}"
            BODY="${KEPT}${MARKER}"
          else
            BODY="$CLEAN"
          fi

          MESSAGE="${PREFIX}${BODY}${SUFFIX}"

          jq -n --arg content "$MESSAGE" '{"content": $content, "flags": 4}' | \
            curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
