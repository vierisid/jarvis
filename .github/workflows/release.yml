name: Release

# Cuts a release end-to-end: bumps package.json on a release branch, opens a
# PR and merges it (main requires PRs), tags the merge commit, then dispatches
# the Release Executor workflow (release-exec.yml) against that tag and waits
# for that run, failing unless it succeeds (#683). The explicit dispatch is
# required because tags pushed with GITHUB_TOKEN never trigger tag-push
# workflows (GitHub's recursion guard) -- workflow_dispatch is exempt from
# that guard.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version: explicit (e.g. 0.7.0) or bump keyword (patch | minor | major)"
        required: true
        default: "patch"

permissions:
  contents: write
  pull-requests: write
  actions: write

# queue: max (#683). `cut` now holds this group until the release it
# dispatched has finished, which can be hours, and the default queue keeps ONE
# pending run: a third dispatch would silently cancel the waiting one. `max`
# queues them in order, as release-exec.yml does. actionlint 1.7.x predates
# the key and reports it as unexpected.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  cut:
    runs-on: ubuntu-latest
    # Above the release-executor watch bound (WATCH_TIMEOUT_SECONDS below,
    # 300 minutes), so the watch fails with a message first; see that step.
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Refuse now, with a reason, rather than at a confusing checkout failure
      # (#929). Same shape as #869: a release that cannot finish should say so
      # before it changes anything, not after the bump PR is open.
      # Through env, not an `if:`: the secrets context is not dependable in a
      # step condition, and an empty `token:` on the checkout below would fail
      # with something that looks like a network problem.
      - name: Refuse without the bump-PR token
        env:
          BUMP_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$BUMP_PR_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set, so the bump PR would open without CI and could never merge (#929)."
            echo "Add a fine-grained PAT with Contents: read and write, and Pull requests: read and write, on this repository."
            exit 1
          fi

      # The PAT, not GITHUB_TOKEN (#929). GitHub suppresses `pull_request` CI
      # for anything GITHUB_TOKEN opens, so the bump PR got no `test` run --
      # measured: zero checks on #600, the v0.15.0 bump PR -- and main has
      # required `test` since 2026-10-05. It is on the checkout so that the
      # branch push and `gh pr create` are the same actor; the PR-opened event
      # is what has to be attributed to a real token for CI to start.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      # Pinned, never `latest` (#681): this job's token can push a v* tag and
      # dispatch a real release. Same version as test.yml and release-exec.yml.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The Actions cache is writable by any run on main; see #681.
          no-cache: true
          bun-version: "1.4.2"

      - name: Compute new version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r .version package.json)
          # --allow-same-version so an equal version reaches the guard below
          # and fails with a clear message instead of npm's "Version not changed".
          NEW=$(npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version)
          NEW="${NEW#v}"
          echo "CURRENT=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "NEW=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Version bump: ${CURRENT} -> ${NEW}"

      - name: Guard - new version must be greater than current
        env:
          CURRENT: ${{ steps.version.outputs.CURRENT }}
          NEW: ${{ steps.version.outputs.NEW }}
        run: |
          bun -e '
            const { CURRENT, NEW } = process.env;
            if (Bun.semver.order(NEW, CURRENT) !== 1) {
              console.error(`Refusing to release ${NEW}: not greater than current package.json version ${CURRENT}`);
              process.exit(1);
            }
          '

      - name: Guard - tag must not already exist
        env:
          NEW: ${{ steps.version.outputs.NEW }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v${NEW}" >/dev/null 2>&1; then
            echo "Tag v${NEW} already exists"
            exit 1
          fi

      - name: Create release PR
        id: pr
        env:
          NEW: ${{ steps.version.outputs.NEW }}
          # Overrides the job-level github.token for this step only (#929), so
          # the PR is opened by the PAT and its CI starts.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="release/v${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "release v${NEW}"
          git push origin "$BRANCH"
          # skip-changelog keeps the bump PR out of the generated release notes
          # (and therefore out of the Discord summary, which is derived from
          # them) -- see the exclude rule in .github/release.yml.
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "release v${NEW}" \
            --label skip-changelog \
            --body "Version bump for v${NEW}. Auto-generated by the Release workflow.")
          echo "PR_URL=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Merge release PR
        id: merge
        env:
          PR_URL: ${{ steps.pr.outputs.PR_URL }}
        run: |
          set -euo pipefail
          # Two things are waited on here, and a real conflict is not one of
          # them: mergeability is computed async after creation, so UNKNOWN is
          # retried, but CONFLICTING (package.json changed on main between
          # checkout and merge) fails fast because retrying cannot fix it.
          #
          # The other is the required check (#929). main has required `test`
          # since 2026-10-05, it takes about 11 minutes (measured 10m49s, run
          # 37949458219), and a merely PENDING required check refuses the merge
          # exactly as a missing one does. This loop used to allow 10 tries at
          # 5s -- 50 seconds -- which no required check could ever have
          # satisfied; it went unnoticed because no release has run since.
          #
          # Bounded at 20 minutes: this job has 330 and the release watch below
          # takes 300, leaving 30 for everything before it.
          DEADLINE=$(( $(date +%s) + 1200 ))
          MERGED=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            STATUS=$(gh pr view "$PR_URL" --json mergeable --jq .mergeable || true)
            if [ "$STATUS" = "CONFLICTING" ]; then
              echo "Release PR ${PR_URL} conflicts with main; aborting."
              exit 1
            fi
            # Checks first, then merge: a refused merge prints a GraphQL error,
            # and at 20s intervals that would be 60 of them in the log ahead of
            # the one that works.
            if [ "$STATUS" = "MERGEABLE" ] && gh pr checks "$PR_URL" --required >/dev/null 2>&1; then
              if gh pr merge "$PR_URL" --squash; then MERGED=1; break; fi
            fi
            sleep 20
          done
          if [ "$MERGED" != 1 ]; then
            echo "Could not merge release PR ${PR_URL} within 20 minutes."
            echo "If its checks never started, it was opened without RELEASE_PR_TOKEN (#929)."
            gh pr checks "$PR_URL" || true
            exit 1
          fi
          SHA=""
          for i in $(seq 1 10); do
            SHA=$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid // empty' || true)
            [ -n "$SHA" ] && break
            sleep 3
          done
          if [ -z "$SHA" ]; then
            echo "Could not resolve merge commit SHA for ${PR_URL}"
            exit 1
          fi
          echo "SHA=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Tag merge commit
        env:
          NEW: ${{ steps.version.outputs.NEW }}
          SHA: ${{ steps.merge.outputs.SHA }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v${NEW}" \
            -f sha="${SHA}"

      - name: Delete release branch
        env:
          NEW: ${{ steps.version.outputs.NEW }}
        run: git push origin --delete "release/v${NEW}" || true

      # Dispatch AND wait (#683). This used to dispatch and exit, so a failed
      # or cancelled release left the merged bump and the pushed tag with
      # nothing published while this workflow stayed green. The script gets
      # the run id from the dispatch (or looks the run up by workflow, tag,
      # commit and time when the answer has none), checks it is that run,
      # and fails unless it concludes `success`.
      #
      # The wait is bounded so it fails with the run URL instead of the job
      # being killed at its clock. Measured on the last 23 release-exec runs
      # (2026-06-11 to 2026-10-07): median about 10 minutes, longest 83
      # (v0.7.0). It also covers the `release` environment approvals, which
      # wait for a person, and the release-exec concurrency queue, so the
      # bound is 5 hours: under the 6 a hosted job may run, with the job
      # timeout at 330 minutes leaving 30 for the steps before this one.
      # Hitting it does not stop the release; it only stops this job waiting.
      #
      # This job now holds the `release` concurrency group until the release
      # finishes, so a second Release dispatch queues behind it instead of
      # cutting the next version while this one is still publishing.
      - name: Start the release executor and wait for it
        env:
          TAG: v${{ steps.version.outputs.NEW }}
          SHA: ${{ steps.merge.outputs.SHA }}
          WATCH_TIMEOUT_SECONDS: "18000"
        run: .github/scripts/watch-release-run.sh

      # Don't leave an orphaned release branch / open PR behind: a re-run would
      # otherwise fail at git push / gh pr create because they already exist.
      # Merged PRs are left alone (only the branch gets deleted, harmlessly).
      - name: Clean up on failure
        if: ${{ failure() }}
        env:
          NEW: ${{ steps.version.outputs.NEW }}
          PR_URL: ${{ steps.pr.outputs.PR_URL }}
        run: |
          if [ -n "$PR_URL" ]; then
            STATE=$(gh pr view "$PR_URL" --json state --jq .state || true)
            if [ "$STATE" = "OPEN" ]; then
              gh pr close "$PR_URL" --comment "Release workflow run failed; closing. See the workflow logs." || true
            fi
          fi
          if [ -n "$NEW" ]; then
            git push origin --delete "release/v${NEW}" || true
          fi
