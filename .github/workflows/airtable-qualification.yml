name: Airtable qualification
on:
  pull_request:
    paths:
      - 'src/integrations/airtable-*.ts'
      - 'src/workflows/**'
      - '.github/workflows/airtable-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airtable-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  airtable-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bun-setup
      - name: Qualify published nodes and managed sends with local provider fixtures
        run: JARVIS_TEST_ENGINE_BUILD=1 bun test src/workflows/pieces-library/airtable-engine.test.ts
