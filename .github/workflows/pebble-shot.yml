# TEMPORARY — renders the native pebble state sheet on a real macOS runner so
# the FABLE5 Core Graphics drawing can be eyeballed from CI without a Mac.
# Download the "pebble-sheet-macos" artifact to see all 8 states (light + dark).
# Remove this workflow (with renderPebbleSheet / TestPebbleShot) once verified.
name: pebble-shot

on:
  workflow_dispatch:
  push:
    branches: ["refactor/design_branding_and_UI/UX"]
    paths:
      - "sidecar/pebble_overlay_darwin.go"
      - "sidecar/pebble_shot_darwin_test.go"
      - ".github/workflows/pebble-shot.yml"

jobs:
  render-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum
      - name: Render pebble state sheet (offscreen, no display)
        working-directory: sidecar
        env:
          JARVIS_PEBBLE_SHOT: ${{ github.workspace }}/pebble-sheet.png
        run: go test -run TestPebbleShot -count=1 .
      - uses: actions/upload-artifact@v5
        with:
          name: pebble-sheet-macos
          path: pebble-sheet.png
          if-no-files-found: error
