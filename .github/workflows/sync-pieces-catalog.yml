# Weekly refresh of the activepieces community catalog.
#
# What runs:
#   1. `bun run scripts/sync-pieces-catalog.ts` -- walks the activepieces
#      monorepo at the pinned SHA, queries npm for the latest version of
#      every piece, and writes `src/workflows/pieces-library/catalog-generated.ts`.
#      Transient npm failures (429/5xx) carry the previous entry forward
#      instead of dropping the piece; if npm fails for >10% of pieces the
#      script exits non-zero and this job fails without opening a PR.
#      It also diffs against the committed catalog and emits two step outputs:
#      `verdict` (safe | review) and `has_changes` (whether any entry moved).
#      Verified pieces only move to a version their governed adapter still
#      covers; the rest are held at the installed version and written to
#      `held.json` (see scripts/lib/verified-upgrade.ts).
#   2. `bun test` and `tsc --noEmit` -- the catalog tests in
#      `pieces-library/catalog.test.ts` guard against malformed entries
#      (bad semver, missing displayName, ids that collide, etc.) and against
#      any piece that is not MIT, by its license field or by where it lives
#      upstream (an /ee/ path, outside packages/pieces/community, or a SHA
#      other than the vendored one), and
#      `governed-pieces.test.ts` that every verified piece's installed actions
#      are mapped, which the hold in step 1 should always leave true.
#   3. Open a PR ONLY when an entry actually changed (`has_changes == true`).
#      A run that bumped nothing but the generation timestamp opens no PR. The
#      PR title reflects the verdict and the body is the script's diff analysis.
#   4. Track held verified bumps in one issue (label `verified-piece-review`):
#      opened when something is held, rewritten every run, closed once a run
#      holds nothing and could decide everything. The issue and the PR link
#      each other, and the issue says why each piece was held and how to clear it.
#   5. License-check what the hosted shared build would install from the
#      regenerated catalog (#971): every piece release and dependency bun
#      resolves, under the policy in pieces-library/license-policy.ts. A
#      denied package fails the run here, every week, whether or not the
#      catalog changed, before the next hosted build would refuse the tree.
#      The catalog PR still opens, but titled "(review needed)" whatever the
#      verdict, with the denied packages at the top of its body.
#
# Four jobs, split by what each one handles and what it may write (#686).
# Everything this workflow reads from outside -- the activepieces monorepo,
# ~300 npm registry answers, the verified pieces' own code, and the
# dependencies `bun install` runs lifecycle scripts for -- is handled in a job
# whose token can read the repository and nothing else:
#   inspect   reads the candidate verified versions' action lists, which means
#             RUNNING that piece's code, inside a throwaway container with no
#             git credentials on disk. The container's PID namespace ends with
#             it, so nothing the package starts survives into a later step.
#             Its only output is a JSON artifact.
#   generate  validates that JSON as untrusted input
#             (scripts/lib/verified-sync.ts), runs the generator against the
#             monorepo and npm, runs the catalog tests and the type check, and
#             renders the PR body and the review issue. Its outputs are an
#             artifact of those files and four step outputs.
#   licenses  installs the regenerated catalog as the shared build does
#             (--ignore-scripts, so no package code runs) and scans it. Read
#             only. Its failure fails the run, which is what says the hosted
#             build would refuse; the PR still opens, but not as "(safe)",
#             and its body lists the problems (an artifact of plain lines).
#   publish   holds the write scopes: it copies the two generated files into
#             its own checkout, opens the PR with RELEASE_PR_TOKEN and keeps
#             the review issue current with GITHUB_TOKEN. It installs nothing
#             and runs no JavaScript, so the only third-party code that ever
#             runs with either token is the SHA-pinned actions and the gh CLI.
# The generated files still cross from a read-only job into a write job --
# that is the point of the workflow -- and they are TypeScript, so they are
# data only until something imports them. Only the two named paths are
# committed, to the PR branch, never to main; the first thing that runs them
# is the PR's own test.yml run, with a read-only token, before a person has
# reviewed the PR.
#
# Why a PR (not a direct commit):
#   - Every catalog change is reviewable. Pieces can be renamed or removed
#     upstream, new pieces can be junk. Human eyes on the diff catch this
#     without much overhead.
#   - The PR can sit until someone has bandwidth; no urgency.
#
# Manual trigger:
#   workflow_dispatch lets a maintainer run this on demand from the Actions
#   tab without waiting for the cron tick. Useful when bumping PINNED_SHA
#   in the sync script and wanting an immediate catalog refresh.

name: Sync pieces catalog
on:
  schedule:
    # Sunday 03:00 UTC -- when nobody's pushing and reviewers can pick it up
    # Monday morning. Adjust if our CI quota care says otherwise.
    - cron: "0 3 * * 0"
  workflow_dispatch:

# A manual dispatch overlapping the cron run would race on the PR branch and
# could open two review issues.
concurrency:
  group: sync-pieces-catalog
  cancel-in-progress: false

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  # Pinned, matching test.yml and .github/actions/bun-setup: every install
  # below is --frozen-lockfile, and a floating Bun that migrates the lockfile
  # format would fail the run with no repo change to blame. Bump all of them
  # together, with the image digest in the inspect job.
  BUN_VERSION: "1.4.2"
  # Stands in for the PR URL in the review issue rendered by `generate`, which
  # runs before the PR exists; `publish` substitutes the real URL. Rendering
  # there instead would mean running repository JavaScript with the write token.
  PR_URL_PLACEHOLDER: "@@CATALOG_SYNC_PR_URL@@"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token in .git/config for the package code to find.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The Actions cache is writable by any run on main; see #681.
          no-cache: true
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # The repo is mounted read-only and only /out is writable. The image is
      # pinned by digest so the extraction's toolchain does not move under it:
      # a tag on Docker Hub can be re-pushed, a digest cannot.
      - name: Read verified piece manifests (runs piece code, contained)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inspection"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/inspection:/out" \
            -w /repo \
            oven/bun:1.4.2@sha256:9114c058aeae42162ee16dd5084b95fe9473970bb6bcb5b232ab1630f0546895 \
            bun run scripts/inspect-verified-pieces.ts /out/inspection.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-inspection
          path: ${{ runner.temp }}/inspection/inspection.json
          if-no-files-found: error
          retention-days: 7

  generate:
    needs: inspect
    runs-on: ubuntu-latest
    # A healthy run finishes in a few minutes. The ceiling guards the
    # pathological case where npm throttles every request with a long
    # Retry-After: better to kill the job than burn hours of runner time
    # (the >10% transient-failure abort usually fires long before this).
    timeout-minutes: 30
    # Read-only: this job installs dependencies, talks to npm and GitHub, and
    # runs the generator over what they return.
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.sync.outputs.verdict }}
      has_changes: ${{ steps.sync.outputs.has_changes }}
      held_count: ${{ steps.sync.outputs.held_count }}
      inconclusive_count: ${{ steps.sync.outputs.inconclusive_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The Actions cache is writable by any run on main; see #681.
          no-cache: true
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-inspection
          path: ${{ runner.temp }}/inspection

      # Run the generator. Writes catalog-generated.ts and
      # verified-manifests-generated.ts in place and, via --report, an analysed
      # PR body to the runner temp dir. Verified manifests come only from the
      # inspect job's JSON, so this job runs no piece code. Outputs:
      # `verdict` (safe | review), `has_changes`, `held_count`,
      # `inconclusive_count`.
      - name: Regenerate pieces catalog
        id: sync
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalog-sync"
          bun run scripts/sync-pieces-catalog.ts \
            --inspection "$RUNNER_TEMP/inspection/inspection.json" \
            --report "$RUNNER_TEMP/catalog-sync/catalog-pr-body.md" \
            --held "$RUNNER_TEMP/catalog-sync/held.json"

      # Make sure the regenerated catalog still passes the catalog tests
      # (id uniqueness, semver shape, MIT-only license, etc.), that every verified piece's
      # installed actions are mapped, and the wider type check.
      - name: Validate
        run: |
          bun run scripts/check-no-ee-imports.ts
          bun test src/workflows/pieces-library/catalog.test.ts src/workflows/runtime/governed-pieces.test.ts
          bunx tsc --noEmit

      # Rendered here, in the read-only job, twice: as it reads when this run
      # opens no PR, and with a placeholder for the PR URL that `publish`
      # fills in once the PR exists.
      - name: Render the review issue
        if: fromJSON(steps.sync.outputs.held_count || '0') > 0
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/catalog-sync"
          bun run scripts/render-review-issue.ts "$out/held.json" --run-url "$RUN_URL" > "$out/review-issue.md"
          bun run scripts/render-review-issue.ts "$out/held.json" --run-url "$RUN_URL" \
            --pr-url "$PR_URL_PLACEHOLDER" > "$out/review-issue-with-pr.md"

      - name: Collect the generated files
        run: |
          set -euo pipefail
          cp src/workflows/pieces-library/catalog-generated.ts \
            src/workflows/pieces-library/verified-manifests-generated.ts \
            "$RUNNER_TEMP/catalog-sync/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-sync
          path: ${{ runner.temp }}/catalog-sync
          if-no-files-found: error
          retention-days: 7

  # Step 5 of the header (#971). Reads the regenerated catalog from the
  # generate job's artifact: TypeScript, imported here, in a job as read-only
  # as the one that produced it. publish waits for this job but runs whatever
  # it concludes: a violation fails the run and marks the catalog PR as
  # needing review (the e04ca6df bump went out as "(safe)" while this job
  # failed, and the next hosted build refused the tree).
  licenses:
    needs: generate
    runs-on: ubuntu-latest
    # Measured locally (2026-10-21): the shared-build catalog installs in 57 s
    # with an empty bun cache (895 MB on disk), and the scan takes under a second.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The Actions cache is writable by any run on main; see #681.
          no-cache: true
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-sync
          path: ${{ runner.temp }}/catalog-sync

      - name: Use the regenerated catalog
        run: cp "$RUNNER_TEMP/catalog-sync/catalog-generated.ts" src/workflows/pieces-library/catalog-generated.ts

      # Installs into a fresh directory, the way scripts/build-shared-runtime.ts
      # installs the hosted tree, then applies the same gate. Exit 1 names
      # every denied package and the chain that installed it. --problems
      # writes the same lines, one each, for the catalog PR body.
      - name: License-check the shared pieces tree
        run: bun run scripts/check-piece-licenses.ts --install "$RUNNER_TEMP/license-scan" --summary-md "$GITHUB_STEP_SUMMARY" --problems "$RUNNER_TEMP/license-problems/license-problems.txt"

      # Even (above all) when the scan failed. Plain text, never run: publish
      # only pastes it into the PR body.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: license-problems
          path: ${{ runner.temp }}/license-problems/license-problems.txt
          if-no-files-found: warn
          retention-days: 7

  # Waits for licenses, and runs on its failure too: a denied package must
  # not hold the catalog PR back, only stop it reading as "(safe)". A
  # cancelled run publishes nothing.
  publish:
    needs: [generate, licenses]
    if: ${{ !cancelled() && needs.generate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GITHUB_TOKEN only reads the checkout and keeps the review issue. The
    # branch push and the PR go through RELEASE_PR_TOKEN (see the step that
    # opens the PR), so this token needs no contents or pull-requests write.
    permissions:
      contents: read
      # The held-verified-bumps tracking issue.
      issues: write
    steps:
      # Refuse now, with a reason, rather than open a PR whose CI never runs
      # and that can never merge (main requires `test`). Only a run that
      # would open or update the PR needs the token; a run with nothing to
      # change still keeps the review issue with GITHUB_TOKEN.
      # Through env, not an `if:`: the secrets context is not dependable in a
      # step condition. Same shape as release.yml (#929). This catches only an
      # empty secret; an expired or revoked PAT fails loudly inside
      # create-pull-request instead, on the same day as release.yml.
      - name: Refuse without the catalog PR token
        if: needs.generate.outputs.has_changes == 'true'
        env:
          CATALOG_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$CATALOG_PR_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is not set, so the catalog PR would open without CI and could never merge."
            echo "Add a fine-grained PAT with Contents: read and write, and Pull requests: read and write, on this repository."
            exit 1
          fi

      # No token left in .git/config (#821). This job copies in files a
      # read-only job produced, so nothing it runs should find the write
      # token on disk, and nothing here needs it there: create-pull-request
      # hides any persisted credential and configures its own from its
      # `token` input (git-config-helper.ts at the pinned SHA), and every gh
      # call reads GH_TOKEN from its step env.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: catalog-sync
          path: ${{ runner.temp }}/catalog-sync

      # Only the two files the PR commits are taken from the artifact, by
      # name, whatever else it holds.
      - name: Put the generated files in place
        if: needs.generate.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          for f in catalog-generated.ts verified-manifests-generated.ts; do
            cp "$RUNNER_TEMP/catalog-sync/$f" "src/workflows/pieces-library/$f"
          done

      # Found (or opened) BEFORE the PR, so the PR body can link it whichever
      # run created either. Its body is rewritten with the PR link below.
      - name: Find or open the review issue
        id: issue
        if: fromJSON(needs.generate.outputs.held_count || '0') > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ runner.temp }}/catalog-sync/catalog-pr-body.md
        run: |
          set -euo pipefail
          label=verified-piece-review
          gh label create "$label" --color D93F0B \
            --description "A verified piece bump the catalog sync held for a person" 2>/dev/null || true
          number=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh issue create --title "Verified pieces held back from the catalog refresh" \
              --label "$label" --body "Filled in by the catalog sync run that opened it.")
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          printf '\n%s\n' "Held verified pieces, and how to clear them: #${number}" >> "$PR_BODY"

      # The problem lines, if the scan got that far. Missing is fine: the
      # next step says the check did not finish.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.generate.outputs.has_changes == 'true' && needs.licenses.result != 'success'
        continue-on-error: true
        with:
          name: license-problems
          path: ${{ runner.temp }}/license-problems

      # Ahead of the verdict the sync script wrote, so a reviewer reads it
      # first. The lines are the scan's own, one per problem, already free of
      # newlines and workflow commands; each goes in a code span.
      - name: Put the license problems at the top of the PR body
        if: needs.generate.outputs.has_changes == 'true' && needs.licenses.result != 'success'
        env:
          PR_BODY: ${{ runner.temp }}/catalog-sync/catalog-pr-body.md
          PROBLEMS: ${{ runner.temp }}/license-problems/license-problems.txt
          LICENSES_RESULT: ${{ needs.licenses.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## License check failed (#971): not safe to merge"
            echo
            echo "The license scan of the shared pieces tree did not pass (licenses job: ${LICENSES_RESULT}). A denied package makes the next hosted shared build refuse the whole tree, so review it (a reviewed entry in src/workflows/pieces-library/license-policy.ts, or hold the piece back) before merging. Run: ${RUN_URL}"
            echo
            if [ -s "$PROBLEMS" ]; then
              # A backtick would end the code span early. The scan already
              # caps the file (50 lines of at most 300 characters, no bidi
              # controls); head is the backstop that keeps the verdict below
              # inside the 65536-character PR body.
              head -n 50 "$PROBLEMS" | tr '`' "'" | while IFS= read -r line; do
                printf -- '- `%s`\n' "$line"
              done
            else
              echo "The scan did not get as far as listing problems; see the licenses job in the run."
            fi
            echo
            cat "$PR_BODY"
          } > "$PR_BODY.new"
          mv "$PR_BODY.new" "$PR_BODY"

      # Open (or update) a PR with the catalog diff. peter-evans's
      # create-pull-request handles the branch creation, push, and PR
      # creation idempotently -- a second run on an already-open PR just
      # updates the branch. The title reflects the analysed verdict and the
      # body is the markdown the sync script wrote (body-path), so reviewers
      # see "safe to merge" vs "manual review required" at a glance. Only the
      # two generated files are committed, whatever else the run touched.
      #
      # Opened with RELEASE_PR_TOKEN, not GITHUB_TOKEN. GitHub does not start
      # `pull_request` CI on its own for a PR that GITHUB_TOKEN opens or
      # pushes: the run is created as `action_required` and waits for a
      # maintainer to approve it (measured on #935: run 38129917454). The
      # test.yml run this workflow used to dispatch at the branch instead
      # attached its checks to the head commit, but GitHub left them off the
      # PR, so main's required `test` check was never satisfied and #935
      # could not merge. With the PAT, the branch push and the PR are by a
      # real user, CI starts natively and its checks are the PR's checks
      # (measured on #951, the release PR opened the same way). Nothing
      # dispatches test.yml any more: the dispatched run never counted, and
      # its concurrency group (refs/heads/...) differs from the PR run's
      # (refs/pull/N/merge), so both would run in full.
      # The PAT reaches only this step and the empty-check at the top of the
      # job, which runs no third-party code. The action writes it to
      # .git/config for its own pushes and removes it before it exits
      # (git-config-helper.ts close(), in a finally, at the pinned SHA).
      # If `test` never starts on the PR, it was not opened or last pushed by
      # this token: dispatching test.yml by hand does not help (its checks
      # stay off the PR, measured on #935); close the PR and re-run this
      # workflow so it opens a fresh one.
      - name: Open PR with catalog changes
        id: cpr
        if: needs.generate.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          commit-message: "chore: refresh pieces catalog"
          title: "${{ needs.generate.outputs.verdict == 'safe' && needs.licenses.result == 'success' && 'chore: refresh pieces catalog (safe)' || 'chore: refresh pieces catalog (review needed)' }}"
          body-path: ${{ runner.temp }}/catalog-sync/catalog-pr-body.md
          branch: chore/sync-pieces-catalog
          add-paths: |
            src/workflows/pieces-library/catalog-generated.ts
            src/workflows/pieces-library/verified-manifests-generated.ts
          labels: |
            pieces-catalog
            dependencies
          delete-branch: true

      # Rewrite the issue in full (it always describes the newest npm release),
      # or close it once a run holds nothing. A run that could not decide about
      # some verified piece (npm unanswered, a pin unreadable) leaves an open
      # issue alone rather than closing it on a guess.
      - name: Update or close the review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HELD_COUNT: ${{ needs.generate.outputs.held_count }}
          INCONCLUSIVE_COUNT: ${{ needs.generate.outputs.inconclusive_count }}
          ISSUE: ${{ steps.issue.outputs.number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/catalog-sync"
          if [ "${HELD_COUNT:-0}" -gt 0 ]; then
            if [ -n "$PR_URL" ]; then
              # Quoted pattern and replacement: literal text, and an `&` in
              # the URL is not bash 5.2's patsub_replacement back-reference.
              body="$(cat "$dir/review-issue-with-pr.md")"
              printf '%s\n' "${body//"$PR_URL_PLACEHOLDER"/"$PR_URL"}" > "$dir/review-issue-body.md"
            else
              cp "$dir/review-issue.md" "$dir/review-issue-body.md"
            fi
            gh issue edit "$ISSUE" --body-file "$dir/review-issue-body.md"
          elif [ "${INCONCLUSIVE_COUNT:-0}" -eq 0 ]; then
            open=$(gh issue list --label verified-piece-review --state open --json number --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Nothing is held as of ${RUN_URL}: every verified piece is at its newest version or its bump was taken."
            fi
          fi
