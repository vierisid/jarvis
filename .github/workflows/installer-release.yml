name: Installer Release

# Builds, signs and publishes the desktop installer (Jarvis-Setup.exe /
# Install-Jarvis.dmg) on its OWN cadence, versioned from
# sidecar/installer/VERSION.
#
# The installer is independent software: it resolves whichever sidecar version
# the npm registry tags `latest` at run time and embeds no sidecar version at
# all. So it ships when the INSTALLER changes — a sidecar release does not
# require a new installer, and an installer release does not require the
# sidecar to have changed. (A sidecar rework may of course imply installer
# work; that is a judgement call, not an automatic coupling.)
#
# Driven two ways:
#   * workflow_dispatch — the normal path (dry_run defaults to true).
#   * pushing an `installer-v*` tag.
# Idempotent: if a release for the current installer/VERSION already exists it
# stops as a no-op success.
#
# Assets are published TWICE, both with make_latest=false so the repo's
# /releases/latest keeps pointing at the brain:
#   * installer-v<VERSION> — immutable, per-version, for history + rollback.
#   * installer-latest     — rolling; its ASSETS are replaced every release,
#                            giving the website permanently stable URLs:
#                            releases/download/installer-latest/Jarvis-Setup.exe
#                            releases/download/installer-latest/Install-Jarvis.dmg
#                            (Only the assets roll: the underlying git tag is
#                            created on the first publish and is not moved
#                            afterwards, so that release's "Source code"
#                            archives stay pinned to that first commit. Use the
#                            installer-v<VERSION> releases to reason about
#                            source, and the rolling one only for downloads.)

on:
  push:
    tags:
      - "installer-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

# Two runs in flight would race on the rolling installer-latest release.
concurrency:
  group: installer-release
  cancel-in-progress: false

env:
  # Spelled as in release-exec.yml and sidecar-release.yml (#685), so
  # release-exec.test.sh holds this file to the same one-decision rule: the
  # readiness steps in sign-windows and sign-macos read it to decide whether
  # a run missing its signing config may continue (#869, #921), and nothing
  # may redefine it. On a
  # tag push there are no inputs and it is false, as `|| false` gave before.
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  # ─── Resolve version + idempotency gate ────────────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      # persist-credentials: false (#779): nothing here runs git; `gh` takes
      # GH_TOKEN from the step env.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          VERSION="$(cat sidecar/installer/VERSION)"
          # Checked before it becomes an output or reaches any message (#818),
          # as sidecar-release.yml checks sidecar/VERSION (#684). A newline
          # here would write extra lines into $GITHUB_OUTPUT, and every job
          # below takes the value as a tag name and a linker flag, so it must
          # be a plain semver with nothing a shell or the linker would read
          # as syntax. LC_ALL=C first: under a UTF-8 locale glibc's [A-Za-z]
          # and [0-9] match letters and digits outside ASCII.
          # SemVer 2.0 pre-release identifiers: no empty one, no leading zero
          # on a numeric one.
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${id}(\.${id})*)?$ ]]; then
            printf '::error::sidecar/installer/VERSION is not a plain semver: %q\n' "$VERSION"
            exit 1
          fi
          # A tag push must agree with the version file, or the run silently
          # does the wrong thing: a stale file no-ops the whole workflow with a
          # green check, and a mistyped tag publishes under a DIFFERENT tag
          # than the one pushed. Checked before any output is written.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "installer-v${VERSION}" ]; then
            printf '::error::tag %q does not match sidecar/installer/VERSION (%s) -- bump the file or retag as installer-v%s\n' "$GITHUB_REF_NAME" "$VERSION" "$VERSION"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run — building/signing installer v${VERSION} without publishing."
            exit 0
          fi
          if gh release view "installer-v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::installer-v${VERSION} is already released — nothing to do (bump sidecar/installer/VERSION to ship a new installer)."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Installer v${VERSION} is not yet released — building."
          fi

  # ─── Windows: mingw cross-build (no OIDC) ───────────────────────
  # Split from signing (#779), as #682 split the sidecar: mingw, `make
  # manifest-installer` and the Go module graph run here, in a job that
  # cannot mint an OIDC token, so a compromised toolchain or module cannot ask
  # Workload Identity Federation for a token and have KMS sign anything. The
  # binary crosses to sign-windows with its digest as a job output.
  build-windows:
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Actions cache is writable by any run on main, and Go reuses
          # cached modules and build output without re-verifying them (#681).
          cache: false
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - name: Install mingw-w64
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build installer
        working-directory: sidecar
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          # Checked by resolve (#818); read from its output, not the file.
          INSTALLER_VERSION: ${{ needs.resolve.outputs.version }}
          # Pins the publisher whose payloads this installer will accept —
          # chain validity alone would accept ANY signed exe. Set it together
          # with the signing credentials. Empty fails a real run unless
          # ALLOW_UNPINNED_WINDOWS is exactly true; a dry run warns (#922).
          SIGNING_PUBLISHER_CN: ${{ vars.SIGNING_PUBLISHER_CN }}
          ALLOW_UNPINNED_WINDOWS: ${{ vars.ALLOW_UNPINNED_WINDOWS }}
        run: |
          set -euo pipefail
          ../.github/scripts/require-signing-pin.sh SIGNING_PUBLISHER_CN ALLOW_UNPINNED_WINDOWS Jarvis-Setup.exe
          export CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++
          export CGO_CFLAGS="-I$(pwd)/include" CGO_CXXFLAGS="-I$(pwd)/include"
          make manifest-installer
          # The go tool splits -ldflags on whitespace, so the CN (a company
          # name — always contains spaces) must carry its own quotes through
          # to the linker.
          LDFLAGS="-s -w -H windowsgui -X main.installerVersion=${INSTALLER_VERSION}"
          LDFLAGS="$LDFLAGS -X 'github.com/jarvis/sidecar/internal/update.expectedPublisherCN=${SIGNING_PUBLISHER_CN}'"
          # -trimpath keeps -ldflags out of the embedded build info, so the
          # check below sees the pin only when the -X target really exists.
          go build -trimpath -ldflags "$LDFLAGS" -o Jarvis-Setup.exe ./installer/
          # Via a file, not a pipe: `grep -q` exiting early SIGPIPEs strings,
          # which pipefail would report as a missing pin.
          strings Jarvis-Setup.exe > /tmp/installer-strings.txt
          if [ -n "${SIGNING_PUBLISHER_CN}" ] && ! grep -qF "${SIGNING_PUBLISHER_CN}" /tmp/installer-strings.txt; then
            echo "::error::publisher pin '${SIGNING_PUBLISHER_CN}' is not present in Jarvis-Setup.exe — check the -ldflags quoting"
            exit 1
          fi

      - name: Digest
        id: digest
        working-directory: sidecar
        run: echo "sha256=$(sha256sum Jarvis-Setup.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Not under the installer-* name: that is the signed installer, which
      # only sign-windows uploads and publish downloads by that pattern.
      - name: Upload unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer-win32-x64
          path: sidecar/Jarvis-Setup.exe
          if-no-files-found: error
          retention-days: 1

  # ─── Windows: Authenticode via Cloud KMS ────────────────────────
  # The only job here that holds id-token. It builds nothing and installs
  # nothing: it verifies the installer build-windows reported, signs it with
  # scripts/sign-windows.sh (whose jsign download is checksum-pinned), and
  # uploads the result as installer-win32-x64 -- signed, or, when signing is
  # not configured, unsigned on a dry run or with ALLOW_UNSIGNED_WINDOWS set,
  # and otherwise not at all (#869: see the readiness step). The post-sign
  # check runs in verify-windows (#817).
  #
  # Who can sign (#819). The token this job mints is exchanged for the KMS
  # signing identity only if the Workload Identity provider behind
  # vars.GCP_WORKLOAD_IDENTITY_PROVIDER accepts it, and that provider, not
  # this file, decides who signs. Its attribute condition lives in GCP, where
  # no review or test here can see it; as set on 2026-10-09 it is:
  #   assertion.repository=='vierisid/jarvis' && (
  #     assertion.job_workflow_ref.startsWith('vierisid/jarvis/.github/workflows/sidecar-release.yml@refs/tags/v')
  #     || assertion.job_workflow_ref.startsWith('vierisid/jarvis/.github/workflows/sidecar-release.yml@refs/heads/main')
  #     || assertion.job_workflow_ref.startsWith('vierisid/jarvis/.github/workflows/installer-release.yml@refs/tags/installer-v')
  #     || assertion.job_workflow_ref.startsWith('vierisid/jarvis/.github/workflows/installer-release.yml@refs/heads/main'))
  # It admits this file when run from main or an installer-v* tag (and the
  # other signing workflow likewise; see there). By its text it refuses a
  # dispatch from a branch such as throwaway, and another repository calling
  # the public reusable sidecar-release.yml (assertion.repository is the
  # caller). It does NOT close every branch path, so do not rely on it for
  # that:
  #   * the main clauses are startsWith prefix matches, so a branch whose
  #     name starts with main (main-x, maint) passes them;
  #   * a branch workflow calling sidecar-release.yml@main federates as
  #     the signer too (see that file).
  # Both need write access, like the tag path below. Exact equality for main
  # in the condition would close the first; an environment gate keyed on
  # github.ref, on BOTH signing jobs, would close both. Only the allow side
  # has been exercised (every dry run); the deny side has not, and a test of
  # it should try a main-prefixed branch and a remote-ref call as well as a
  # plain branch. Renaming this file, moving this job or changing the tag
  # prefix needs the condition changed with it, or signing fails (403).
  #
  # Deliberately NOT gated (owner decision on #819): this job has no
  # environment:, and a dry run signs for real, because the dry run is the
  # only proof before a release that signing works, and main is reviewed.
  # Accepted while the only write collaborators are the two owners: the two
  # branch paths above, and that a write collaborator can create an
  # installer-v* tag on any commit (tag creation is left open for release.yml,
  # #679) and sign from it. When a third collaborator gets write, put both
  # signing jobs behind the release environment, keyed on github.ref and not
  # on dry_run: a dry dispatch on a fresh tag would otherwise land in release-
  # dry-run, which has no rules, and sign.
  sign-windows:
    needs: [resolve, build-windows]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # OIDC, for google-github-actions/auth: signing federates into Google
    # Cloud KMS with no stored credential. Only this job gets a token — the
    # workflow default stays contents: read.
    permissions:
      contents: read
      id-token: write
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      # Whether the signing step ran, so verify-windows knows whether there
      # is a signature to check (false only on a dry run or under
      # ALLOW_UNSIGNED_WINDOWS, #869).
      signed: ${{ steps.winsign.outputs.ready }}
    steps:
      # For scripts/sign-windows.sh and the committed certificate chain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Into a directory of its own, never the checkout (#817 review): an
      # artifact is a zip any job in this run can write, and extracted over
      # sidecar/ it could replace scripts/sign-windows.sh before that runs
      # with the KMS token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-installer-win32-x64
          path: ${{ runner.temp }}/unsigned

      # The digest travels as a job output, which only build-windows can set;
      # the artifact store is writable by every job in this run. Exactly one
      # regular file, that digest, and only then a copy into place.
      - name: Verify the installer
        working-directory: sidecar
        env:
          SHA256: ${{ needs.build-windows.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build-windows reported no digest"; exit 1; }
          in="${RUNNER_TEMP}/unsigned"
          if [ "$(find "$in" -mindepth 1 -print)" != "${in}/Jarvis-Setup.exe" ] || [ -L "${in}/Jarvis-Setup.exe" ] || [ ! -f "${in}/Jarvis-Setup.exe" ]; then
            echo "::error::the unsigned-installer-win32-x64 artifact is not exactly one file, Jarvis-Setup.exe"
            exit 1
          fi
          echo "${SHA256}  ${in}/Jarvis-Setup.exe" | sha256sum -c -
          install -m 0644 "${in}/Jarvis-Setup.exe" Jarvis-Setup.exe

      # Windows signing needs BOTH the KMS keyring variable AND the issued
      # certificate chain in the repo. They arrive at DIFFERENT times: the
      # Sectigo CSR is generated FROM the KMS key, so the keyring necessarily
      # exists days before the certificate does -- so this checks the chain
      # file too, and says which of the two is missing.
      #
      # A real run missing either one FAILS here (#869). It used to warn and
      # carry on, and since every signing and verification step follows this
      # decision, a release then shipped an UNSIGNED Jarvis-Setup.exe with nothing
      # but a warning in a green run. Shipping unsigned is now a recorded
      # choice: set the repository variable ALLOW_UNSIGNED_WINDOWS to exactly
      # `true` and the run warns and continues as it used to. A dry run
      # still only warns, so a rehearsal needs no signing configuration.
      # release-exec.test.sh runs this script verbatim against every case.
      - name: Windows signing readiness
        id: winsign
        env:
          GCP_KMS_KEYRING: ${{ vars.GCP_KMS_KEYRING }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "${GCP_KMS_KEYRING}" ]; then
            missing="Windows signing is not configured (GCP_KMS_KEYRING unset)"
            fix="Set the GCP_KMS_KEYRING repository variable"
          elif [ ! -f sidecar/packaging/windows/codesign-chain.pem ]; then
            missing="GCP_KMS_KEYRING is set but sidecar/packaging/windows/codesign-chain.pem is missing -- the certificate has not been issued/committed yet"
            fix="Issue the certificate and commit sidecar/packaging/windows/codesign-chain.pem"
          fi
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ "${ALLOW_UNSIGNED_WINDOWS}" = "true" ]; then
              echo "::warning::ALLOW_UNSIGNED_WINDOWS is set but signing is configured, so it changed nothing this run. Delete the variable, or the next missing signing config ships an UNSIGNED Jarvis-Setup.exe instead of failing."
            fi
          elif [ "${DRY_RUN}" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${missing}. This dry run continues and builds an UNSIGNED Jarvis-Setup.exe; a real release would stop here unless ALLOW_UNSIGNED_WINDOWS is true."
          elif [ "${ALLOW_UNSIGNED_WINDOWS}" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${missing}. Shipping an UNSIGNED Jarvis-Setup.exe because ALLOW_UNSIGNED_WINDOWS is true (SmartScreen will block it)."
          else
            echo "::error::${missing}, so this release would ship an UNSIGNED Jarvis-Setup.exe. ${fix}, or set the repository variable ALLOW_UNSIGNED_WINDOWS to true to ship unsigned on purpose."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: gcp-auth
        if: steps.winsign.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SIGNING_SERVICE_ACCOUNT }}
          token_format: "access_token"
          # Only access_token is used. The default (true) writes a
          # gha-creds-*.json into the workspace that carries what is needed
          # to mint further OIDC tokens; nothing here reads it (#779, as #682
          # did for the sidecar).
          create_credentials_file: false

      # --defer-verify (#817): the check needs osslsigncode, an apt package,
      # and apt maintainer scripts run as root beside this job's OIDC token.
      # verify-windows runs it instead, and publish waits for it.
      - name: Sign installer (Cloud KMS)
        if: steps.winsign.outputs.ready == 'true'
        working-directory: sidecar
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GCP_KMS_KEYRING: ${{ vars.GCP_KMS_KEYRING }}
          GCP_KMS_KEY_ALIAS: ${{ vars.GCP_KMS_KEY_ALIAS }}
        run: scripts/sign-windows.sh --defer-verify Jarvis-Setup.exe

      # The SIGNED installer's digest: signing changes the bytes, and publish
      # takes the artifact only by this.
      - name: Digest
        id: digest
        working-directory: sidecar
        run: echo "sha256=$(sha256sum Jarvis-Setup.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-win32-x64
          path: sidecar/Jarvis-Setup.exe
          if-no-files-found: error

  # --- Windows: post-sign verification (no OIDC) ---
  # #817. The check needs osslsigncode, which comes from apt, and apt runs
  # package maintainer scripts as root: in sign-windows they ran beside the
  # Workload Identity token, so a mirror or archive compromise reached the
  # KMS signing identity. Here nothing can mint a token. The installer is
  # taken by the digest sign-windows reported, which is also what publish
  # checks, so what is verified here is what ships; and publish waits for
  # this job. sign-windows.sh --verify-only fails when osslsigncode is
  # missing, so dropping the install cannot turn into a skipped check.
  verify-windows:
    needs: [resolve, sign-windows]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # For scripts/sign-windows.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outside the checkout, as in sign-windows: extracted over sidecar/, an
      # artifact could replace the script that does the checking.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-win32-x64
          path: ${{ runner.temp }}/signed

      - name: Verify the signed installer digest
        env:
          SHA256: ${{ needs.sign-windows.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sign-windows reported no digest"; exit 1; }
          in="${RUNNER_TEMP}/signed"
          if [ "$(find "$in" -mindepth 1 -print)" != "${in}/Jarvis-Setup.exe" ] || [ -L "${in}/Jarvis-Setup.exe" ] || [ ! -f "${in}/Jarvis-Setup.exe" ]; then
            echo "::error::the installer-win32-x64 artifact is not exactly one file, Jarvis-Setup.exe"
            exit 1
          fi
          echo "${SHA256}  ${in}/Jarvis-Setup.exe" | sha256sum -c -

      # #869, checked again in a job that holds no token: the signer decides
      # whether to sign, and this refuses its answer when a real run without
      # ALLOW_UNSIGNED_WINDOWS says it did not, so a mistake in that decision
      # cannot reach the publish on its own. An empty answer (the signer did
      # not say) is a refusal too.
      - name: Refuse an unsigned binary on a real run
        env:
          SIGNED: ${{ needs.sign-windows.outputs.signed }}
          ALLOW_UNSIGNED_WINDOWS: ${{ vars.ALLOW_UNSIGNED_WINDOWS }}
        run: |
          set -euo pipefail
          if [ "${SIGNED}" != "true" ] && [ "${DRY_RUN}" != "true" ] && [ "${ALLOW_UNSIGNED_WINDOWS}" != "true" ]; then
            echo "::error::sign-windows did not sign Jarvis-Setup.exe, and this is a real run without ALLOW_UNSIGNED_WINDOWS set to true, so it would ship unsigned. See its Windows signing readiness step."
            exit 1
          fi

      - name: Install osslsigncode
        if: needs.sign-windows.outputs.signed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y osslsigncode

      - name: Verify the Authenticode signature
        if: needs.sign-windows.outputs.signed == 'true'
        working-directory: sidecar
        env:
          # The installer must carry OUR publisher: the same identity it then
          # pins in the payloads it downloads. Empty fails a real run unless
          # ALLOW_UNPINNED_WINDOWS is true (#922); the signer leaf is pinned
          # either way, from the committed chain (#871).
          SIGNING_PUBLISHER_CN: ${{ vars.SIGNING_PUBLISHER_CN }}
          ALLOW_UNPINNED_WINDOWS: ${{ vars.ALLOW_UNPINNED_WINDOWS }}
          # Sectigo's roots are publicly trusted, so demand the FULL
          # verification (osslsigncode exit 0), and a check that runs at all.
          # This is the script's default too; stated here so the release
          # posture is visible at the workflow.
          SIGN_REQUIRE_TRUSTED_CHAIN: "1"
        run: |
          set -euo pipefail
          ../.github/scripts/require-signing-pin.sh SIGNING_PUBLISHER_CN ALLOW_UNPINNED_WINDOWS Jarvis-Setup.exe
          scripts/sign-windows.sh --verify-only "${RUNNER_TEMP}/signed/Jarvis-Setup.exe"

  # --- macOS: universal binary -> Install Jarvis.app (unsigned) ----
  # Builds and holds no Apple secret (#870): go, cgo, clang, lipo and make
  # run here, and the unsigned app crosses to sign-macos as a tar with its
  # digest as a job output, as build-windows hands to sign-windows (#779).
  build-macos:
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Actions cache is writable by any run on main, and Go reuses
          # cached modules and build output without re-verifying them (#681).
          cache: false
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - name: Build universal installer app
        working-directory: sidecar
        env:
          CGO_ENABLED: "1"
          # Checked by resolve (#818); read from its output, not the file.
          INSTALLER_VERSION: ${{ needs.resolve.outputs.version }}
          # Pins the Developer ID team whose payloads this installer accepts.
          # Empty fails a real run unless ALLOW_UNPINNED_MACOS is exactly
          # true; a dry run warns (#922).
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNPINNED_MACOS: ${{ vars.ALLOW_UNPINNED_MACOS }}
        run: |
          set -euo pipefail
          ../.github/scripts/require-signing-pin.sh APPLE_TEAM_ID ALLOW_UNPINNED_MACOS "Install Jarvis.app"
          LDFLAGS="-s -w -X main.installerVersion=${INSTALLER_VERSION}"
          LDFLAGS="$LDFLAGS -X 'github.com/jarvis/sidecar/internal/update.expectedTeamID=${APPLE_TEAM_ID}'"
          CC="clang -target arm64-apple-macos11"  CXX="clang++ -target arm64-apple-macos11" \
            GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o /tmp/installer-arm64 ./installer/
          CC="clang -target x86_64-apple-macos11" CXX="clang++ -target x86_64-apple-macos11" \
            GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o /tmp/installer-amd64 ./installer/
          for b in /tmp/installer-arm64 /tmp/installer-amd64; do
            strings "$b" > /tmp/installer-strings.txt
            if [ -n "${APPLE_TEAM_ID}" ] && ! grep -qF "${APPLE_TEAM_ID}" /tmp/installer-strings.txt; then
              echo "::error::team id pin '${APPLE_TEAM_ID}' is not present in $b; check the -X path"
              exit 1
            fi
          done
          lipo -create -output jarvis-setup /tmp/installer-arm64 /tmp/installer-amd64
          lipo -info jarvis-setup
          packaging/macos/make-icns.sh
          make app-macos-installer BIN_INSTALLER=./jarvis-setup

      # tar, not the bare bundle: upload-artifact strips exec bits and
      # symlinks. COPYFILE_DISABLE + --no-mac-metadata keep bsdtar from
      # archiving xattrs as AppleDouble (._*) entries inside the bundle.
      - name: Package Install Jarvis.app
        working-directory: sidecar
        run: COPYFILE_DISABLE=1 tar --no-mac-metadata -C dist/macos -czf install-jarvis-app.tar.gz "Install Jarvis.app"

      # shasum: macOS has it, and not always sha256sum. Same hex either way.
      - name: Digest
        id: digest
        working-directory: sidecar
        run: |
          set -euo pipefail
          sum="$(shasum -a 256 install-jarvis-app.tar.gz)"
          echo "sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      # Not under the installer-* name: that is the signed DMG, which only
      # sign-macos uploads and publish downloads by that pattern.
      - name: Upload unsigned installer app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer-darwin
          path: sidecar/install-jarvis-app.tar.gz
          if-no-files-found: error
          retention-days: 1

  # --- macOS: Developer ID sign, notarize, staple, DMG (#870) -----
  # The only job here that reads the Apple secrets, and it builds nothing,
  # installs nothing and checks nothing out: it takes the app build-macos
  # reported by digest, signs, notarizes and staples it, wraps it in the DMG
  # with hdiutil directly (never make, which would run the Makefile beside
  # the secrets), and signs, notarizes and staples that. The DMG crosses to
  # publish with its digest as this job output.
  #
  # A real run that cannot sign FAILS here (#921), as #869 made Windows: see
  # the readiness step. verify-macos then checks, in a job holding no
  # secret, that the DMG and the app in it are signed by our team, and
  # publish waits for it.
  sign-macos:
    needs: [resolve, build-macos]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
      # Whether the signing step ran, so verify-macos knows whether there is
      # a signature to check (false only on a dry run or under
      # ALLOW_UNSIGNED_MACOS, #921).
      signed: ${{ steps.applesign.outputs.ready }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-installer-darwin
          path: ${{ runner.temp }}/unsigned

      # The digest travels as a job output, which only build-macos can set;
      # the artifact store is writable by every job in this run. Exactly one
      # regular file, that digest, and only then anything reads it.
      - name: Verify the installer app
        env:
          SHA256: ${{ needs.build-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build-macos reported no digest"; exit 1; }
          in="${RUNNER_TEMP}/unsigned"
          if [ "$(find "$in" -mindepth 1 -print)" != "${in}/install-jarvis-app.tar.gz" ] || [ -L "${in}/install-jarvis-app.tar.gz" ] || [ ! -f "${in}/install-jarvis-app.tar.gz" ]; then
            echo "::error::the unsigned-installer-darwin artifact is not exactly one file, install-jarvis-app.tar.gz"
            exit 1
          fi
          echo "${SHA256}  ${in}/install-jarvis-app.tar.gz" | shasum -a 256 -c -

      # The archive holds Install Jarvis.app and nothing else: no member
      # outside it, no absolute path, no .., nothing but files and
      # directories, and once unpacked no link, device, fifo or file with a
      # second name. /usr/bin/tar by path: on macOS that is bsdtar.
      - name: Unpack the installer app
        run: |
          set -euo pipefail
          export LC_ALL=C
          tgz="${RUNNER_TEMP}/unsigned/install-jarvis-app.tar.gz"
          dest="${RUNNER_TEMP}/work"
          names="$(/usr/bin/tar -tzf "$tgz")"
          while IFS= read -r m; do
            if ! [[ "$m" =~ ^Install\ Jarvis\.app(/|$) ]] || [[ "$m" =~ (^|/)\.\.(/|$) ]]; then
              printf '::error::the installer app archive holds %q, outside Install Jarvis.app\n' "$m"
              exit 1
            fi
          done <<<"$names"
          while IFS= read -r m; do
            if [[ "$m" != [-d]* ]] || [[ "$m" == *" link to "* ]] || [[ "$m" == *" -> "* ]]; then
              printf '::error::the installer app archive holds a member that is not a plain file or directory: %q\n' "$m"
              exit 1
            fi
          done < <(/usr/bin/tar -tvzf "$tgz")
          mkdir -p "$dest"
          /usr/bin/tar -xzf "$tgz" -C "$dest"
          if [ "$(find "$dest" -mindepth 1 -maxdepth 1 -print)" != "${dest}/Install Jarvis.app" ] || [ -n "$(find "$dest" -mindepth 1 -not -type d -not -type f -print)" ] || [ -n "$(find "$dest" -type f -links +1 -print)" ]; then
            echo "::error::the installer app is not Install Jarvis.app alone, of plain files and directories"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/out"

      # Signing needs all five Apple secrets. A real run missing them FAILS
      # here (#921). It used to warn and carry on, and a release then shipped
      # an UNSIGNED Install-Jarvis.dmg, which Gatekeeper refuses to open on
      # recent macOS, in a green run. Shipping unsigned is now a recorded
      # choice: set the repository variable ALLOW_UNSIGNED_MACOS to exactly
      # `true`. A dry run still only warns, so a rehearsal needs no signing
      # configuration. APPLE_CERT_P12 set with another secret missing is a
      # broken configuration, and fails every run, dry or not, as it did
      # before. The secrets reach this step only as whether each is set,
      # never their values. release-exec.test.sh runs this script verbatim
      # against every case.
      - name: macOS signing readiness
        id: applesign
        env:
          HAVE_APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 != '' }}
          HAVE_APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD != '' }}
          HAVE_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAVE_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAVE_ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 != '' }}
          ALLOW_UNSIGNED_MACOS: ${{ vars.ALLOW_UNSIGNED_MACOS }}
        run: |
          set -euo pipefail
          absent=""
          [ "${HAVE_APPLE_CERT_P12}" = "true" ] || absent="${absent:+${absent}, }APPLE_CERT_P12"
          [ "${HAVE_APPLE_CERT_PASSWORD}" = "true" ] || absent="${absent:+${absent}, }APPLE_CERT_PASSWORD"
          [ "${HAVE_ASC_KEY_ID}" = "true" ] || absent="${absent:+${absent}, }ASC_KEY_ID"
          [ "${HAVE_ASC_ISSUER_ID}" = "true" ] || absent="${absent:+${absent}, }ASC_ISSUER_ID"
          [ "${HAVE_ASC_API_KEY_P8}" = "true" ] || absent="${absent:+${absent}, }ASC_API_KEY_P8"
          if [ -z "$absent" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ "${ALLOW_UNSIGNED_MACOS}" = "true" ]; then
              echo "::warning::ALLOW_UNSIGNED_MACOS is set but signing is configured, so it changed nothing this run. Delete the variable, or the next missing signing secret ships an UNSIGNED Install-Jarvis.dmg instead of failing."
            fi
          elif [ "${HAVE_APPLE_CERT_P12}" = "true" ]; then
            echo "::error::APPLE_CERT_P12 is set but ${absent} is not, so signing cannot complete. Set the missing secret."
            exit 1
          elif [ "${DRY_RUN}" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing is not configured (${absent} unset). This dry run continues and builds an UNSIGNED Install-Jarvis.dmg; a real release would stop here unless ALLOW_UNSIGNED_MACOS is true."
          elif [ "${ALLOW_UNSIGNED_MACOS}" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing is not configured (${absent} unset). Shipping an UNSIGNED Install-Jarvis.dmg because ALLOW_UNSIGNED_MACOS is true (Gatekeeper will refuse to open it)."
          else
            echo "::error::macOS signing is not configured (${absent} unset), so this release would ship an UNSIGNED Install-Jarvis.dmg, which Gatekeeper refuses to open. Set the Apple signing secrets, or set the repository variable ALLOW_UNSIGNED_MACOS to true to ship unsigned on purpose."
            exit 1
          fi

      - name: Sign, notarize and staple
        if: steps.applesign.outputs.ready == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # The keychain, under RUNNER_TEMP, is deleted and the search list
          # put back on the way out, so the identity is not usable by later
          # steps of this job (#870 review).
          cert="${RUNNER_TEMP}/cert.p12"
          key="${RUNNER_TEMP}/asc_key.p8"
          kc="${RUNNER_TEMP}/sign.keychain-db"
          trap 'rm -f "$cert" "$key"; security list-keychains -d user -s login.keychain || true; security delete-keychain "$kc" || true' EXIT
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          (umask 077; printf '%s' "$APPLE_CERT_P12" | base64 -d > "$cert")
          security import "$cert" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$cert"
          (umask 077; printf '%s' "$ASC_API_KEY_P8" > "$key")
          # Nothing after this line needs the values, so no program it starts
          # inherits them (the ones above did, and are Apple and system tools).
          unset APPLE_CERT_P12 APPLE_CERT_PASSWORD ASC_API_KEY_P8
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain
          IDENTITY="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY" || { echo "::error::no 'Developer ID Application' identity in APPLE_CERT_P12"; exit 1; }

          APP="${RUNNER_TEMP}/work/Install Jarvis.app"

          # notarytool exit codes are not reliable on an Invalid verdict, and
          # under pipefail a failing submit would end the step before its log
          # is printed (#870 review): the JSON status decides, as in the
          # sidecar signer.
          # No --entitlements: the installer needs no hardened-runtime
          # capabilities (it never captures audio/screen -- see the sidecar's
          # entitlements.plist, which is deliberately NOT reused here).
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "${RUNNER_TEMP}/InstallJarvis.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/InstallJarvis.zip" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "${RUNNER_TEMP}/notary-app.json" || true
          APP_ID="$(jq -r '.id // empty' "${RUNNER_TEMP}/notary-app.json")"
          if [ "$(jq -r '.status // empty' "${RUNNER_TEMP}/notary-app.json")" != "Accepted" ]; then
            [ -n "$APP_ID" ] && xcrun notarytool log "$APP_ID" \
              --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::installer app notarization failed"; exit 1
          fi
          xcrun stapler staple "$APP"

          # The DMG is what users download, so it is signed, notarized and
          # stapled in its own right -- a stapled ticket inside is not enough.
          DMG="${RUNNER_TEMP}/out/Install-Jarvis.dmg"
          hdiutil create -volname "Install Jarvis" -srcfolder "$APP" -format UDZO -ov "$DMG"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "${RUNNER_TEMP}/notary-dmg.json" || true
          DMG_ID="$(jq -r '.id // empty' "${RUNNER_TEMP}/notary-dmg.json")"
          if [ "$(jq -r '.status // empty' "${RUNNER_TEMP}/notary-dmg.json")" != "Accepted" ]; then
            [ -n "$DMG_ID" ] && xcrun notarytool log "$DMG_ID" \
              --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::installer DMG notarization failed"; exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      # Only where the readiness step allowed it: a dry run, or
      # ALLOW_UNSIGNED_MACOS on a real one. It said why.
      - name: Build unsigned DMG
        if: steps.applesign.outputs.ready != 'true'
        run: |
          set -euo pipefail
          hdiutil create -volname "Install Jarvis" -srcfolder "${RUNNER_TEMP}/work/Install Jarvis.app" -format UDZO -ov "${RUNNER_TEMP}/out/Install-Jarvis.dmg"

      # The digest of exactly the file the upload below takes, as the output
      # of this job alone.
      - name: Digest
        id: digest
        run: |
          set -euo pipefail
          sum="$(shasum -a 256 "${RUNNER_TEMP}/out/Install-Jarvis.dmg")"
          echo "sha256=${sum%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-darwin
          path: ${{ runner.temp }}/out/Install-Jarvis.dmg
          if-no-files-found: error

  # --- macOS: post-sign verification (no secret, no OIDC) (#921) --
  # The signer runs codesign --verify, which accepts a signature by ANY
  # identity. This job holds none of the signing credentials, takes the DMG
  # by the digest sign-macos reported (what publish checks too, so what is
  # checked here is what ships), refuses an unsigned answer on a real run
  # without ALLOW_UNSIGNED_MACOS (a second gate, as #869 has for Windows),
  # and checks the DMG and the app inside it as their users will: our
  # Developer ID team, a stapled ticket and Gatekeeper. publish waits for
  # it. Only tools macOS ships are used.
  verify-macos:
    needs: [resolve, sign-macos]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # For require-signing-pin.sh and verify-macos-signature.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Outside the checkout: extracted over it, an artifact could replace
      # the scripts that do the checking.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-darwin
          path: ${{ runner.temp }}/signed

      - name: Verify the signed DMG digest
        env:
          SHA256: ${{ needs.sign-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sign-macos reported no digest"; exit 1; }
          in="${RUNNER_TEMP}/signed"
          if [ "$(find "$in" -mindepth 1 -print)" != "${in}/Install-Jarvis.dmg" ] || [ -L "${in}/Install-Jarvis.dmg" ] || [ ! -f "${in}/Install-Jarvis.dmg" ]; then
            echo "::error::the installer-darwin artifact is not exactly one file, Install-Jarvis.dmg"
            exit 1
          fi
          echo "${SHA256}  ${in}/Install-Jarvis.dmg" | shasum -a 256 -c -

      # #921, checked again in a job that holds no secret: an empty answer
      # (the signer did not say) is a refusal too.
      - name: Refuse an unsigned bundle on a real run
        env:
          SIGNED: ${{ needs.sign-macos.outputs.signed }}
          ALLOW_UNSIGNED_MACOS: ${{ vars.ALLOW_UNSIGNED_MACOS }}
        run: |
          set -euo pipefail
          if [ "${SIGNED}" != "true" ] && [ "${DRY_RUN}" != "true" ] && [ "${ALLOW_UNSIGNED_MACOS}" != "true" ]; then
            echo "::error::sign-macos did not sign Install-Jarvis.dmg, and this is a real run without ALLOW_UNSIGNED_MACOS set to true, so it would ship unsigned. See its macOS signing readiness step."
            exit 1
          fi

      # The DMG and the app in it must carry OUR team, the one the installer
      # links in as its pin. Empty fails a real run unless
      # ALLOW_UNPINNED_MACOS is true (#922).
      - name: Verify the Developer ID signature and team
        if: needs.sign-macos.outputs.signed == 'true'
        working-directory: sidecar
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ALLOW_UNPINNED_MACOS: ${{ vars.ALLOW_UNPINNED_MACOS }}
        run: |
          set -euo pipefail
          ../.github/scripts/require-signing-pin.sh APPLE_TEAM_ID ALLOW_UNPINNED_MACOS "Install-Jarvis.dmg"
          ../.github/scripts/verify-macos-signature.sh dmg "${RUNNER_TEMP}/signed/Install-Jarvis.dmg"

  # ─── Publish ───────────────────────────────────────────────────
  publish:
    needs: [resolve, sign-windows, verify-windows, sign-macos, verify-macos]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # The gate (#920). Until now this job held `contents: write` with no
    # environment at all, so a tag push or a dispatch from ANY branch could
    # publish to `installer-latest` with nobody approving it -- including a
    # branch whose copy of this workflow had dropped #919's refusal to ship an
    # unsigned Windows binary. `publish-sidecar` has been gated since #756;
    # the installer never was.
    #
    # A dry run names a DIFFERENT environment, because naming one records a
    # deployment against it, and a rehearsal would otherwise show as the live
    # installer. Only `github`, `inputs`, `vars`, `needs`, `strategy` and
    # `matrix` are allowed in an environment name -- NOT `env`, so this reads
    # `inputs.dry_run` rather than the DRY_RUN env the steps use. On a tag push
    # `inputs.dry_run` is unset, which is not `true`, so a tag push gets
    # `release` and its approval.
    environment:
      name: ${{ inputs.dry_run == true && 'release-dry-run' || 'release' }}
    permissions:
      contents: write
    steps:
      - name: Download built installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: artifacts

      # Exactly what sign-windows and sign-macos signed (#779, #870): their
      # digests arrive as job outputs, and the artifacts could have been
      # replaced by any job in this run since. Exactly these two files, too:
      # `pattern: installer-*` would fetch any other artifact so named.
      - name: Verify the installers
        env:
          SHA_WIN32_X64: ${{ needs.sign-windows.outputs.sha256 }}
          SHA_DARWIN: ${{ needs.sign-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          for v in SHA_WIN32_X64 SHA_DARWIN; do
            [[ "${!v}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no digest was reported for ${v#SHA_}"; exit 1; }
          done
          cd artifacts
          got="$(find . -mindepth 1 -not -type d | sort)"
          want="$(printf '%s\n' ./installer-darwin/Install-Jarvis.dmg ./installer-win32-x64/Jarvis-Setup.exe)"
          if [ "$got" != "$want" ] || [ -n "$(find . -mindepth 1 -not -type d -not -type f -print -quit)" ]; then
            echo "::error::the downloaded installer artifacts are not exactly the two that were built"
            printf '%s\n' "$got"
            exit 1
          fi
          printf '%s  %s\n' "$SHA_WIN32_X64" installer-win32-x64/Jarvis-Setup.exe "$SHA_DARWIN" installer-darwin/Install-Jarvis.dmg |
            sha256sum --strict -c -

      - name: Stage release assets
        env:
          INSTALLER_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          # Unversioned asset names: the website links to
          # releases/download/installer-latest/<name>, which must never change.
          cp artifacts/installer-win32-x64/Jarvis-Setup.exe release/
          cp artifacts/installer-darwin/Install-Jarvis.dmg release/
          (cd release && sha256sum * > SHA256SUMS)
          ls -lh release/

      # Immutable, per-version — history and rollback.
      - name: Publish versioned release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: installer-v${{ needs.resolve.outputs.version }}
          name: Installer v${{ needs.resolve.outputs.version }}
          # Never displace the brain's release as the repo's "Latest".
          make_latest: "false"
          draft: false
          files: |
            release/Jarvis-Setup.exe
            release/Install-Jarvis.dmg
            release/SHA256SUMS

      # Rolling pointer — the website's permanent download URLs.
      - name: Update installer-latest
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: installer-latest
          name: Installer (latest)
          body: |
            Rolling release: always the newest Jarvis desktop installer.
            Currently **v${{ needs.resolve.outputs.version }}**.

            Permanent download URLs (safe to link from the website):
            - `releases/download/installer-latest/Jarvis-Setup.exe`
            - `releases/download/installer-latest/Install-Jarvis.dmg`
          make_latest: "false"
          draft: false
          files: |
            release/Jarvis-Setup.exe
            release/Install-Jarvis.dmg
            release/SHA256SUMS

      # The version through env:, never as ${{ }} in the script (#818).
      - name: Dry-run summary
        if: env.DRY_RUN == 'true'
        env:
          INSTALLER_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          echo "::notice::DRY RUN -- built and signed installer v${INSTALLER_VERSION} without publishing"
          ls -lh release/
