app_name: Slack
domains:
  - app.slack.com
  - slack.com
keywords:
  - huddle
description: Slack web — send channel messages and DMs, reply in threads, react with emoji, edit/delete/save messages, search, set status, upload files, check unreads/activity, switch workspaces.
version: 2
instructions: |
  URL: https://app.slack.com

  ### RULES (stated once — MUST follow)
  1. ONLY use: browser_navigate, browser_snapshot, browser_click, browser_type, browser_hover, browser_press_key, browser_scroll, browser_upload_file. browser_evaluate and browser_screenshot are BANNED. No desktop, sidecar, or shell tools.
  2. NEVER send to the wrong recipient: before typing any message, snapshot and confirm the channel/DM name in the conversation header matches the intended target. This is the #1 rule.
  3. ONE browser_snapshot after each state-changing action to verify. Not zero, not two.
  4. If an element is not found after 2 retries, tell the user what you see and stop. No workarounds.
  5. [id] numbers change on EVERY snapshot — never reuse an id from an earlier snapshot. Match by role, aria-label, or text.
  6. LOCALE: labels below are from the ENGLISH UI; on other locales match by role/structure (the composer is the contenteditable textbox at the bottom of the conversation pane). Sidebar channel/DM names are user-set and stable in any locale; section headers and button labels are translated.
  7. browser_type CLEARS the target element before typing by default. Use append:true whenever you are ADDING to existing text (multi-line messages, captions next to a file chip). Replace-by-default is what you want when rewriting a message in the edit box.
  8. Chrome-reserved shortcuts never reach the page — no keyboard workspace switching, no new-window/new-tab keys; use clicks for those. In-page keys that DO work via browser_press_key: "Enter", "Shift+Enter", "Escape", "Ctrl+K" (Slack intercepts it).
  9. Budgets: send a message ≈ 6 tool calls; hover-based message actions ≈ 8; search ≈ 4. At 2x the budget, stop and tell the user.

  ### State Recognition — check after every browser_navigate
  - **Logged out**: you land on slack.com marketing/sign-in pages (pricing links, "Sign in" button) instead of the app. -> Tell the user to sign in to Slack in the JARVIS browser first; stop. NEVER type credentials or codes yourself — any password/SSO-provider/verification-code screen means tell the user and stop.
  - **Workspace picker**: a list of the user's workspaces with per-workspace open/launch links [LIVE-VERIFY exact label]. Click the intended workspace's link; if the target workspace is ambiguous, ask the user.
  - **"Open the desktop app?" interstitial**: a page offering to launch Slack in the app, with a browser fallback link — click the link with text like "use Slack in your browser" [LIVE-VERIFY exact text].
  - **Loading skeleton**: sparse snapshot, placeholder blocks, no composer. -> Re-snapshot (max 2 retries), then tell the user.
  - **Ready**: the message composer (contenteditable textbox, aria-label like "Message #channel-name") is present.

  ### Layout & elements [LIVE-VERIFY all labels below against a real snapshot]
  - **Workspace rail** (far-left column): one icon button/link per signed-in workspace, labeled with the workspace name [LIVE-VERIFY rail structure]. Click an icon to switch workspaces.
  - **Sidebar** (left): view entries — "Threads", "Huddles", "Later" (saved items), "Drafts & sent", "Activity", "Unreads" [LIVE-VERIFY which entries this workspace shows] — then the "Channels" section with `link "# channel-name"` entries and "Direct messages" with person-name links.
  - **Top search bar**: button/input at the top, aria-label like "Search [workspace]" [LIVE-VERIFY].
  - **Conversation header**: the channel/DM name at the top of the main pane — your rule-2 verification anchor.
  - **Composer**: contenteditable textbox at the bottom, aria-label "Message #channel" / "Message [person]". Around it: an attach "+" button [LIVE-VERIFY], emoji button, and a **Send button** (paper-plane icon, aria-label containing "Send" — localized) [LIVE-VERIFY]. Clicking Send is a first-class way to send.
  - **Messages**: read/verify message text via the Page Text section. Per-message action buttons (Add reaction, Reply in thread, More actions, Save) are HOVER-RENDERED: they are NOT in the DOM until you browser_hover the message row, and appear only in a snapshot taken AFTER the hover. Hover, snapshot, act immediately.

  ### Navigate to a channel or DM (precedes every message task)
  1. browser_snapshot. If the target channel/DM link is visible in the sidebar, click it.
  2. If not visible: browser_scroll the sidebar and re-check, or click the top search bar, type the name, and click the matching channel/person result.
  3. Secondary path — quick switcher: browser_press_key "Ctrl+K"; snapshot; browser_type the name into the switcher input (NO submit); snapshot to inspect the results; click the correct result (or press "Enter" only after confirming the top result is the right one — the switcher is fuzzy and "john" may match several people).
  4. Snapshot: confirm the conversation header shows the intended target (rule 2). Only then act.

  ### TASK: Send a message (channel or DM)
  1. Navigate to the target; verify the header.
  2. Click the composer; browser_type the text with submit:true — plain Enter sends in Slack's default setting. Equally good: browser_type without submit, then click the Send button.
  3. Snapshot: the message text appears in Page Text at the bottom of the conversation. If absent, take ONE more snapshot; if still absent, tell the user — do NOT retype (double-send risk).
  Caveat: if the user set Slack's Enter preference to "start a new line", submit:true inserts a newline instead of sending — the snapshot then shows your text still inside the composer. In that case click the Send button.

  ### TASK: Send a multi-line message
  browser_type clears by default, so every line after the first MUST use append:true or the previous lines are destroyed:
  1. Click the composer; browser_type the first line (NO submit).
  2. browser_press_key "Shift+Enter".
  3. browser_type the next line with append:true. Repeat steps 2-3 per line.
  4. Send: browser_press_key "Enter" or click the Send button. Snapshot to verify.

  ### TASK: React to a message with an emoji
  1. Navigate; snapshot; locate the target message by its text in Page Text (browser_scroll up if needed).
  2. browser_hover the message row; snapshot — the hover toolbar is now present.
  3. Click "Add reaction" [LIVE-VERIFY label] (smiley icon); snapshot — an emoji picker with a search input opens.
  4. browser_type the emoji name (e.g. "thumbsup") into the picker search; snapshot; click the emoji.
  5. Snapshot: a reaction pill now shows under the message.

  ### TASK: Reply in a thread
  1. Navigate; locate the parent message in Page Text.
  2. browser_hover the message row; snapshot; click "Reply in thread" [LIVE-VERIFY label].
  3. Snapshot: the thread pane opens on the RIGHT with its OWN composer (placeholder like "Reply…") — never reuse the main composer for a thread reply.
  4. Click the THREAD composer; browser_type the reply with submit:true (or click the thread pane's Send button).
  5. Snapshot: the reply appears in the thread pane.

  ### TASK: Save (bookmark) a message for later
  1. Hover the message; snapshot; click the "Save for later" bookmark button if it is in the hover toolbar, otherwise click "More actions" and then the save item in the menu [LIVE-VERIFY which of the two].
  2. Snapshot to confirm a saved indicator/confirmation. Saved items live under the "Later" sidebar entry.

  ### TASK: Edit your own message
  1. Hover YOUR message; snapshot; click "More actions" (three-dots); snapshot; click "Edit message" [LIVE-VERIFY label].
  2. An edit box opens pre-filled with the old text. browser_type the FULL corrected text — replace-by-default clears the box first, which is exactly right here.
  3. browser_press_key "Enter" (or click the edit box's save/confirm control); snapshot — Page Text shows the new text with an "(edited)" marker.

  ### TASK: Delete your own message
  1. Hover YOUR message; snapshot; click "More actions"; snapshot; click the delete menu item [LIVE-VERIFY label].
  2. A confirmation dialog opens. Click the confirming delete control INSIDE the dialog — match it by its aria-label/text, never by position.
  3. Snapshot: the message text is GONE from Page Text. If the text is still present, the deletion did not happen — tell the user; never report success on an unchanged page.

  ### TASK: Check unreads / threads / activity / DMs
  Click the matching sidebar entry ("Unreads", "Threads", "Activity", "DMs"/"Direct messages" [LIVE-VERIFY names]); snapshot; report from Page Text. Note: viewing a channel marks it read automatically — opening things clears badges.

  ### TASK: Search messages
  1. Click the top search bar; browser_type the query with submit:true; snapshot the results; click a result to jump to it in context.
  Modifiers: `from:@user`, `in:#channel`, `before:2026-01-01` / `after:2026-01-01`, `has:link`.

  ### TASK: Upload a file
  1. Navigate to the target conversation; verify the header (rule 2).
  2. Click the "+" attach button next to the composer [LIVE-VERIFY]; snapshot. If a menu appears, click "Upload from your computer" [LIVE-VERIFY label].
  3. If nothing new appears in the snapshot (the click opened a native OS picker the browser cannot drive), call browser_upload_file("/absolute/path/to/file") directly — it sets the page's hidden file input without any picker. The file MUST already be under the user's home directory; otherwise tell the user to move it there and stop.
  4. Snapshot: a file chip/preview appears in the composer. Verify the chip is there BEFORE sending.
  5. Optionally add a caption (browser_type with append:true so the chip's text box content is preserved); send via the Send button or browser_press_key "Enter"; snapshot to confirm the file message posted.

  ### TASK: Set status
  1. Click your avatar (top-right); snapshot; click "Update your status" [LIVE-VERIFY label]; snapshot.
  2. browser_type the status text into the status input (NO submit); optionally pick an emoji/expiry; click the dialog's Save button; snapshot.

  ### TASK: Switch workspace
  Click the target workspace's icon in the far-left workspace rail [LIVE-VERIFY rail structure]; snapshot; verify the workspace name now shown in the top-left/header. Keyboard workspace switching is impossible in a browser (Chrome-reserved keys).

  ### TASK: Start a huddle
  1. Navigate to the channel/DM; snapshot; click the huddle toggle (headphones icon) in the conversation header — aria-label contains "huddle" [LIVE-VERIFY].
  2. Snapshot to confirm the huddle UI appeared. Huddles may be unavailable on some plans — if no toggle exists, tell the user.

  ### TASK: Slash command / mention someone
  - Slash command: click the composer; browser_type the complete command (e.g. "/remind me at 5pm to send the report") with submit:true; snapshot.
  - Mention: type the whole message INCLUDING "@name" in ONE browser_type call (never "@" and the name in separate calls — the second call would wipe the first without append:true); snapshot — if a name-autocomplete menu is open, click the intended person, then send.
