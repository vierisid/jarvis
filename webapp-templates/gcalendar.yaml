description: Google Calendar — create, edit, delete, search, reschedule events and meetings. Check schedule and free slots, respond to invites, navigate dates/views.
version: 2
instructions: |
  URL: https://calendar.google.com/calendar/u/0/r

  ### RULES (each stated once — they apply everywhere below)
  1. Allowed tools: browser_navigate, browser_snapshot, browser_click, browser_type, browser_press_key, browser_hover, browser_scroll. browser_evaluate and browser_screenshot are BANNED. If the allowed tools cannot do it, stop and report why.
  2. LOCALE RULE: Calendar translates every label to the account language (Italian, Japanese, ...). NEVER match elements by literal text — not English, not any language. Quoted text below is documentation from one locale, NOT a selector. Match by ROLE + structural attributes (expandable, haspopup, modal, multiline, checkbox, focusable focused) + position in the tree + URL patterns + numeric parts of aria descriptions. The only locale-free text: URLs, event titles and emails (user content), digits.
  3. URL-FIRST: views, dates, search, and event creation are all URLs (table below). Before clicking anything, ask "is there a URL for this?"
  4. Create events ONLY via the prefilled /r/eventedit URL. Never click the Create button, never use the Quick Add dialog (opened by pressing q), never click empty grid cells — all three are locale/pixel traps.
  5. browser_type REPLACES the field's content by default — no select-all step needed. submit:true presses Enter after typing; append:true preserves existing content.
  6. Verify by URL + tree state only (URL leaves /r/eventedit after save; event button present/absent in the grid). NEVER verify by toast text — it is locale-dependent.
  7. Relative dates: resolve "tomorrow"/"next Monday" to YYYYMMDD from today's date. If the user gives BOTH a weekday and a date and they disagree, ASK — do not pick silently.
  8. After 2 failed attempts to locate an element, STOP and tell the user what you saw. No workarounds.
  9. Budgets: create ≤4 calls | check day/week ≤2 | search ≤2 | delete ≤6 | edit/RSVP ≤8. Exceeding a budget means you have left the recipe — re-read it.

  ### URL PATTERNS (the backbone — locale-proof, account-proof)
  Base: https://calendar.google.com/calendar/u/0/r   (/u/0/ = first signed-in account; use /u/1/ etc. only if the user says so)
  - Today: /r/day | /r/week | /r/month | /r/agenda (flat list) | /r/year | /r/customday (4-day)
  - Specific date: /r/day/YYYY/M/D | /r/week/YYYY/M/D | /r/month/YYYY/M/D | /r/agenda/YYYY/M/D — NO leading zeros (/r/day/2026/4/7)
  - Search: /r/search?q=QUERY (URL-encoded)
  - New event editor, prefilled: /r/eventedit?PARAMS — params (URL-encode all values):
    - text=TITLE
    - dates=YYYYMMDDTHHmmSS/YYYYMMDDTHHmmSS — local time, no Z. All-day: YYYYMMDD/YYYYMMDD, end date EXCLUSIVE (single day 14 Apr = 20260414/20260415)
    - ctz=IANA_TZ (e.g. Europe/Rome) — pass explicitly whenever the user's timezone is known
    - details=DESCRIPTION | location=LOCATION | add=email1,email2 | crm=AVAILABLE (mark as free)
    - recur=RRULE:FREQ=WEEKLY;BYDAY=MO,WE (encode : ; = as %3A %3B %3D)
    - Example: /r/eventedit?text=Dentist&dates=20260415T150000/20260415T160000&ctz=Europe/Rome
  You CANNOT hand-build /r/eventedit/BASE64 for an existing event — the id is opaque; reach existing events through the grid.

  ### STATE RECOGNITION (check after every snapshot)
  - Not signed in: URL on accounts.google.com or workspace.google.com → tell the user "Google Calendar needs you to sign in manually" and STOP.
  - Loading: <main> without description / no gridcells → snapshot again after a moment, max 2 retries.
  - Grid ready: <main> aria description ends with an event count digit ("Week of X, N events" in the account language) and columnheader/gridcell children exist.
  - Full editor: URL contains /r/eventedit; <main> has the long edit-page description; one textbox near the top holds the title.
  - Peek popup: modal <dialog> whose NAME equals the event title (your own string — locale-free).
  - Search results: URL is /r/search?q=...; <main> description contains the result count.

  ### ELEMENT REFERENCE (from real snapshots; quoted text = one locale's example, never a selector)
  - Event buttons (inside gridcells in day/week/month, flat in agenda/search): aria-label is comma-separated "START to END, TITLE, CREATOR, STATUS, LOCATION, DATE" — parse by comma position, not by words. All-day events start with the locale's "All day," instead of a time range. Subscribed calendars (holidays, birthdays) replace CREATOR, STATUS with "Calendar: NAME" — those events are read-only. STATUS (invites only) is accepted/declined/awaiting/maybe in the account language — position 3; never match its words.
  - A clicked event stays focused (focusable focused) after its peek closes — keyboard shortcuts act on it: "e" opens the full editor, "Delete" removes it.
  - Peek popup (opens when you click an event): modal dialog named = event title; static texts carry date/time/organizer; unanswered invites additionally show a response bar of exactly three adjacent buttons in fixed order Yes / No / Maybe.
  - Full editor (/r/eventedit): title = the textbox whose value equals the event title; start/end DATE = textboxes with date-formatted values ("14 apr 2026"); start/end TIME = comboboxes with time-formatted values; guests = the autocomplete combobox that turns typed emails into chips on Enter; description = the multiline textbox at the bottom (formatting toolbar above it); location = combobox with autocomplete; all-day = the checkbox next to the date row; Meet = the standalone button between guests and location.
  - Save from the full editor: browser_press_key("Ctrl+Enter") — locale-free PRIMARY path. Fallback ONLY if the URL does not leave /r/eventedit: click the primary non-expandable button in the editor's top action bar (the one that is not Cancel and has no haspopup).

  ### TASK: create a simple event (max 4 calls)
  Resolve title, YYYYMMDD date(s), HHmmss times (default duration 1h), timezone. Then:
  1. browser_navigate to the prefilled /r/eventedit URL (params above).
  2. browser_snapshot — verify the URL contains /r/eventedit AND a textbox's value equals your title. Anything wrong → STOP and report; do not save.
  3. browser_press_key("Ctrl+Enter").
  4. browser_snapshot — verify the URL no longer contains /r/eventedit. If it still does, use the structural Save fallback and snapshot once more.
  All-day: dates=YYYYMMDD/YYYYMMDD. Recurring: add recur=RRULE:...

  ### TASK: create with guests / description / location / Meet
  Prefill everything the URL supports (add=, details=, location=). In the editor, only set what the URL cannot:
  - extra guests: click the guests combobox, browser_type(email, submit:true), one call per guest
  - Meet link: click the Meet button, snapshot (the button is replaced by a link display)
  Then save with Ctrl+Enter and verify as above.

  ### TASK: check schedule (day / week / specific date / agenda) — 2 calls
  browser_navigate to the view URL (add /YYYY/M/D for a specific date) → browser_snapshot → read the main description's event count, then list the event button aria-labels. Report.

  ### TASK: am I free at X / find a free slot on a day — 2 calls
  1. browser_navigate to /r/day/YYYY/M/D. 2. browser_snapshot.
  Parse every event button's aria-label for its START-END range (all-day events block nothing unless the user says otherwise). Free slots = the gaps between events inside the user's working window (default 09:00-18:00 unless stated). "Am I free at X": report whether any range overlaps X. "Find a time": report the 2-3 largest gaps as options with start/end times.

  ### TASK: search for events — 2 calls
  browser_navigate to /r/search?q=QUERY → browser_snapshot → read the count from the main description and the result aria-labels. To open one, click its button (peek appears).

  ### TASK: read an event's details
  Navigate to its day → snapshot → click the event button → snapshot the peek (title = dialog name; date/time/organizer = static texts). For full detail (guests, description): browser_press_key("Escape") (peek closes, event stays focused), browser_press_key("e") (full editor opens), snapshot. Leave without saving via Escape.

  ### TASK: edit / reschedule an event (max 8 calls)
  1. browser_navigate to the event's day URL. 2. snapshot. 3. click the event button (peek opens). 4. browser_press_key("Escape") then browser_press_key("e") — full editor opens. 5. snapshot — confirm the URL contains /r/eventedit/.
  6. Edit fields (browser_type replaces content — just click the field and type):
     - title: type the new title into the title textbox
     - date: click the start/end date textbox, browser_type("14/4/2026", submit:true) — then re-check the other date field (it auto-follows)
     - time: click the start/end time combobox, browser_type("3:00PM", submit:true); setting a start auto-moves the end +1h — verify the end before saving
     - guests: guests combobox, one browser_type(email, submit:true) per guest
  7. browser_press_key("Ctrl+Enter"). 8. snapshot — URL left /r/eventedit = saved.

  ### TASK: delete / cancel an event (max 6 calls)
  1. Navigate to the day URL. 2. snapshot. 3. click the event button (focuses it; peek opens). 4. browser_press_key("Escape") — peek closes, event still focused. 5. browser_press_key("Delete") — immediate, NO confirmation dialog. 6. snapshot — that event's aria-label GONE from the grid is the success signal.
  Careful: after deletion, focus jumps to the next event — do not press Delete again. An undo exists for a few seconds, but do not rely on it.

  ### TASK: RSVP to an invite (accept / decline / maybe)
  1. Navigate to the day. 2. snapshot. 3. click the event. 4. snapshot the peek — find the three-button response bar (fixed order Yes / No / Maybe). No bar = you are the organizer or already responded; report that instead. 5. click the matching button. 6. snapshot — the chosen button shows a selected/pressed state; re-navigating to the day shows the new status at aria-label position 3.

  ### TASK: switch view / jump to a date
  Always by URL (/r/week, /r/month/2026/9/1, ...). Keyboard secondary: browser_press_key("t") jumps to today in the current view.

  ### GOTCHAS
  - Encode every eventedit param value (space %20, & %26, : %3A, ; %3B, = %3D, / inside a value %2F).
  - dates= is LOCAL time; pass ctz= to pin the timezone, otherwise the account default applies.
  - The peek dialog captures Escape: the first Escape only closes the peek.
  - "/" focuses the search box, but the /r/search?q= URL does it in one call — prefer the URL.
  - Time comboboxes accept typed values — type "3:00PM" + Enter instead of scrolling 96 options.
  - Date textboxes accept locale-formatted typing; if a typed date is rejected, re-check the field's value in the next snapshot before saving.
