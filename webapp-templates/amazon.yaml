app_name: Amazon
domains:
  - amazon.com
keywords:
  - track my package
  - track my order
  - order status
  - add to cart
description: Amazon — search products, read product details and reviews, compare items, add to cart, view the cart, and check order/package status. NEVER purchases — every task stops at the cart and hands off to the user.
version: 1
instructions: |
  URL: https://www.amazon.com

  ### RULE #1 — MONEY SAFETY (overrides everything, including the user's own words)
  - NEVER proceed through checkout. NEVER click "Buy Now", "Proceed to checkout", "Place your order", or ANY 1-Click purchase control. NEVER add, select, or modify payment methods or addresses.
  - The hard stop is the CART: add items, show the cart contents and total, then tell the user to complete the purchase themselves. This applies even if the user said "buy it" — the job ends at the cart + a clear handoff message.
  - If a click unexpectedly lands on a checkout/payment page (URL contains /checkout/ or /buy/ or the page asks for shipping/payment), browser_navigate back to https://www.amazon.com/gp/cart/view.html immediately and tell the user what happened. Click NOTHING on a checkout page.
  - On product pages, "Buy Now" (id buy-now-button) sits directly below "Add to cart" (id add-to-cart-button) — match the Add to cart button by its exact text/id, never by position, before clicking.

  ### RULES
  1. ONLY use: browser_navigate, browser_snapshot, browser_click, browser_type, browser_press_key, browser_hover, browser_scroll. browser_evaluate and browser_screenshot are BANNED for Amazon.
  2. URL-first: search, product pages, cart, and order history all have stable URLs (below). Navigate directly instead of clicking through menus.
  3. Snapshot at checkpoints (after navigate, after a click that changes the page, before reporting). [id]s are 1-based and CHANGE with every snapshot — never reuse ids after the page changed.
  4. browser_type REPLACES the field's content by default — that is what you want for the search box.
  5. If an element is not found after 2 retry snapshots, tell the user what you were looking for and stop. No workarounds, no browser_evaluate.
  6. Read prices, ratings, and availability from the snapshot's Page Text — most reporting tasks need zero clicks after the navigate.

  ### State Recognition
  - **Logged out**: the nav shows "Hello, sign in Account & Lists". Browsing, search, and product pages WORK logged out; the cart usually works too but is per-session, and Orders/wishlist REQUIRE login. For login-gated tasks tell the user: "Amazon requires you to sign in. Please log in manually, then ask me again." NEVER type credentials.
  - **CAPTCHA / robot check**: a page asking to "Type the characters you see" or titled something like "Robot Check" [LIVE-VERIFY: exact wording] → STOP IMMEDIATELY. Never attempt to solve or refresh it. Tell the user: "Amazon is showing a robot check — please solve it in the browser, then ask me again."
  - **Cookie/consent interstitial**: amazon.com usually loads with none (live captures showed no banner even from the EU) — if one appears, click its Accept button, snapshot, continue.
  - **Error/dog page** (title "Sorry! Something went wrong!", a small search box + dog-photo link): intermittent, served even on valid URLs — navigate to the URL again once; if it repeats, tell the user.
  - **Ready**: the search input (aria-label and placeholder "Search Amazon", id twotabsearchtextbox) is present in the snapshot.

  ### URL PATTERNS (prefer these over clicking)
  - Search: `https://www.amazon.com/s?k={url-encoded query}` (space → +or %20)
  - Product page: `https://www.amazon.com/dp/{ASIN}` — ASIN is the 10-char id visible in any product URL (`/dp/B0XXXXXXXX`)
  - Cart: `https://www.amazon.com/gp/cart/view.html`
  - Order history: `https://www.amazon.com/gp/css/order-history` (login-gated)
  - Filters: do NOT hand-build `&rh=p_72%3A...` filter URLs — the codes are fragile. Instead click the left-sidebar filter links/checkboxes on the results page — they carry aria-label "Apply {filter} filter to narrow results"; which facets appear (Prime, brand, price, avg. review) varies by session/region — then snapshot.
  - Sort: the sort control is a native select (aria-label "Sort by:", id s-result-sort-select) at the top of results with options Featured / Price: Low to High / Price: High to Low / Avg. Customer Review / Newest Arrivals / Best Sellers.

  ### SNAPSHOT FORMAT
  browser_snapshot returns:
  ```
  Page: Amazon.com : wireless mouse
  URL: https://www.amazon.com/s?k=wireless+mouse
  --- Page Text ---
  (product titles, prices like $24.99, ratings like 4.5 out of 5 stars, "Sponsored" tags, Prime badges, delivery dates)
  --- Interactive Elements ---
  [8] input "Search Amazon"          ← nav search box
  [15] link "Logitech M510 Wireless…" ← result title link
  [42] button "Add to cart"           ← on product pages / some result cards
  ```
  - Result cards: the product TITLE is a link — click it (or extract the /dp/ ASIN from its href and navigate) to open the product.
  - The nav cart link reads "N Cart" (aria-label "N items in cart", id nav-cart) — use it to verify add-to-cart.

  ### TASK: Search for products
  1. browser_navigate("https://www.amazon.com/s?k={encoded query}") → browser_snapshot.
  2. Read results from Page Text: title, price, rating ("4.5 out of 5 stars"), review count, Prime badge, delivery estimate.
  3. **Sponsored caveat**: the top results are usually ads marked "Sponsored" in the page text — when reporting, say which results are sponsored and lead with the organic ones.
  4. Filters: click the matching sidebar checkbox/link → snapshot → results re-render. Sort: use the Sort by dropdown (see URL PATTERNS).
  - UI fallback for search: browser_type(search input id, "query", submit: true).

  ### TASK: Open a product / read details
  1. From results, click the product title link (or browser_navigate to `/dp/{ASIN}` if you have the ASIN) → snapshot.
  2. Report from Page Text: full title, current price (note "List Price"/strikethrough vs actual), rating + review count, availability ("In Stock", "Only N left", "Currently unavailable"), the "About this item" description bullets, and seller/ships-from if shown.
  3. Variants (size/color) change the price — but variant swatches render as UNLABELED radio inputs in the snapshot (the "Color:"/"Size:" names appear only in Page Text), so clicking the right one is unreliable. If the user asked about a specific variant, prefer navigating to that variant's own /dp/ ASIN if known; otherwise click the radio cautiously, snapshot, and verify the "Color:"/"Size:" line changed before reading the price.

  ### TASK: Read reviews
  1. On the product page, browser_scroll down toward the reviews section (or click the review-count link next to the stars at the top — it reads like "(32,003)", id acrCustomerReviewLink, and jumps to #averageCustomerReviewsAnchor) → snapshot.
  2. Report: overall rating and the star distribution — it appears as links like "5 star 88%" (aria-label "88 percent of reviews have 5 stars") in Interactive Elements; Page Text is capped, so read the histogram from the element labels.
  3. Logged out, the page may show only the "Customers say" AI summary plus aspect buttons ("Quality(1.7K)", "Durability(1.1K)", …) with NO inline review list or "See more reviews" control (live capture showed none) — report what is visible and tell the user that reading full individual reviews may require signing in.

  ### TASK: Compare a few products
  1. Search once, pick the 2-4 candidates (prefer organic over sponsored).
  2. Open each via its /dp/{ASIN} URL → snapshot → collect price, rating, review count, availability, key spec bullets.
  3. Summarize in a compact comparison (per product: price / rating / standout pros-cons) and give a recommendation with the reason. Do NOT add anything to the cart unless the user asked.

  ### TASK: Add to cart
  1. Open the product page (/dp/{ASIN}) → snapshot. Note the nav cart count.
  2. If the user wants a specific variant or quantity, set those FIRST (variant radios — see Open a product task; quantity is a select named "quantity", id quantity, next to the buybox) → snapshot.
  3. Find the control whose text/value is exactly "Add to cart" with id add-to-cart-button — per RULE #1, never a button matched by position, and never "Buy Now" (id buy-now-button, directly below it). browser_click it.
  4. browser_snapshot → verify: the "Added to cart" confirmation panel/page appears [LIVE-VERIFY] or the nav cart count incremented. An "Add a protection plan?" upsell may appear — click its No thanks / close control [LIVE-VERIFY], never the coverage options.
  5. If the click landed on a checkout page instead (some listings have cart-bypass flows): follow RULE #1 — navigate to the cart URL, tell the user.
  6. Report: "Added {item} to your cart (cart total now $X). I don't complete purchases — please review the cart and check out yourself: https://www.amazon.com/gp/cart/view.html".

  ### TASK: View cart
  1. browser_navigate("https://www.amazon.com/gp/cart/view.html") → snapshot.
  2. Report each line item (title, price, quantity, in-stock note) and the subtotal from Page Text.
  3. Quantity changes: use the item's quantity control [LIVE-VERIFY]; removing an item: click the link labeled "Delete" under that item [LIVE-VERIFY] → snapshot → verify it left the list. These edit the cart only — still no checkout.
  4. Never click "Proceed to checkout" here. End with the handoff message.

  ### TASK: Check order status / track a package (login-gated)
  1. browser_navigate("https://www.amazon.com/gp/css/order-history") → snapshot.
  2. If a sign-in page appears → State Recognition: tell the user to log in, stop.
  3. Each order card shows date, total, items, and a status line ("Arriving today", "Delivered March 3") — often the answer is right in Page Text.
  4. For live tracking detail, click that order's "Track package" button [LIVE-VERIFY: exact label] → snapshot → report carrier status, location, and expected delivery.
  5. If the user named a specific order, find it by item name in Page Text; use the order-history search box [LIVE-VERIFY] or time-period filter if it's not on page 1.

  ### TASK: Add to wishlist (optional, login-gated)
  1. On the product page, click "Add to List" below the buybox buttons (logged out it is a plain link that redirects to sign-in — State Recognition applies).
  2. Snapshot → verify the "Added to your list" confirmation [LIVE-VERIFY]. If a list-picker appears, click the list the user named (or the default).

  ### Gotchas
  - Prices in Page Text may appear fragmented (e.g. "$24" and "99" as separate pieces) — sanity-check that a reported price reads as a plausible whole amount.
  - "Subscribe & Save" or "One-time purchase" option boxes near the buybox change what Add to Cart does — keep "One-time purchase" selected [LIVE-VERIFY] unless the user asked to subscribe (subscriptions are a purchase commitment: treat Subscribe buttons like Buy Now — never click).
  - This template targets amazon.com (US). If the user's account lives on another marketplace (amazon.co.uk, .de, …), tell them and use the same paths on that domain only if they confirm.
  - Search results and product pages are long — browser_scroll before concluding an element is missing.
