app_name: arXiv
domains:
  - arxiv.org
keywords:
  - preprint
  - preprints
  - abstract of
  - research paper on
description: arXiv — look up papers by id, search by title/author/keyword, browse recent papers in a category (cs.AI etc.), track version history, follow citation links, and copy BibTeX. Reads abstracts, metadata, and a paper's section structure; paper BODIES are not readable (PDFs never render, and the HTML version exposes only its opening). Strictly read-only; submitting and accounts are not supported.
version: 1
instructions: |
  URL: https://arxiv.org

  ### THE ONE THING TO KNOW
  arXiv is a pure READ surface with rock-stable, server-rendered URLs. The abstract page `https://arxiv.org/abs/{id}` is the backbone — title, authors, abstract, subjects, version history, and every export/citation link. Navigate by URL, read Page Text, answer; most tasks are 2–3 tool calls. Paper BODIES are not readable through snapshots: PDFs never render, and even the HTML version (`/html/{id}`) exposes only its opening — the abs page's abstract is your content source (see TASK: full text).

  ### RULES (each stated once — follow exactly)
  1. ONLY use: browser_navigate, browser_snapshot, browser_click, browser_type, browser_press_key, browser_hover, browser_scroll. browser_evaluate and browser_screenshot are BANNED for arXiv. Never use desktop or sidecar tools.
  2. URL-FIRST: abstract, search, listing, and full-text pages all have URL patterns (below). Click only to follow links a snapshot actually shows (search results, listing entries, citation/export links).
  3. READ-ONLY: never submit, replace, withdraw, endorse, claim authorship, or touch account/login/registration links — even if asked. Say it's unsupported and stop.
  4. Page Text is the FIRST ~2000 characters of the page, taken from the TOP of the document. browser_scroll does NOT move this window, and neither do `#section` anchors — scrolling never reveals more text. What the window holds: abs page ≈ everything that matters (only a long version list truncates at its end); search page ≈ the first ~2 hits; listing ≈ the first ~5 entries; `/html/` page ≈ section TOC + title/authors only. Content past the window is reachable only where a URL offset exists (`start=` on search, `skip=` on listings) — otherwise tell the user honestly.
  5. [id]s are 1-based and CHANGE with every snapshot — never reuse ids after the page changed.
  6. If an element is not found after 2 retry snapshots, tell the user what you were looking for and stop. No workarounds, no browser_evaluate.

  ### State Recognition
  - **No sign-in, ever**: reading arXiv needs no account. If a login/registration page appears you clicked the wrong thing — navigate back to the paper URL. Never enter credentials.
  - **Ready (abstract page)**: page title starts with the arXiv id and paper title; Page Text has the title, author list, and abstract.
  - **Bad id**: Page Text says the article identifier is not recognized / not found → the id is wrong or malformed; re-check the format (below) or run TASK: Search instead of guessing.
  - **No HTML version**: `/html/{id}` returns an unavailable/not-found notice for older papers → report from the abs page per TASK: full text.

  ### PAPER IDS
  - New style (2007+): `YYMM.NNNNN`, e.g. `2403.12345`. Old style: `archive/YYMMNNN`, e.g. `cs/0112017`. Both work in every URL pattern. A `v` suffix pins a version (`/abs/2403.12345v1`); the bare id = LATEST version.

  ### URL PATTERNS (the backbone — prefer these over any clicking)
  - **Abstract page**: `https://arxiv.org/abs/{id}` — the default destination for any named paper.
  - **HTML full text**: `https://arxiv.org/html/{id}` — exists whenever arXiv could convert the LaTeX source (most recent papers, plus older ones re-processed on revision; even 2017's 1706.03762 has one). The abs page shows an "HTML (experimental)" link when it exists; the page opens with the paper's section TOC (Abstract, 1 Introduction, …) — good as a structure listing, but the TOC entries are same-page anchors: clicking them does NOT change Page Text (Rule 4).
  - **Search**: `https://arxiv.org/search/?query={q}&searchtype=all` — URL-encode, spaces as `+`. Scope with the `searchtype` param: `title`, `author`, or `abstract` (quoted phrases work: `query=%22attention+is+all+you+need%22&searchtype=title`). Field-prefix syntax (`ti:"…"`, `au:…`) does NOT work here — it returns zero results; use `searchtype` instead. Pagination: `&start=50` per page of 50 ("Showing 1–50 of N results" + numbered page links).
  - **Recent listing**: `https://arxiv.org/list/{category}/recent` — the last few days' submissions in a category. AI-relevant category codes: `cs.AI` (artificial intelligence), `cs.LG` (machine learning), `cs.CL` (NLP/language), `cs.CV` (vision), `cs.RO` (robotics), `cs.NE` (neural/evolutionary), `stat.ML` (ML theory/stats), `cs.MA` (multi-agent), `eess.AS` (audio/speech).
  - **Author page**: `https://arxiv.org/a/{author_id}` is effectively dead — it 404s even for prominent authors. Always use an author search instead (TASK: Search step 1); author names on abs pages and listings are already links to that search.

  ### SNAPSHOT FORMAT
  ```
  Page: [2403.12345] Paper Title Here
  --- Page Text ---
  Paper Title Here  Jane Doe, John Smith  Abstract: We propose …  Subjects: Machine Learning (cs.LG); Artificial Intelligence (cs.AI)  Submission history … [v1] Tue, 19 Mar 2024 … [v2] …
  --- Interactive Elements ---
  [30] a "HTML (experimental)" href="https://arxiv.org/html/2403.12345v2"
  [53] button "Export BibTeX Citation"
  ```

  ### TASK: Look up a paper by id (PRIMARY)
  1. browser_navigate `/abs/{id}` → browser_snapshot.
  2. Ready → answer from Page Text: title, authors, abstract, Subjects line, Comments line (page count, venue notes), Submission history (dates per version).
  3. Bad-id state → fix the format or search by title instead.

  ### TASK: Search by title / author / keyword
  1. Build the search URL: known exact title → `query=%22{title}%22&searchtype=title`; author → `query={name}&searchtype=author`; topic → plain keywords with `searchtype=all`. Navigate → snapshot.
  2. Page Text shows the hit count ("Showing 1–50 of N results") but only the first ~2 hits as text (`arXiv:{id}`, title, authors, abstract snippet, "Submitted {date}"). Every hit's `arXiv:{id}` link appears in Interactive Elements with its `/abs/` href. Navigate `/abs/{id}` of the best hit; step deeper with `&start=50`. Nothing clearly matching among the readable hits → report what you saw and ask before paging on.

  ### TASK: Report on a paper's full text (bodies are NOT readable — be honest)
  1. Snapshots cannot read a paper's body: PDFs are invisible, and on `/html/{id}` the Page-Text window ends right about where the abstract begins — it carries the arXiv banner, the section TOC, title, and authors/affiliations. Scrolling reveals nothing more (Rule 4).
  2. What you CAN deliver: the full abstract + Comments/Subjects from `/abs/{id}`, plus the section list from `/html/{id}` when it exists ("the paper covers: Introduction, Background, Model Architecture, …"). For "summarize this paper", answer from the abstract and SAY the summary is abstract-based.
  3. If the user needs the actual body, say so plainly and give them the `/html/{id}` (or `/pdf/{id}`) URL to open themselves. Never navigate to `/pdf/{id}` yourself.

  ### TASK: Browse recent papers in a category (e.g. weekly cs.AI scan)
  1. browser_navigate `/list/{category}/recent` → snapshot.
  2. Entries are date-grouped ("Thu, 16 Jul 2026 (showing first 50 of 148 entries)"): `arXiv:{id}` link, title, authors, Subjects line, sometimes a Comments line. 50 per page; the header says "Total of N entries" with range links (`51-100` → `?skip=50&show=50`) plus `fewer | more | all` (`show=25/100/2000`) and per-day anchor links. Paginate by navigating `?skip={n}&show=25` (any offset works; entry numbering continues). Page Text reads out only the first ~5 entries per snapshot (Rule 4) — a full-day scan takes many snapshots, so tell the user and confirm before walking more than a few pages. Report id + title + one-line topic per paper; open `/abs/{id}` only for ones worth detail.

  ### TASK: Track a paper's versions
  1. Open `/abs/{id}` (bare id = latest). Submission history lists every version with its date: `[v1] Tue, 19 Mar 2024 … [v2] …`.
  2. Report version count and dates. The `[vN]` entries are links to the pinned abstract pages (`/abs/{id}v1`), except the currently shown version, which renders as plain text. On papers with many versions the end of the date list can fall past the Page-Text window — the `[vN]` links in Interactive Elements still give the full count. To compare content, open a pinned version (`/abs/{id}v1`).

  ### TASK: Find related work / citations
  1. On the abs page, the "References & Citations" block links to external indexes — NASA ADS, Google Scholar, Semantic Scholar — visible directly in the snapshot, no toggle needed. (The separate arXivLabs "Bibliographic Tools" tabs add Connected Papers/Litmaps/scite — ignore them.) These leave arxiv.org — follow one only if the user wants actual citing/cited lists, and say you're on an external site.
  2. Staying on arXiv: search key terms from the abstract, or browse the paper's categories — offer these as the on-site alternative.

  ### TASK: Report the BibTeX
  1. URL-first: navigate `https://arxiv.org/bibtex/{id}` — a plain-text page whose entire Page Text is the record. (The abs page's "Export BibTeX Citation" is a button that opens an overlay — skip it, the URL is cleaner.)
  2. The BibTeX record (`@misc{…}` with title, author, year, eprint, archivePrefix, primaryClass, url) is in Page Text — quote it verbatim in a code block, character for character.

  ### UNSUPPORTED — tell the user, do not attempt
  - Submitting/replacing/withdrawing papers, endorsements, claiming authorship.
  - Account actions: login, registration, email alerts.
  - Reading paper bodies: `/pdf/` URLs are invisible to snapshots, and `/html/` pages expose only their opening — abstract + section list is all you can honestly report.
  - Citation-graph analysis on arXiv itself — citation data lives on the external indexes above.

  ### Gotchas
  - "arXiv:2403.12345" in running text is the id `2403.12345` — strip the prefix before building URLs.
  - Cross-listed papers appear in several categories; the FIRST subject on the Subjects line is the primary.
  - Listing/search snippets truncate abstracts — quote abstracts from the abs page, not from a list.
  - `{id}v3` when only v2 exists → bad-id state; check Submission history before pinning versions.
