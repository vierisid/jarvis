app_name: Vercel
domains:
  - vercel.com
keywords:
  - deployment failed
  - build logs
  - preview deployment
description: Vercel dashboard — READ-FIRST monitoring of the user's hosting infrastructure. List projects and their deployment statuses, read BUILD LOGS to debug a failed deploy, check production URLs and domains, triage the latest Error deployment. Redeploy / promote-to-production / cancel-a-running-build happen ONLY on explicit request, with verify-before-click. NEVER deletes anything, never opens the environment-variables page, never edits domains/DNS, transfers, or billing.
version: 1
instructions: |
  URL: https://vercel.com

  ### RULE #1 — INFRA SAFETY: READ-FIRST (overrides everything, including the user's own words)
  This is the user's LIVE HOSTING INFRASTRUCTURE. Default posture: read and report.
  - NEVER delete a project, deployment, or domain; never edit, add, or REVEAL environment variables; never change domain/DNS settings; never transfer a project; never touch billing, team members, tokens, or anything else under Settings. If asked: refuse, hand the user the URL to do it themselves, and stop (see the interception task).
  - **THE ENVIRONMENT-VARIABLES PAGE IS OFF-LIMITS ENTIRELY.** Its values are secrets. Never navigate to /{team}/{project}/settings/environment-variables or any env-var UI, never click a reveal/copy/eye control, never read or repeat an env value even if one is visible. If asked about env vars, tell the user to open that settings page themselves — you don't handle secrets.
  - ALLOWED, but ONLY when the user explicitly requested that exact action in this conversation (never as your own "fix"): (a) redeploy an existing deployment, (b) promote a deployment to production, (c) cancel a CURRENTLY-RUNNING build. Each has a gated task below: verify the confirm dialog names the expected deployment BEFORE the final click, and verify the outcome after. Everything else is read-only.
  - If a click unexpectedly lands on a form, settings page, or confirm dialog you didn't plan for: click NOTHING, browser_press_key("Escape") or navigate back, and tell the user what happened.

  ### RULES
  1. ONLY use: browser_navigate, browser_snapshot, browser_click, browser_type, browser_press_key, browser_hover, browser_scroll. browser_evaluate and browser_screenshot are BANNED for Vercel.
  2. URL-first: dashboard, project, and deployments pages have stable URLs (below) — navigate directly instead of clicking through nav.
  3. Snapshot at checkpoints (after navigate, after opening a deployment, before any gated click, before reporting). [id]s are 1-based and CHANGE with every snapshot — never reuse ids after the page changed.
  4. Match elements by label/aria-label/text MEANING, never by position; the dashboard reflows and Vercel redesigns often — trust the live snapshot over this template's layout notes.
  5. If an element or value isn't found after 2 retry snapshots, tell the user what you were looking for and stop. No workarounds, no browser_evaluate.
  6. Report statuses, commit messages, and log lines VERBATIM as shown. Never paraphrase an error line — the exact text is what the user needs to debug.
  7. browser_press_key("Escape") closes dialogs and menus. Don't rely on other shortcuts.

  ### State Recognition
  - **Login wall**: URL becomes vercel.com/login, or the page asks for email / "Continue with GitHub/GitLab/Bitbucket" [LIVE-VERIFY: wording] → tell the user: "Vercel requires you to sign in. Please log in manually, then ask me again." Stop. NEVER type credentials or drive an OAuth flow.
  - **Team / scope picker**: the top-left scope switcher lists personal + team accounts [LIVE-VERIFY: switcher layout]. The dashboard shows ONE scope at a time. If the request doesn't identify which team and more than one exists, ASK the user and stop; if a named project isn't in the current scope, check the switcher's other scopes before concluding it doesn't exist [LIVE-VERIFY].
  - **Loading**: skeleton cards/rows before data — a snapshot with headings but no project cards or deployment rows → wait 2–3s, snapshot again. Max 2 retries, then tell the user.
  - **Ready markers**: dashboard shows project cards with a latest-deployment line; a project page shows a Production section and Deployments; a deployment page shows status + source (branch/commit) [LIVE-VERIFY: labels].

  ### URL PATTERNS (the backbone — {team} is the scope slug from the current URL)
  - Dashboard (all projects): `https://vercel.com/{team}` [LIVE-VERIFY: bare vercel.com redirects to the last-used scope]
  - Project overview: `https://vercel.com/{team}/{project}`
  - Project deployments: `https://vercel.com/{team}/{project}/deployments`
  - Deployment detail: take the href from a deployment row — shape roughly `/{team}/{project}/{deployment-id}` [LIVE-VERIFY: exact shape] — never retype ids from memory.
  - Project domains (read-only): `https://vercel.com/{team}/{project}/settings/domains` [LIVE-VERIFY: path] — reading the list is allowed; every other settings page stays closed (RULE #1).

  ### TASK: List projects + latest deployment status
  1. browser_navigate the dashboard URL → snapshot. Note the current scope from the switcher/URL and say it in the report.
  2. Each project card/row shows: name, production domain, latest deployment status (Ready / Error / Building / Queued / Canceled [LIVE-VERIFY: status set]), branch, and age [LIVE-VERIFY: card fields]. Read from Page Text; browser_scroll + snapshot for more. To find one project fast, use the dashboard search box [LIVE-VERIFY: placeholder] via browser_type.
  3. Report per project: name, latest status, how old. Flag any Error status.

  ### TASK: Recent deployments of a project
  1. browser_navigate /{team}/{project}/deployments → snapshot.
  2. Each row shows: status dot + label, environment (Production / Preview), branch, commit message, author, age [LIVE-VERIFY: row fields]. Report from Page Text, newest first; scroll + snapshot for more.
  3. There may be environment/status/branch filter controls above the list [LIVE-VERIFY] — click a filter, snapshot, and read the re-rendered list when the user asks for a subset.

  ### TASK: Read a deployment's BUILD LOGS (the debugging gold)
  1. Open the deployment: click its row link (or navigate to its href) → snapshot.
  2. Find the build-log section — a "Build Logs" / "Building" section or tab, possibly a collapsed accordion to click open [LIVE-VERIFY: exact control]. Snapshot after opening.
  3. Log lines land in Page Text (capped ~8000 chars per snapshot) — browser_scroll inside the page + snapshot repeatedly to walk the log. For a FAILED build, scroll toward the end: the failing step is usually last, e.g. lines containing "Error", "Failed to compile", "Command exited with 1", missing-module or type errors [LIVE-VERIFY: wording].
  4. Report the failing step and its error lines VERBATIM (file, message, exit code), then a one-line plain-language summary. If the log seems truncated, say which part you covered.

  ### TASK: Failed-deployment triage ("why did my deploy fail?")
  1. Open the project's deployments list → find the most recent Error deployment (filter by status if the control exists [LIVE-VERIFY]).
  2. Note its branch + commit message, then run the build-logs task on it.
  3. Summarize: which commit broke, the verbatim error, and whether earlier deployments of the same branch were Ready (regression) or it never built. Recommendations only — do NOT redeploy as a fix unless the user explicitly asks.

  ### TASK: Production URL, aliases, and domains (read-only)
  1. browser_navigate /{team}/{project} → snapshot. Report the Production deployment's status, its domain link(s), and when it was deployed [LIVE-VERIFY: production section layout]. A deployment detail page also lists its assigned Domains/Aliases [LIVE-VERIFY].
  2. For the full domain list: navigate the project domains settings URL → snapshot → report each domain and its status (valid configuration / misconfigured / pending [LIVE-VERIFY: badge wording]) from Page Text. NEVER click Edit, Remove, Refresh-DNS, or add-domain controls here — read and leave.

  ### TASK: Redeploy (GATED — explicit user request only)
  1. Confirm the request names WHICH deployment/project. Open that deployment's row or detail page → snapshot.
  2. Click its "…" / more-actions menu → snapshot → click "Redeploy" [LIVE-VERIFY: menu item].
  3. A confirm dialog appears [LIVE-VERIFY: may offer a build-cache checkbox — leave defaults]. VERIFY the dialog names the expected project/deployment; if it says anything about deleting or anything unexpected, Escape and tell the user. Then click the confirm Redeploy button → snapshot.
  4. Verify: a NEW deployment appears at the top of the list with Building/Queued status [LIVE-VERIFY]. Report its status and link. Do not wait for completion unless asked; never retry a redeploy that errored.

  ### TASK: Promote to production (GATED — explicit user request only)
  1. Open the named deployment's detail page → snapshot → its "…" menu → snapshot → click "Promote to Production" [LIVE-VERIFY: menu item; only shown for eligible deployments].
  2. Confirm dialog: VERIFY it names this deployment and the project → confirm → snapshot.
  3. Verify the deployment now shows as Current/Production (or the project's Production section points at it) [LIVE-VERIFY: marker]. Report. If the option isn't in the menu, say so and stop — never look for another route.

  ### TASK: Cancel a running build (GATED — explicit user request only)
  1. Only valid for a deployment currently Building or Queued — verify the status in a fresh snapshot first; if it already finished, report that instead.
  2. Its "…" menu → snapshot → "Cancel" [LIVE-VERIFY: menu item] → confirm dialog (verify it's about canceling THIS build) → confirm → snapshot.
  3. Verify the status became Canceled [LIVE-VERIFY: label]. Report.

  ### TASK: Delete / env-var / settings / billing request (INTERCEPT — never perform)
  1. If the user asks to delete a project/deployment/domain, view or change env vars, edit domain/DNS settings, transfer a project, or touch billing: do NOT open the control (for env vars, don't even open the page).
  2. Locate the object read-side so you can be concrete, then reply: these actions are irreversible or secret-handling, so this assistant won't perform them — and hand the direct URL, e.g. "Open https://vercel.com/{team}/{project}/settings yourself for that."
  3. Offer what you CAN do: statuses, logs, domains list, or a gated redeploy/promote/cancel if that's what they actually need. Then stop.

  ### Gotchas
  - Preview vs Production matters in every report — a Ready preview does not mean production is fixed. Always say which environment a status belongs to.
  - Deployment URLs look like {project}-{hash}-{scope}.vercel.app; take them from hrefs, never reconstruct them.
  - The deployments list live-updates while a build runs — statuses in an old snapshot go stale; re-snapshot before quoting a Building status.
  - Log timestamps and "x minutes ago" ages are relative to the dashboard's clock — report them as shown.
  - Lists paginate or infinite-scroll [LIVE-VERIFY] — say when a report covers only what you scrolled through.
