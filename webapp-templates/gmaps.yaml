app_name: Google Maps
domains:
  - google.com/maps
  - maps.google.com
keywords:
  - directions to
  - near me
  - nearest
  - opening hours
  - how far is
  - how long to drive
description: Google Maps — search for places, read place details (address, hours, phone, rating, reviews), and get directions with per-route durations, all via URLs and the sidebar panel. No map-canvas interaction.
version: 3
instructions: |
  URL: https://www.google.com/maps

  ### THE ONE THING TO KNOW
  Google Maps is TWO surfaces. The map CANVAS is WebGL — invisible to browser_snapshot and NOT automatable; never try to click, drag, or read the map itself. The SIDEBAR panel (search results, place details, directions) is regular DOM whose content lands in Page Text. Everything below drives URLs and reads/clicks the sidebar only. If a request needs the canvas, it is unsupported (see UNSUPPORTED).

  ### RULES (each stated once — follow exactly)
  1. ONLY use: browser_navigate, browser_snapshot, browser_click, browser_type, browser_press_key, browser_hover, browser_scroll. browser_evaluate and browser_screenshot are BANNED for Maps. Never use desktop or sidecar tools.
  2. URL-FIRST: search, directions, and place lookups all have stable URLs (below). Always build the URL instead of typing into the search box; type only to refine an already-open panel. URL navigation is RELIABLE; in-sidebar clicks are the flaky path (see the results-click gotcha) — prefer a refined URL over a click whenever both would work.
  3. READ, don't click, wherever possible: names, ratings, hours, addresses, phone numbers, and route durations all appear in Page Text. Answer from Page Text; open a place panel only when the user needs details the list view doesn't show (review counts, price level, phone, and review text live on the place panel, NOT in the results list).
  4. FORCE ENGLISH: append `?hl=en` (or `&hl=en` after other params) to every Maps URL you build — live-verified to work and to survive Maps' URL rewrite. Google otherwise localizes by server-side geo-IP even when the browser asks for English. If labels still come back localized, match buttons/tabs by aria-label MEANING, never by exact English text.
  5. browser_type REPLACES field content by default — that is what the search box wants.
  6. [id]s are 1-based and CHANGE with every snapshot — never reuse ids after the page changed. Maps re-renders the results feed as sponsored entries stream in, so snapshot IMMEDIATELY before any click.
  7. If an element is not found after 2 retry snapshots, tell the user what you were looking for and stop. No workarounds, no browser_evaluate.
  8. NO GPS: the browser has no location, so "near me" means nothing to Maps here. If the user gives no area, ASK for one (city / neighborhood / address) before searching. Never guess a location.

  ### State Recognition
  - **Consent interstitial** (EU / first run — live-verified): URL becomes `consent.google.com/m?continue=<your target>`. Language follows your target URL's `hl` (with hl=en: "Reject all" / "Accept all"; else geo-IP locale, e.g. "Rifiuta tutto"). The buttons sit BELOW THE FOLD at common window sizes: browser_scroll down → snapshot → click the reject-all button (rejecting is sufficient for all Maps reading; no need to accept). After the click the page auto-redirects within a few seconds — the next snapshot may STILL show consent (redirect in flight): wait 2–3s and snapshot again. If it persists after 2 tries, re-navigate to the target once, then tell the user and stop.
  - **No sign-in needed** for search, place details, or directions. Signed-out Maps shows a "limited view of Google Maps" banner — normal; everything below still works. Sign-in is only required for saving places and posting reviews — if a sign-in prompt appears there, tell the user to log in manually and stop.
  - **Ready**: the search box is present — `input name="q" role="combobox"` holding the current query (it carries no reliable aria-label; recognize it by name="q").
  - **Loading**: sidebar empty, no results text → wait 2–3s, snapshot again. Max 2 retries, then tell the user.

  ### URL PATTERNS (the backbone — prefer these over any clicking)
  - **Search**: `https://www.google.com/maps/search/{query}?hl=en` — URL-encode, spaces as `+`, and include the AREA in the query: `/maps/search/coffee+near+duomo+milan?hl=en`.
  - **Place details**: use the SEARCH pattern with a specific place name: `/maps/search/Duomo+di+Milano?hl=en`. A confidently-resolved query rewrites the URL to the canonical `/maps/place/...` form and opens the place panel directly (live-verified); an ambiguous one shows the results list — refine the query (add street/area) rather than clicking.
    - Do NOT navigate bare `/maps/place/{name}` — live-verified BROKEN signed out (name dropped, empty panel). Only full `/maps/place/...` URLs Maps itself produced (with `data=` blob) are safe to re-navigate.
  - **Directions**: `https://www.google.com/maps/dir/{origin}/{destination}?hl=en` — e.g. `/maps/dir/Milan+Central+Station/Duomo+di+Milano?hl=en`. Extra waypoints = extra `/segments`: `/maps/dir/A/B/C`. Leaving origin empty (`/maps/dir//Duomo+di+Milano`) opens the panel with only the destination filled.
    - Travel mode: the `data=` URL parameter is fragile — do NOT construct it. Load the dir URL, then click the mode tab and re-snapshot (see the Directions task for how mode tabs really look).
  - **The current URL IS the shareable link**: after any search/place/directions load, the snapshot's URL field encodes the exact view (`/@lat,lng,zoom` plus panel state). When the user asks for a link, report THAT URL — never open the Share dialog (a "Copy link" button exists in the directions panel; ignore it, the URL is equivalent).

  ### SNAPSHOT FORMAT (from a live capture)
  ```
  Page: coffee milan - Google Maps
  URL: https://www.google.com/maps/search/coffee+milan/@45.4711,9.1974,15z/data=!3m1!4b1?hl=en&entry=ttu
  --- Page Text ---
  Price  Rating  Hours  All filters … Results … Sweet Coffee  4.2  Bar · Via Alessandro Manzoni, 42  Open · Closes 9 pm …
  --- Interactive Elements ---
  [2] input name="q" role="combobox" value="coffee milan"
  [20] a "Sweet Coffee" href="https://www.google.com/maps/place/Sweet+Coffee/data=…" aria-label="Sweet Coffee"    ← result entry (link role, verified)
  ```
  The map canvas contributes NOTHING to the snapshot — that is expected, not an error.
  Page Text = the FIRST ~2000 chars of visible text, top-anchored — browser_scroll does NOT extend it. Search and directions fit easily; a long place panel gets cut, so deep sections (popular times, review bodies) can be unreadable — use the Reviews-tab re-render, not scrolling.

  ### TASK: Search places / "best X in Y"
  1. browser_navigate the search URL (area included — Rule 8; hl=en — Rule 4) → browser_snapshot.
  2. Page Text carries the ranked list, per result: name, rating (decimal separator follows locale: 4.2 / 4,2), category, address, open/closed status with next open/close time, sometimes a one-line description and action links ("Reserve a table", "Order online"). Review counts and price level are NOT in the signed-out list view — they are on the place panel. Filter chips (Price / Rating / Hours / All filters) sit above the list. Answer directly from Page Text.
  3. Detail on one result → prefer navigating `/maps/search/{exact place name + area}?hl=en` (Rule 2). Clicking the result link (the `a` named the place) also works but is timing-fragile: the feed re-renders as sponsored entries stream in and a stale click falls through to the canvas (map zooms, no panel — live-observed). If that happens, use the URL, don't re-click.
  4. More results: browser_scroll moves the WINDOW, but the results feed is a nested scrollable pane — it may not move. If Page Text is unchanged after one scroll attempt, refine the query (narrower area or category) instead of fighting the pane.

  ### TASK: Place details (address, hours, phone, rating)
  1. browser_navigate `/maps/search/{place name + area}?hl=en` → snapshot → place panel (see URL PATTERNS).
  2. Everything lands in Page Text (live-verified): name, rating + review count ("4.7 (2655)"), price range ("€1–10"), category, full address (button aria-label "Address: …"), open/closed hours row (a `div role="button"` like "Open · Closes 5 pm" — clicking expands in place, live-verified, but signed out may reveal only the current day's row, not the full week — report what appears), website, phone (aria-label "Phone: …"), Plus Code, owner posts, popular times, review summary — all on the default Overview tab; review TEXTS vary (see Read reviews). Report from Page Text.
  3. Panel tabs are `role="tab"` and the set varies by place type: Overview / Menu / Reviews / About for a cafe, Overview / Tickets / Reviews / About for an attraction. Action buttons: Directions, Save, Nearby, Send to phone, Share.

  ### TASK: Directions A→B
  1. browser_navigate `/maps/dir/{origin}/{destination}?hl=en` → snapshot.
  2. **Mode tabs (live-verified — not what you'd expect)**: a row of `role="radio"` buttons whose visible TEXT is each mode's DURATION, not its name — e.g. "Best", "6h 24m", "3h 15m", "6 days", "2 days", "1h 10m" — with NO mode-name aria-labels. Identify them by ORDER: Best, Driving, Transit, Walking, Cycling, (Flights, when offered). The durations shown ARE the per-mode summary — often you can answer without switching.
  3. Default for intercity routes is "Best", which mixes trains (with operator + € prices, e.g. "15:00 from Milano Centrale €102") and flights. For driving, click the second radio → snapshot → per-route rows show duration, distance, summary ("via A1/E35"), toll warnings ("This route has tolls"), and a per-route "Details" button. The FIRST listed route is Maps' recommended one ("Fastest route now").
  4. Step-by-step: click the route's "Details" button → snapshot → the step list lands in Page Text.
  5. Transit mode lists line names and departure/arrival times per route in Page Text.
  6. Origin/destination fields carry aria-labels "Starting point …" / "Destination …" plus a swap button ("Swap starting point and destination").

  ### TASK: "How far is X" / "how long to drive"
  Run the Directions task and report the top route's distance and duration. If the origin is unknown, ASK the user (Rule 8) — never assume where they are.

  ### TASK: Read reviews
  1. Open the place panel → snapshot. Signed out, review content VARIES (live-observed): some Overview panels carry review texts, others none — and reviews sit DEEP, often beyond the Page Text window.
  2. The reliable move: click the Reviews tab (`role="tab"`) → snapshot → it re-renders near the TOP of Page Text (live-verified): rating histogram, total count ("204,771 reviews"), sort control, topic chips ("roof 2960"). Full review bodies may still be withheld signed out — quote only what actually appears; never invent quotes.

  ### TASK: Save a place (requires sign-in — optional)
  1. Signed OUT, clicking Save NAVIGATES AWAY to a full Google sign-in page (live-verified) — do not touch it: browser_navigate back to the place URL, tell the user to log in manually, and stop.
  2. Signed in, a list picker appears (Favorites, Want to go, …) → click a list → snapshot to verify.

  ### TASK: Share / link to a view
  Report the snapshot's current URL (see URL PATTERNS). Do not open the Share dialog — the URL is equivalent and always available.

  ### UNSUPPORTED — tell the user, do not attempt
  - Live / turn-by-turn navigation (needs GPS and the mobile app).
  - Street View, satellite-layer inspection, or reading anything drawn on the map canvas.
  - Measuring distance by clicking map points, dropping pins, drawing areas.
  - Anything else requiring canvas interaction — the map is WebGL and invisible to snapshots.

  ### Gotchas
  - Maps rewrites the URL after load (adds `/@lat,lng,zoom` and `data=`; keeps your `hl=en`) — the rewritten URL is fine to report and to re-navigate to.
  - Hours in Page Text are in the PLACE's local time zone — say so when answering "is it open now" for far-away places.
  - Sponsored results appear first, marked "Sponsored" in Page Text (live-verified; localized without hl=en, e.g. "Sponsorizzato") with a "Why this ad?" button, and plain text-ad links can be interleaved — skip both when ranking by rating.
  - A confidently-resolved search skips the list and lands directly on the place panel — both outcomes are success; check the URL (`/place/` vs `/search/`).
