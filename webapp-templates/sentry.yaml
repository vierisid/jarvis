app_name: Sentry
domains:
  - sentry.io
keywords:
  - unresolved errors
  - error spike
description: Sentry — READ + TRIAGE the user's error tracker. Triage the unresolved issue stream (title, event/user counts, age), read an issue (exception, top app stack frames, breadcrumbs, tags), search with Sentry query syntax in the URL, check new issues since a release, describe frequency trends honestly. Resolve/assign/archive ONLY on explicit request with verification — never deletes, never touches settings/alerts/keys/billing.
version: 1
instructions: |
  URL: https://{org}.sentry.io — each org has its own subdomain [LIVE-VERIFY: older orgs may use https://sentry.io/organizations/{org}/… paths; both redirect — after the first navigate, trust the URL bar and reuse that shape]. You MUST know the org slug first (see State Recognition).

  ### RULE #1 — READ + TRIAGE ONLY (overrides everything, including the user's own words)
  This is the user's ERROR-TRACKING infrastructure. Default posture: read and report. The ONLY allowed mutations — each ONLY on an explicit user request naming the issue, each verify-before-click AND verify-after: resolve/unresolve, assign, archive (ignore) an issue.
  - NEVER delete an issue or project, never use the stream's checkbox/bulk toolbar (mutations are one named issue at a time), never change alert rules, integrations, teams, or anything under Settings; never touch billing, quotas, or spend controls.
  - **SETTINGS PAGES ARE OFF-LIMITS ENTIRELY** (any /settings/ URL): they hold DSNs, client keys, auth tokens. Never navigate there, never click a "Reveal"/key control, never read or repeat a DSN/key/token even if one is visible. Asked about keys/SDK setup values → tell the user to open Settings themselves; you don't handle secrets.
  - A click lands on an unexpected confirmation dialog → click NOTHING in it: browser_press_key("Escape"), tell the user.

  ### RULES
  1. ONLY use: browser_navigate, browser_snapshot, browser_click, browser_type, browser_press_key, browser_hover, browser_scroll. browser_evaluate and browser_screenshot are BANNED for Sentry.
  2. URL-first: the stream, every search, issue details, and releases have stable URLs (below); the query syntax goes IN the URL, so most tasks start with one browser_navigate.
  3. Snapshot at checkpoints (after navigate, after opening an issue, before AND after any gated mutation). [id]s are 1-based and CHANGE with every snapshot — never reuse ids after the page changed.
  4. Match elements by label/aria-label/text MEANING, never by position — especially Resolve/Archive/assignee controls.
  5. Element or value not found after 2 retry snapshots → tell the user what you looked for and stop. No workarounds, no browser_evaluate.
  6. Report counts, rates, timestamps VERBATIM as shown (Sentry abbreviates: "1.2k" events, "3d ago"). Never re-derive or extrapolate, and always state which query + time window a report covers.
  7. Gated mutations: confirm in the PRE-click snapshot you're on the right issue (title + short id match the request), click ONCE, verify the new state in a fresh snapshot. Never blind-retry a mutation click.

  ### State Recognition
  - **Org slug unknown**: every URL needs {org}. If you don't know it (request, pasted link, earlier context), ASK the user ("the {org} in {org}.sentry.io — it's in your URL bar when you use Sentry") and stop.
  - **Login wall**: email/password form, "Sign in to continue", or SSO buttons (Google/GitHub/SAML), or URL contains /auth/login [LIVE-VERIFY: wording/path] → tell the user: "Sentry requires you to sign in. Please log in manually, then ask me again." Stop. NEVER type credentials, NEVER click through SSO.
  - **2FA / verification**: code/authenticator/passkey prompt → user completes it themselves; stop.
  - **No access / not found**: "You do not have access" or a 404 page [LIVE-VERIFY: wording] → report exactly that, stop, don't retry.
  - **Loading**: spinners/skeletons; a snapshot with nav but no rows/counts → wait 2–3s, re-snapshot. Max 2 retries, then tell the user.
  - **Ready markers** — stream: rows with issue titles plus event/user counts and a search bar showing the active query; issue page: exception type/message heading with first/last seen nearby [LIVE-VERIFY].
  - **Scope selectors**: the top bar's project, environment, and time-range pickers silently filter EVERYTHING [LIVE-VERIFY: layout]. Read them from the snapshot and state the scope in every report; for a project outside the current filter, put project:NAME in the query URL instead of fiddling with pickers.

  ### URL PATTERNS + QUERY SYNTAX (the backbone — prefer over clicking)
  - Issue stream: `https://{org}.sentry.io/issues/` (defaults to unresolved [LIVE-VERIFY])
  - Any search: `/issues/?query={URL-encoded}&statsPeriod=24h` — encode space → `+`, `:` → %3A, `"` → %22. statsPeriod: 1h, 24h, 7d, 30d, 90d [LIVE-VERIFY: accepted values].
  - Sort: `&sort=freq` (events), `&sort=user` (users affected), `&sort=date` (last seen), `&sort=new` (first seen) [LIVE-VERIFY: keys].
  - Issue detail: `/issues/{numeric-id}/` — ALWAYS take the id from a stream row's link href, never retype from memory.
  - Releases: `/releases/` [LIVE-VERIFY: path] · Performance: `/performance/` [LIVE-VERIFY: may be renamed/moved under "Insights"]

  **Canonical queries** (join terms with `+`; terms AND together):
  - `is%3Aunresolved` — open issues (the triage default)
  - `is%3Aunresolved+level%3Aerror` — unresolved errors only (excludes warnings/info)
  - `firstSeen%3A-24h` — issues that FIRST appeared in the last 24h (-7d etc. also work)
  - `project%3ANAME` — one project (also: `release%3A1.2.0`, `message%3A%22some text%22`, `is%3Aresolved`, `is%3Aarchived` [LIVE-VERIFY: archived vs ignored token], `assigned%3Ame`)
  Invalid query → error banner on the stream [LIVE-VERIFY] — fix it, never retry unchanged.

  ### TASK: Triage the issue stream
  1. browser_navigate `/issues/?query=is%3Aunresolved+level%3Aerror&sort=freq&statsPeriod=24h` (sort=user if the user cares about impact; widen statsPeriod if asked) → snapshot.
  2. Each row: issue title (exception type + message), culprit (function/file), short id, event count, user count, age (first→last seen) [LIVE-VERIFY: row layout]. Report the top issues VERBATIM: title, events, users, age. browser_scroll + snapshot for more rows.
  3. State the scope: query, window, project/environment filters (Rule 6).

  ### TASK: Read an issue (exception, stack trace, breadcrumbs, tags)
  1. Open from a stream row's link (or /issues/{id}/) → snapshot. Headline = exception type + message; event/user totals and first/last seen near the top [LIVE-VERIFY].
  2. browser_scroll + snapshot to the STACK TRACE. Report the TOP APP FRAMES VERBATIM from Page Text — file, function, line, in order. Sentry collapses framework frames and highlights "In App" ones [LIVE-VERIFY: whether collapsed frames reach Page Text; if only "n non-app frames" is visible, say so — don't guess].
  3. Keep scrolling for BREADCRUMBS (the action/log trail right before the error — report the last few) and TAGS (release, environment, browser, os, url — report dominant values) [LIVE-VERIFY: section order]. Page Text is capped — read in sections: scroll, snapshot, repeat.

  ### TASK: Search / filter issues
  1. Build the query from the canonical terms, URL-encode, browser_navigate → snapshot.
  2. Report hits from Page Text. Zero results: say so, show the query you ran, offer a broader variant (drop level:, widen statsPeriod) — don't silently auto-broaden.
  3. UI fallback: click the stream's search bar → browser_type(id, query, submit: true) [LIVE-VERIFY: the bar may tokenize input into filter chips].

  ### TASK: Check a specific error by message
  1. browser_navigate `/issues/?query=message%3A%22{encoded phrase}%22` — no match → retry once with a distinctive shorter substring, then once adding `is%3Aresolved` / `is%3Aarchived` (it may already be triaged) [LIVE-VERIFY: whether bare unquoted text full-text searches].
  2. Open the best hit and run the read-an-issue task. Multiple plausible hits → list them (title + short id) and ask the user.

  ### TASK: New issues since a release
  1. Version unknown? browser_navigate `/releases/` → snapshot → report the latest version + date [LIVE-VERIFY: list layout], or ask the user which release.
  2. browser_navigate `/issues/?query=firstSeen%3A-24h+is%3Aunresolved&sort=new` (match the window to the release age; `firstRelease%3A{version}` targets one release exactly [LIVE-VERIFY: token]) → snapshot.
  3. Report each new issue: title, events, users, first seen — the regression candidates.

  ### TASK: Frequency spike detection (honest trend reading)
  1. Open the issue → snapshot. The detail page shows an event-frequency graph with period totals (e.g. last 24h / 30d counts) near it [LIVE-VERIFY: which numbers render as text].
  2. Describe the trend ONLY from numbers readable in Page Text — e.g. "1.1k of its 1.2k total events are in the last 24h → spiking". If the graph exposes no per-period text, SAY the chart isn't machine-readable and report totals + first/last seen instead. Never invent a trend from a chart you can't read.
  3. Stream-level scan: compare `sort=freq&statsPeriod=24h` against `statsPeriod=7d` — near the top of 24h but not 7d = spiking.

  ### TASK: Resolve an issue (GATED — explicit user request only)
  1. Open the named issue → snapshot → confirm title + short id match the request (Rule 7).
  2. Click "Resolve" in the issue header [LIVE-VERIFY: a split button — click the plain "Resolve" part, NOT its dropdown arrow (that holds "in the next release" variants; use only if the user asked)].
  3. Snapshot → verify the status shows Resolved [LIVE-VERIFY: button/badge change]. Not verifiable after 2 snapshots → tell the user; do NOT re-click.
  4. Unresolve: same gate; on a resolved issue the control reads "Resolved" and unresolves via its menu [LIVE-VERIFY].

  ### TASK: Assign an issue (GATED — explicit user request only)
  1. Open the named issue → snapshot → confirm it → click the Assignee control (shows "Unassigned" or an avatar, header or sidebar [LIVE-VERIFY: location]).
  2. Snapshot → browser_type(assignee search input id, the person/team name) → snapshot → click the matching suggestion (teams are #-prefixed [LIVE-VERIFY]).
  3. Snapshot → verify Assignee shows that name. Ambiguous matches → ask the user, don't guess.

  ### TASK: Archive / ignore an issue (GATED — explicit user request only)
  1. Current Sentry says "Archive"; older UIs "Ignore" [LIVE-VERIFY: which this org shows] — treat the user's "ignore" and "archive" as the same action.
  2. Open the named issue → snapshot → confirm it → click the Archive button's plain part, not its dropdown (duration/count conditions; default archives until escalating [LIVE-VERIFY]).
  3. Snapshot → verify the status shows Archived/Ignored. Tell the user archived issues auto-return if they escalate [LIVE-VERIFY: escalation behavior].

  ### TASK: Release health [LIVE-VERIFY: needs session tracking configured]
  1. browser_navigate `/releases/` → snapshot. Rows: version, created date, adoption, crash-free sessions/users %, new-issue count [LIVE-VERIFY: columns]. Dashes or a "set up session tracking" prompt → health isn't configured; report that honestly.
  2. One release: click its row → snapshot → report crash-free rates, adoption, new issues, verbatim.

  ### TASK: Out-of-scope request (delete / alerts / settings / quotas — INTERCEPT, never perform)
  Asked to delete an issue/project, edit alert rules/integrations, or change anything under Settings/billing/quotas: do NOT open any such control or page. Explain this template is read-and-triage only and Settings pages hold secrets you don't handle. Offer what you CAN do: locate the issue, report its state, or resolve/assign/archive on their explicit request. Stop.

  ### Gotchas
  - An "issue" is a GROUP of identical events — its count is occurrences of one grouped error, not distinct bugs.
  - Issue URLs use numeric ids; short ids (e.g. BACKEND-1AB) appear in the UI and work in search [LIVE-VERIFY: bare or as issue: token]. Take numeric ids from row hrefs only.
  - The stream may open on a saved search — read the search bar's actual query from the snapshot before trusting the list.
  - The environment picker persists between visits; a report that "misses" an error is often scoped to the wrong environment — check it first.
