app_name: Google News
domains:
  - news.google.com
keywords:
  - headlines
  - top news
  - news about
  - latest news on
description: Google News — read Top stories, search news on any topic (with recency scoping), scan topic sections, and pull the multi-outlet Full coverage view of a story. Read-only aggregator; every headline is reported with its source.
version: 1
instructions: |
  URL: https://news.google.com

  ### THE ONE THING TO KNOW
  Google News is an AGGREGATOR: every card is a headline + SOURCE name + age, and clicking a story leaves Google entirely for the publisher's own site (arbitrary layouts, cookie walls, paywalls). Most requests are answered WITHOUT clicking any story: headlines, sources, and timestamps all land in Page Text. **ATTRIBUTION IS NON-NEGOTIABLE — never report a headline without naming its source** ("Reuters: …", "per The Verge, …"). This feeds briefings; an unattributed headline is a defect.

  ### RULES (each stated once — follow exactly)
  1. ONLY use: browser_navigate, browser_snapshot, browser_click, browser_type, browser_press_key, browser_hover, browser_scroll. browser_evaluate and browser_screenshot are BANNED for Google News. Never use desktop or sidecar tools.
  2. URL-FIRST: the front page and search have stable URLs (below). Navigate; don't type into the search box unless refining an already-open results page.
  3. READ, don't click: answer from Page Text wherever it carries what the user asked for. Click only to reach Full coverage, a topic section, or a story the user asked to open.
  4. UI LANGUAGE: labels are locale-translated (hl/gl params below). Match nav chips and buttons by MEANING/role, never exact English text on a non-English UI.
  5. browser_type REPLACES field content by default — correct for the search box.
  6. [id]s are 1-based and CHANGE with every snapshot — never reuse ids after the page changed.
  7. If an element is not found after 2 retry snapshots, tell the user what you were looking for and stop. No workarounds, no browser_evaluate.
  8. NEVER bypass a paywall or cookie wall on a publisher's site — no dismiss-hunting beyond one obvious consent button, no reader-mode tricks. Report what Page Text gives and say honestly that the rest is paywalled.

  ### State Recognition
  - **Consent interstitial** (EU / first run): URL contains consent.google.com, or a dialog asks to accept cookies → snapshot → click the accept-all button [LIVE-VERIFY: label localized, e.g. "Accept all"] → re-navigate to your target URL. Persists after 2 tries → tell the user and stop.
  - **No sign-in needed** for reading: Top stories, search, topic sections, and Full coverage all work logged-out. Sign-in is ONLY for personalization (Following, saved searches, "For you"). If such a task hits a sign-in prompt, tell the user to log in manually in the browser and stop — NEVER type credentials.
  - **Ready**: header nav chips are present (links meaning Home / For you / Following plus topic chips like Business, Technology [LIVE-VERIFY: rendered roles]).
  - **Loading**: page nearly empty, no story text → wait 2–3s, snapshot again. Max 2 retries, then tell the user.

  ### URL PATTERNS (the backbone)
  - **Top stories (front page)**: `https://news.google.com` — the Top stories block plus topic teasers.
  - **Search**: `https://news.google.com/search?q={query}` — URL-encode, spaces as `+`. Recency scoping: append a `when:` term to the QUERY itself, e.g. `?q=nvidia+when:24h` or `when:7d` [LIVE-VERIFY: when: operator honored]. Also supports quoted phrases and `-exclusions` like web search.
  - **Topic sections**: `/topics/{id}` URLs use OPAQUE ids that cannot be constructed. Reach sections by CLICKING the nav chip (Business / Technology / Sports / …) from the front page instead. Once open, the URL in the snapshot is reusable for this session.
  - **Language/region**: append `?hl={lang}&gl={country}` (e.g. `?hl=it&gl=IT`, on /search use `&`). Use when the user wants another edition; otherwise leave defaults.

  ### SNAPSHOT FORMAT
  ```
  Page: Google News
  URL: https://news.google.com/home?hl=en-US&gl=US
  --- Page Text ---
  Top stories  Fed holds rates steady …  Reuters  2 hours ago  More coverage …
  --- Interactive Elements ---
  [4] input "Search for topics, locations & sources"   [LIVE-VERIFY: exact label]
  [12] link "Technology"                                ← nav chip
  [31] link "Fed holds rates steady"                    ← story link (leaves to publisher)
  [33] link "Full coverage"                             [LIVE-VERIFY: may be icon-only, aria-label "Full coverage of this story"]
  ```
  Story cards read as clusters in Page Text: headline, then source name, then age ("2 hours ago"). Keep the triple together when reporting.

  ### TASK: Headlines briefing (Top stories)
  1. browser_navigate `https://news.google.com` → browser_snapshot.
  2. Page Text carries the Top stories block: headline + source + age per story. Report the top 5–8 as "SOURCE — headline (age)". This is the morning-brief backbone — no clicks needed.
  3. More below the fold: browser_scroll (~1500px) → snapshot once; if Page Text didn't change, report what you have.

  ### TASK: Search news about a topic
  1. browser_navigate `/search?q={query}` (add `when:24h` / `when:7d` to the query if the user scoped recency — "today", "this week") → snapshot.
  2. Results are story cards in Page Text: report headline + source + age. Nothing relevant → say so and suggest a broader query; do not loop rewording more than once.

  ### TASK: Topic-section scan (Technology / Business / …)
  1. Front page → snapshot → click the nav chip whose meaning matches the section (Rule 4) → snapshot.
  2. Report the section's top stories (source-attributed), keeping any sub-groupings ("Latest", highlighted clusters) visible in Page Text.

  ### TASK: Full coverage of a story (best balanced view)
  1. Find the story (front page or search) → snapshot → click its "Full coverage" link/button [LIVE-VERIFY: often an icon next to the cluster, aria-label ≈ "Full coverage of this story"; also reachable via the story card's ⋮ menu] → snapshot.
  2. The page groups MANY outlets on one story: main coverage, opinion, explainers, timelines. Report how different sources frame it — headline + source per entry. This is THE task for "give me a balanced view of X".

  ### TASK: Open a story (publisher handoff)
  1. Click the story link → snapshot. You are now on the PUBLISHER'S site — expect cookie dialogs, subscription walls, sign-up nags.
  2. One obvious consent/accept button may be clicked; then summarize the article text from Page Text, citing the outlet.
  3. Paywalled or truncated → report the source, what WAS readable, and say plainly the rest is behind the publisher's paywall (Rule 8); suggest Full coverage for free-to-read alternatives on the same story.

  ### TASK: Local news for a place
  1. browser_navigate `/search?q={city}+news` (e.g. `?q=Milan+news`, add `when:7d` for recent) → snapshot → report source-attributed headlines.
  2. Local outlet names may be unfamiliar — still name them; never launder a local story as generic "news reports".

  ### TASK: Follow a topic / personalization (requires sign-in — low priority)
  Only on explicit request: open the topic → click the button meaning "Follow" (star) [LIVE-VERIFY] → snapshot to verify state change. If a sign-in prompt appears, tell the user to log in manually and stop.

  ### Gotchas
  - Story links are google-redirect hrefs (`./read/…` or `./articles/…`), not the publisher URL — for "give me the link", click through and report the landed URL from the snapshot.
  - Ages ("2 hours ago") are relative to NOW in the edition's locale; convert to absolute dates when the user asks "when did this happen".
  - The same story repeats across sections; deduplicate by headline when compiling a briefing.
  - "For you"/"Following" tabs are personalized and need sign-in — for a neutral brief, stay on Top stories.
  - Search order mixes relevance and freshness — don't present it as importance; Top stories order IS editorial prominence.
