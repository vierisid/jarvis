app_name: Notion
domains:
  - notion.so
  - www.notion.so
keywords: []
description: Notion — open/create/rename pages, append blocks safely, todos, database rows, search, comments, share, move to trash.
version: 2
instructions: |
  URL: https://www.notion.so — a known page opens directly at
  https://www.notion.so/{page-title-slug}-{PAGE_ID} or https://www.notion.so/{PAGE_ID}
  (the bare ID redirects to the full URL).

  ### RULES (stated once — MUST follow)
  1. ONLY use: browser_navigate, browser_snapshot, browser_click, browser_type, browser_hover, browser_press_key, browser_scroll, browser_upload_file. browser_evaluate and browser_screenshot are BANNED. No desktop or other tools.
  2. [id]s are valid ONLY for the latest snapshot. Never reuse an id after any action and never guess ids. If an expected element is missing, re-snapshot; after 2 failed retries, tell the user what you were looking for and stop.
  3. One verify-snapshot after each state-changing action (page opened, dialog/menu opened, block created). Not after every keystroke, not zero.
  4. Notion auto-saves; there is no Save button. If you typed into the wrong block, browser_press_key "Ctrl+Z" undoes it.
  5. Chrome keeps several Ctrl shortcuts for itself (new window/tab, tab switching) — those keydowns never reach the page, so never improvise browser-level shortcuts. The ONLY keys this template uses: Enter, Escape, Tab, Shift+Tab, End, "/", Ctrl+K, Ctrl+Z.
  6. UI button labels are localized; user-set page titles and block text are stable. Match pages by title, controls by role/aria-label, and prefer the structural descriptions below over exact English text.

  ### TYPING MODEL — the #1 source of Notion bugs
  - browser_type CLEARS the target block first, then inserts text paste-like (insertText, no per-character keystrokes). With append:true it preserves existing content and inserts at the end instead.
  - NEVER "append" by plain-typing into an existing block — that ERASES the block. NEVER chain two plain browser_type calls into the same block — the second wipes the first.
  - Markdown autoformat ("# " + space → heading, "[] " → todo) and inline triggers (@mention, [[page link]]) depend on real per-key keystrokes and may NOT fire on paste-like insertion. Do not rely on them; use the two recipes below.

  **RECIPE A — new block at the end of a page (the only safe append):**
  1. snapshot → find the LAST body block (the lowest contenteditable in the main area)
  2. browser_click it → browser_press_key "End" (caret to end of block)
  3. browser_press_key "Enter" (real keydown → a new empty block is created below)
  4. snapshot → browser_type your text into the NEW empty contenteditable
  Repeat Enter → snapshot → type for each additional block. Each new block has a NEW id.

  **RECIPE B — set a block's type via the slash menu:**
  1. With the caret in an EMPTY block, browser_press_key "/" (real keydown — the slash menu opens)
  2. snapshot → menu is open. browser_type(append:true) the filter word into the block, e.g. "heading 1" or "to-do" [LIVE-VERIFY: whether paste-like insertion filters the menu; if it does not, skip filtering and pick from the unfiltered list]
  3. snapshot → CLICK the wanted menu entry (clicking is verifiable; do not arrow-key blind)
  4. snapshot → browser_type the content into the new empty block of that type

  ### STATE RECOGNITION (check after every navigate)
  - **Logged out**: marketing/landing page (pricing, "Get Notion free") or a login form ("Continue with Google", email code). SSO cannot be automated → tell the user to log into Notion in this browser, then stop.
  - **Loading**: near-empty snapshot or skeleton placeholders → re-snapshot (max 2 retries), then tell the user.
  - **Ready**: sidebar present (Search button + page-tree links with user-set titles) and the main area shows a page title contenteditable.

  ### ELEMENT MAP (roles/labels; get ids from the current snapshot)
  - Sidebar: "Search" button; a new-page button near the top [LIVE-VERIFY: label "New page" or a compose/pencil icon]; hovering a sidebar section header (e.g. Private) reveals a "+" add-page button [LIVE-VERIFY]; page-tree links whose text is the user-set page title (stable — match these).
  - Main area: page title = the topmost contenteditable (placeholder "Untitled"); each block = its own contenteditable, in page order; to-do blocks include a checkbox element beside the text.
  - Top-right: "Share" button; next to it a more-actions menu with a "..." icon [LIVE-VERIFY label].
  - Hover-rendered controls: block handles (drag dots, "+" insert) and per-block comment/action icons are NOT in the DOM until you browser_hover the block. Hover → snapshot → they appear → act immediately (they vanish when you hover elsewhere).

  ---

  ### TASK: Open an existing page
  Primary (click-first): snapshot → click the sidebar "Search" button → snapshot → browser_type the page name into the search input → snapshot → click the matching result → snapshot (verify the main-area title).
  Secondary: browser_press_key "Ctrl+K" opens the same search dialog (saves one click).
  If the page's link is already visible in the sidebar tree, just click it. If you know the URL, browser_navigate to it directly.

  ### TASK: Create a new page
  1. snapshot → click the sidebar new-page button (see ELEMENT MAP). Fallback: browser_hover a sidebar section header → snapshot → click its revealed "+" button.
  2. snapshot → a new page opens; find the title contenteditable (placeholder "Untitled")
  3. browser_type the title into it → browser_press_key "Enter" (focus moves into the first body block)
  4. snapshot → verify the title; add body content via RECIPE A / RECIPE B.

  ### TASK: Append text to an existing page
  Open the page, then RECIPE A. Never type into an existing block to "append" — replace-by-default deletes its content.

  ### TASK: Add a to-do item
  1. Open the page → RECIPE A steps 1–3 to get a fresh empty block at the end
  2. RECIPE B with filter "to-do" → click the "To-do list" entry [LIVE-VERIFY exact label]
  3. snapshot → browser_type the task text into the new to-do block
  4. Verify: the block now has a checkbox element beside the text.

  ### TASK: Check off / uncheck a to-do
  Open the page → snapshot → find the checkbox belonging to the target to-do (adjacent to the block containing that text) → browser_click it → snapshot: verify the state changed [LIVE-VERIFY how it shows: checked attribute vs struck-through text].

  ### TASK: Add a row to a database
  1. Open the page containing the database → snapshot
  2. Click the "New" button in the database's own toolbar [LIVE-VERIFY: top-right of the database block, label "New"]
  3. snapshot → a row peek panel opens; browser_type the row title into its title contenteditable
  4. Other properties: snapshot → click the property field → type into it or click an option in its menu
  5. browser_press_key "Escape" to close the peek → snapshot: the new row is listed.

  ### TASK: Search the workspace
  Sidebar "Search" button (or Ctrl+K) → browser_type the query → snapshot → read or click the results. Report actual result titles, never guesses.

  ### TASK: Comment on a block
  1. Open the page → snapshot → locate the target block by its text
  2. browser_hover that block → snapshot → hover controls are now present
  3. Click the comment control [LIVE-VERIFY: a comment icon may appear on the block directly, or open the block-handle menu and pick "Comment"]
  4. snapshot → browser_type the comment into the composer
  5. Click the composer's send/submit control (arrow icon) [LIVE-VERIFY: whether Enter submits or inserts a newline — do NOT assume; the click is the verifiable path]
  6. snapshot → the comment text appears in the thread.

  ### TASK: Share / invite someone
  1. Open the page → snapshot → click the "Share" button (top-right) → snapshot
  2. browser_type the invitee's email into the invite input [LIVE-VERIFY placeholder text] → snapshot → click the matching suggestion, then the "Invite" button
  3. CAUTION: any "Publish"/"Share to web" toggle makes the page PUBLIC — never touch it unless the user explicitly asked for a public link.

  ### TASK: Delete a page (move to trash)
  1. Open the page → snapshot → click the top-right more-actions ("...") menu (see ELEMENT MAP)
  2. snapshot → click the "Move to Trash" menu item — match it by label/trash icon, never by its position in the menu
  3. snapshot → verify the page is gone or a trash banner is shown. Destructive: if the item cannot be identified with confidence, stop and ask the user — do not click blind.

  ### TASK: Rename a page
  Open the page → snapshot → browser_click the title contenteditable → browser_type the new title (replace-by-default is CORRECT here — the old title should be replaced) → snapshot to verify. The sidebar link updates too.

  ### TASK: Indent / outdent a block
  Click into the block → browser_press_key "Tab" (nest under the block above) or "Shift+Tab" (outdent) → snapshot to verify the nesting.

  ### TASK: Upload an image
  1. RECIPE A steps 1–3 → RECIPE B with filter "image" → click the Image entry
  2. snapshot → an image placeholder with an upload option appears [LIVE-VERIFY: an "Upload" tab or button]
  3. Call browser_upload_file with the absolute file path (no selector needed — it targets the page's file input directly; do not click anything that could open a native OS picker). The file must live under the user's home directory; otherwise ask the user to move it there and stop.
  4. snapshot → the image renders in the block.

  ### Budgets
  Open page ≈ 5 calls · create page with title ≈ 5 · append one paragraph ≈ 7 · add a todo ≈ 9 · check a todo ≈ 4 · database row (title only) ≈ 7. If you exceed roughly double the budget, stop and reconsider instead of thrashing.
